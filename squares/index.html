<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Squares · Creative Experiments</title>
<meta name="description" content="Five by five. Every square flips a coin for an inner square. Hans's sketch, running live — shuffle for a new deal.">
<meta name="theme-color" content="#0d0d10">
<style>
@font-face {
  font-family: 'Fraunces'; font-style: normal; font-weight: 400; font-display: swap;
  src: url('../assets/fonts/Fraunces-400.woff2') format('woff2');
}
@font-face {
  font-family: 'Fraunces'; font-style: normal; font-weight: 600; font-display: swap;
  src: url('../assets/fonts/Fraunces-600.woff2') format('woff2');
}
@font-face {
  font-family: 'Plex Mono'; font-style: normal; font-weight: 400; font-display: swap;
  src: url('../assets/fonts/IBMPlexMono-400.woff2') format('woff2');
}
@font-face {
  font-family: 'Plex Mono'; font-style: normal; font-weight: 500; font-display: swap;
  src: url('../assets/fonts/IBMPlexMono-500.woff2') format('woff2');
}
:root {
  --wall: #0d0d10;
  --wall-deep: #08080a;
  --ink: #ece7db;
  --ink-soft: #a39d8e;
  --rule: #26262b;
  --gold: #d9a441;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--wall);
  color: var(--ink);
  font-family: 'Fraunces', Georgia, serif;
  -webkit-font-smoothing: antialiased;
}
::selection { background: var(--gold); color: #0d0d10; }
body::before {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 50; opacity: .5;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.05'/%3E%3C/svg%3E");
}
.wrap { max-width: 1080px; margin: 0 auto; padding: 0 28px; }
.mono { font-family: 'Plex Mono', ui-monospace, monospace; }
a { color: inherit; }

header.book { padding: 56px 0 36px; border-bottom: 1px solid var(--rule); }
.back { display: inline-block; font-family: 'Plex Mono', monospace; font-size: 12px;
  letter-spacing: .18em; text-transform: uppercase; color: var(--ink-soft);
  text-decoration: none; margin-bottom: 28px; }
.back:hover { color: var(--gold); }
.kicker { font-family: 'Plex Mono', monospace; font-size: 12px; letter-spacing: .32em;
  text-transform: uppercase; color: var(--gold); margin: 0 0 18px; }
h1.title { font-size: clamp(40px, 6vw, 68px); font-weight: 600; line-height: 1.02;
  margin: 0 0 18px; letter-spacing: -0.01em; }
p.lede { font-size: 19px; line-height: 1.55; color: var(--ink-soft); max-width: 62ch; margin: 0; }
p.lede strong { color: var(--ink); font-weight: 600; }

section.study { padding: 56px 0; border-bottom: 1px solid var(--rule); }
.stage { position: relative; border: 1px solid var(--rule); background: #f4f1ea;
  max-width: 600px; margin: 0 auto; }
.stage canvas { display: block; width: 100%; height: auto; aspect-ratio: 1 / 1; }
.controls { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 18px; align-items: center;
  max-width: 600px; margin-left: auto; margin-right: auto; }
button.act {
  font-family: 'Plex Mono', monospace; font-size: 13px; letter-spacing: .12em; text-transform: uppercase;
  background: transparent; color: var(--ink); border: 1px solid var(--rule);
  padding: 12px 22px; cursor: pointer; transition: border-color .2s, color .2s;
}
button.act:hover { border-color: var(--gold); color: var(--gold); }
button.act:active { transform: translateY(1px); }
.seedline { font-family: 'Plex Mono', monospace; font-size: 12px; color: var(--ink-soft); }

.ref-grid { display: grid; grid-template-columns: 1fr; gap: 18px; margin-top: 26px; max-width: 600px; }
.ref-grid figure { margin: 0; border: 1px solid var(--rule); background: var(--wall-deep); }
.ref-grid figcaption { font-family: 'Plex Mono', monospace; font-size: 11px; letter-spacing: .14em;
  text-transform: uppercase; color: var(--ink-soft); padding: 10px 12px; }
.ref-grid pre { margin: 0; padding: 18px; overflow-x: auto; font-family: 'Plex Mono', monospace;
  font-size: 12px; line-height: 1.6; color: var(--ink-soft); white-space: pre-wrap; }

footer.colo { padding: 40px 0 64px; color: var(--ink-soft); font-size: 14px; }
footer.colo a { color: var(--ink-soft); }
footer.colo a:hover { color: var(--gold); }
</style>
</head>
<body>

<header class="book">
  <div class="wrap">
    <a class="back" href="../">&larr; The sketchbook</a>
    <p class="kicker">Creative Experiments &middot; № 09</p>
    <h1 class="title">Squares</h1>
    <p class="lede">Five by five. Every square flips a coin for an inner square. <strong>His sketch, running live</strong> &mdash; shuffle for a new deal.</p>
  </div>
</header>

<main class="wrap">

  <section class="study" id="piece">
    <div class="stage">
      <canvas id="sq" width="600" height="600" aria-label="Squares: a five by five grid of stroked squares, some with inner squares"></canvas>
    </div>
    <div class="controls">
      <button class="act" id="shuffleBtn" type="button">Shuffle</button>
      <span class="seedline mono" id="seedLine"></span>
    </div>
  </section>

  <section class="study" id="reference">
    <div class="ref-grid">
      <figure>
        <figcaption>The original &mdash; squares.html, uploaded by Hans, 1 Nov 2026</figcaption>
        <pre id="origSrc"></pre>
      </figure>
    </div>
  </section>

</main>

<footer class="colo">
  <div class="wrap">
    <p><a href="../">&larr; Back to the sketchbook</a> &middot; Squares, drawn in code. Kept by <a href="https://github.com/builtbysai">Hans</a>.</p>
  </div>
</footer>

<script>
'use strict';
/* Squares — Hans's sketch, verbatim logic, running live. */
const canvas = document.getElementById('sq');
const contex = canvas.getContext('2d');
const seedLine = document.getElementById('seedLine');

function draw() {
  contex.clearRect(0, 0, 600, 600);
  contex.strokeStyle = '#1a1a1a';
  contex.lineWidth = 2;
  const width = 60;
  const height = 60;
  const gap = 20;
  let x, y;
  let inners = 0;
  for (let i = 0; i < 5; i++) {
    for (let j = 0; j < 5; j++) {
      x = 100 + (width + gap) * i;
      y = 100 + (height + gap) * j;
      contex.beginPath();
      contex.rect(x, y, width, height);
      contex.stroke();
      if (Math.random() < 0.5) {
        contex.beginPath();
        contex.rect(x + 8, y + 8, width - 16, height - 16);
        contex.stroke();
        inners++;
      }
    }
  }
  seedLine.textContent = inners + ' of 25 drew an inner square';
}
draw();
document.getElementById('shuffleBtn').addEventListener('click', draw);

// show the original source
fetch('reference/squares-original.html')
  .then(r => r.text())
  .then(t => { document.getElementById('origSrc').textContent = t; })
  .catch(() => { document.getElementById('origSrc').textContent = '(original kept in reference/)'; });
</script>
</body>
</html>
