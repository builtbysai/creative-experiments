<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Peacock in Autumn · Creative Experiments</title>
<meta name="description" content="A peacock built from autumn leaves: a fanned tail of leaflets and filaments, chalk smoke, and real leaves scattered into the drawing until the two are one thing.">
<meta name="theme-color" content="#171310">
<style>
  @font-face {
    font-family: 'Fraunces'; font-style: normal; font-weight: 600; font-display: swap;
    src: url('../assets/fonts/Fraunces-600.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Plex Mono'; font-style: normal; font-weight: 400; font-display: swap;
    src: url('../assets/fonts/IBMPlexMono-400.woff2') format('woff2');
  }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #171310; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
  .ui { position: fixed; z-index: 3; color: #e9dfca; font-family: 'Plex Mono', monospace; }
  .back { top: 18px; left: 20px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
  .back a { color: inherit; text-decoration: none; opacity: .75; }
  .back a:hover { opacity: 1; }
  .cap { left: 20px; bottom: 18px; pointer-events: none; }
  .cap h1 { font-family: 'Fraunces', serif; font-weight: 600; font-size: 22px; margin: 0 0 4px; letter-spacing: .01em; }
  .cap p { margin: 0; font-size: 12px; opacity: .72; max-width: 340px; line-height: 1.5; }
  .colo { right: 20px; bottom: 18px; font-size: 12px; opacity: .75; pointer-events: none; }
  .colo a { color: inherit; }
  @media (max-width: 560px) { .cap p { display: none; } .cap h1 { font-size: 19px; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui back"><a href="../">&larr; Creative Experiments</a></div>
<div class="ui cap">
  <h1>Peacock in Autumn</h1>
  <p>A bird built the way Niu Yifei builds them: drawn feathers above, real fallen leaves below, until you cannot say where the drawing ends.</p>
</div>
<div class="ui colo">Kept by Hans &middot; <a href="https://github.com/builtbysai/creative-experiments/tree/main/peacock">source</a></div>
<script>
(function () {
  "use strict";

  // A peacock composed the way a leaf collage is composed: hundreds of
  // small leaves, laid one by one. The tail is a fan of filament strands
  // carrying leaflets that run teal to gold to rust; the ground is dark
  // earth, chalk smoke, and fallen leaves that frame the bird and then
  // wander into it. A few leaves never rest: they fall, forever, slowly.

  var AUTUMN = ['#d9a441', '#e07b2a', '#b4502a', '#9e2f23', '#7a7a35', '#e5c04f', '#c96a2e', '#8f3b2c'];
  var RAMP = ['#27655f', '#3d7a5e', '#7a8b3d', '#c9932f', '#e07b2a', '#b4502a'];

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, S = 0;
  var groundCv = null, bodyCv = null, frontCv = null;
  var strands = [];
  var drifters = [];
  var gusts = [];
  var wind = { x: 0, y: 0, t: 0 };
  var seed = 20261023;

  function mulberry(s) {
    var a = s >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var R = mulberry(seed);

  function lerp(a, b, t) { return a + (b - a) * t; }
  function rampAt(t) {
    var x = Math.max(0, Math.min(0.999, t)) * RAMP.length;
    return RAMP[Math.floor(x)];
  }
  function hexRgb(h) {
    return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  }
  function rgba(h, a) {
    var c = hexRgb(h);
    return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
  }
  function lerpColor(h1, h2, t) {
    var a = hexRgb(h1), b = hexRgb(h2);
    return 'rgb(' + Math.round(lerp(a[0], b[0], t)) + ',' + Math.round(lerp(a[1], b[1], t)) + ',' + Math.round(lerp(a[2], b[2], t)) + ')';
  }
  // Shared stage geometry: where the bird stands, how big it is.
  function layout() {
    var bx = W * (W > H ? 0.35 : 0.44), by = H * 0.52;
    var rx = Math.min(W * 0.17, H * 0.135);
    return { bx: bx, by: by, rx: rx, ry: rx * 0.72 };
  }

  // One leaf, tip pointing up, base at origin.
  function leaf(g, len, wid, col, veinAlpha) {
    g.fillStyle = col;
    g.beginPath();
    g.moveTo(0, 0);
    g.quadraticCurveTo(wid, -len * 0.38, 0, -len);
    g.quadraticCurveTo(-wid, -len * 0.38, 0, 0);
    g.fill();
    g.strokeStyle = 'rgba(30,16,8,' + veinAlpha + ')';
    g.lineWidth = Math.max(0.6, len * 0.03);
    g.beginPath();
    g.moveTo(0, -len * 0.06);
    g.lineTo(0, -len * 0.92);
    g.stroke();
  }

  function drawLeafAt(g, x, y, len, wid, rot, col, veinAlpha) {
    g.save();
    g.translate(x, y);
    g.rotate(rot);
    leaf(g, len, wid, col, veinAlpha);
    g.restore();
  }

  // ---------- static ground: earth, chalk smoke, star flower, fallen leaves
  function buildGround() {
    groundCv = document.createElement('canvas');
    groundCv.width = Math.floor(W * DPR); groundCv.height = Math.floor(H * DPR);
    var g = groundCv.getContext('2d');
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    var rg = R;

    var grad = g.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#2b211a');
    grad.addColorStop(0.55, '#211a15');
    grad.addColorStop(1, '#171310');
    g.fillStyle = grad;
    g.fillRect(0, 0, W, H);

    // mottled earth
    for (var i = 0; i < 240; i++) {
      var x = rg() * W, y = rg() * H, r = 20 + rg() * 90;
      var blob = g.createRadialGradient(x, y, 0, x, y, r);
      var light = rg() > 0.5;
      blob.addColorStop(0, light ? 'rgba(214,186,150,0.05)' : 'rgba(0,0,0,0.07)');
      blob.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = blob;
      g.fillRect(x - r, y - r, r * 2, r * 2);
    }

    // chalk smoke: pale aqua wisps curling around where the bird will stand
    var wisps = [
      { x: 0.30, y: 0.34, r: 0.34 }, { x: 0.52, y: 0.62, r: 0.42 },
      { x: 0.66, y: 0.30, r: 0.30 }, { x: 0.38, y: 0.80, r: 0.36 },
      { x: 0.80, y: 0.66, r: 0.30 }
    ];
    for (i = 0; i < wisps.length; i++) {
      var w = wisps[i];
      var wx = w.x * W, wy = w.y * H, wr = w.r * S;
      var sm = g.createRadialGradient(wx, wy, 0, wx, wy, wr);
      sm.addColorStop(0, 'rgba(191,227,221,0.10)');
      sm.addColorStop(0.6, 'rgba(191,227,221,0.045)');
      sm.addColorStop(1, 'rgba(191,227,221,0)');
      g.fillStyle = sm;
      g.fillRect(wx - wr, wy - wr, wr * 2, wr * 2);
    }
    // smoke curls: a few open arcs, chalk-like
    g.strokeStyle = 'rgba(220,232,226,0.045)';
    for (i = 0; i < 6; i++) {
      g.lineWidth = 1 + rg() * 1.6;
      g.beginPath();
      var ax = rg() * W, ay = rg() * H, ar = 24 + rg() * 90, a0 = rg() * 6.28;
      g.arc(ax, ay, ar, a0, a0 + 1.2 + rg() * 1.6);
      g.stroke();
    }

    // chalk dust
    for (i = 0; i < 2600; i++) {
      g.fillStyle = rg() > 0.6 ? 'rgba(233,223,202,0.06)' : 'rgba(0,0,0,0.10)';
      g.fillRect(rg() * W, rg() * H, 1.3, 1.3);
    }

    // the little star flower the bird is looking at
    var L0 = layout();
    var fx = L0.bx - L0.rx * 1.66, fy = L0.by + L0.ry * 0.62;
    for (i = 0; i < 8; i++) {
      drawLeafAt(g, fx, fy, 15 + rg() * 7, 4.5, (i / 8) * 6.283 + 0.4, i % 2 ? '#9e2f23' : '#b4502a', 0.35);
    }
    g.fillStyle = '#d43a2a';
    g.beginPath(); g.arc(fx, fy, 3.4, 0, 6.283); g.fill();

    // fallen leaves: dense at the frame edges, sparse in the middle
    for (i = 0; i < 130; i++) {
      var edge = rg();
      var lx, ly;
      if (edge < 0.30) { lx = rg() * W; ly = Math.pow(rg(), 1.8) * H * 0.17; }
      else if (edge < 0.62) { lx = rg() * W; ly = H - Math.pow(rg(), 1.7) * H * 0.20; }
      else if (edge < 0.74) { lx = Math.pow(rg(), 1.8) * W * 0.10; ly = rg() * H; }
      else if (edge < 0.86) { lx = W - Math.pow(rg(), 1.8) * W * 0.10; ly = rg() * H; }
      else { lx = rg() * W; ly = rg() * H; }
      var ls = 13 + rg() * 30;
      g.save();
      g.translate(lx + 2, ly + 3);
      g.rotate(rg() * 6.28);
      g.globalAlpha = 0.28;
      leaf(g, ls, ls * 0.42, '#000000', 0);
      g.restore();
      g.globalAlpha = 1;
      drawLeafAt(g, lx, ly, ls, ls * 0.42, rg() * 6.28, AUTUMN[(rg() * AUTUMN.length) | 0], 0.30);
    }
  }

  // ---------- the bird's body, baked once
  function buildBody() {
    bodyCv = document.createElement('canvas');
    bodyCv.width = Math.floor(W * DPR); bodyCv.height = Math.floor(H * DPR);
    var g = bodyCv.getContext('2d');
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    var rg = mulberry(seed + 7);

    var L = layout();
    var bx = L.bx, by = L.by, rx = L.rx, ry = L.ry;

    // ground shadow
    var sh = g.createRadialGradient(bx, by + ry * 1.55, 0, bx, by + ry * 1.55, rx * 1.5);
    sh.addColorStop(0, 'rgba(0,0,0,0.42)');
    sh.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = sh;
    g.fillRect(bx - rx * 1.5, by + ry * 0.4, rx * 3, ry * 2.4);

    // tail base mound (body colour flowing into the fan)
    g.fillStyle = '#7c4419';
    g.beginPath();
    g.ellipse(bx + rx * 0.74, by - ry * 0.36, rx * 0.38, ry * 0.40, -0.5, 0, 6.283);
    g.fill();
    g.fillStyle = '#b06a20';
    g.beginPath();
    g.ellipse(bx + rx * 0.70, by - ry * 0.40, rx * 0.24, ry * 0.24, -0.5, 0, 6.283);
    g.fill();

    // main body
    var bg = g.createLinearGradient(bx - rx, by - ry, bx + rx * 0.6, by + ry);
    bg.addColorStop(0, '#2e8fa3');
    bg.addColorStop(0.45, '#1f6f8e');
    bg.addColorStop(0.8, '#175a74');
    bg.addColorStop(1, '#0f4258');
    g.fillStyle = bg;
    g.beginPath();
    g.ellipse(bx, by, rx, ry, -0.32, 0, 6.283);
    g.fill();
    // underbody shade and a lit breast, so the body is not a balloon
    g.save();
    g.beginPath();
    g.ellipse(bx, by, rx, ry, -0.32, 0, 6.283);
    g.clip();
    var ub = g.createLinearGradient(0, by + ry * 0.1, 0, by + ry * 1.05);
    ub.addColorStop(0, 'rgba(4,24,34,0)');
    ub.addColorStop(1, 'rgba(4,24,34,0.5)');
    g.fillStyle = ub;
    g.fillRect(bx - rx, by, rx * 2, ry * 1.1);
    var br = g.createRadialGradient(bx - rx * 0.45, by - ry * 0.3, 0, bx - rx * 0.45, by - ry * 0.3, rx * 0.85);
    br.addColorStop(0, 'rgba(140,225,215,0.20)');
    br.addColorStop(1, 'rgba(140,225,215,0)');
    g.fillStyle = br;
    g.fillRect(bx - rx * 1.3, by - ry * 1.2, rx * 1.8, ry * 2);
    g.restore();

    // breast scales: rows of small aqua petals
    for (var row = 0; row < 6; row++) {
      var v = row / 6;
      for (var k = 0; k < 7; k++) {
        var u = k / 7;
        var px = bx - rx * 0.78 + u * rx * 0.95 + (row % 2) * 5;
        var py = by - ry * 0.55 + v * ry * 1.15;
        var dx = (px - bx) / rx, dy = (py - by) / ry;
        if (dx * dx + dy * dy > 0.82) continue;
        g.save();
        g.translate(px, py);
        g.rotate(0.9 + (rg() - 0.5) * 0.3);
        g.globalAlpha = 0.34;
        leaf(g, 13, 5.5, '#6fd3c2', 0.15);
        g.restore();
      }
    }
    g.globalAlpha = 1;

    // neck: rises from the breast, arches, and bows down to the head,
    // which hangs low over the little star flower
    var neck = [
      { x: bx - rx * 0.60, y: by - ry * 0.28 },
      { x: bx - rx * 0.92, y: by - ry * 1.10 },
      { x: bx - rx * 1.00, y: by - ry * 1.86 },
      { x: bx - rx * 1.30, y: by - ry * 2.02 },
      { x: bx - rx * 1.50, y: by - ry * 1.30 }
    ];
    var widths = [ry * 0.60, ry * 0.47, ry * 0.38, ry * 0.31, ry * 0.26];
    // Catmull-Rom through the keypoints, so the neck is one smooth bow
    function cr(p0, p1, p2, p3, t) {
      var t2 = t * t, t3 = t2 * t;
      return {
        x: 0.5 * ((2 * p1.x) + (-p0.x + p2.x) * t + (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * t2 + (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * t3),
        y: 0.5 * ((2 * p1.y) + (-p0.y + p2.y) * t + (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * t2 + (-p0.y + 3 * p1.y - 3 * p2.y + p3.y) * t3)
      };
    }
    var path = [];
    for (var seg = 0; seg < neck.length - 1; seg++) {
      var p0 = neck[Math.max(0, seg - 1)], p1 = neck[seg], p2 = neck[seg + 1], p3 = neck[Math.min(neck.length - 1, seg + 2)];
      for (var st = 0; st < 16; st++) path.push(cr(p0, p1, p2, p3, st / 16));
    }
    path.push(neck[neck.length - 1]);
    for (var pi = 0; pi < path.length - 1; pi++) {
      var gt = pi / (path.length - 1);
      var wseg = Math.min(widths.length - 1.001, gt * (widths.length - 1));
      var wdt = lerp(widths[Math.floor(wseg)], widths[Math.floor(wseg) + 1], wseg % 1);
      g.strokeStyle = lerpColor('#2f9db4', '#175d7c', gt);
      g.lineWidth = wdt;
      g.lineCap = 'round';
      g.beginPath();
      g.moveTo(path[pi].x, path[pi].y);
      g.lineTo(path[pi + 1].x, path[pi + 1].y);
      g.stroke();
    }

    // head
    var hx = neck[neck.length - 1].x, hy = neck[neck.length - 1].y;
    g.save();
    g.translate(hx, hy);
    g.rotate(0.5);
    var hg = g.createLinearGradient(0, -ry * 0.3, 0, ry * 0.3);
    hg.addColorStop(0, '#45b7c9');
    hg.addColorStop(1, '#1a6a8c');
    g.fillStyle = hg;
    g.beginPath();
    g.ellipse(0, 0, ry * 0.34, ry * 0.26, 0, 0, 6.283);
    g.fill();
    g.restore();
    // beak, slim, angled down toward the flower
    g.fillStyle = '#cdbb96';
    g.beginPath();
    g.moveTo(hx - ry * 0.22, hy + ry * 0.02);
    g.lineTo(hx - ry * 0.52, hy + ry * 0.40);
    g.lineTo(hx - ry * 0.10, hy + ry * 0.20);
    g.closePath();
    g.fill();
    // eye
    g.fillStyle = '#10131a';
    g.beginPath(); g.arc(hx - ry * 0.10, hy - ry * 0.05, ry * 0.055, 0, 6.283); g.fill();
    g.fillStyle = 'rgba(255,255,255,0.9)';
    g.beginPath(); g.arc(hx - ry * 0.12, hy - ry * 0.07, ry * 0.02, 0, 6.283); g.fill();
    // crest: three bare stems tipped with berries, as in the reference
    for (var ci = 0; ci < 3; ci++) {
      var ca = -0.5 + ci * 0.38;
      var cx2 = hx + Math.sin(ca) * ry * 0.44, cy2 = hy - ry * 0.24 - Math.cos(ca) * ry * 0.4;
      g.strokeStyle = '#173d2e';
      g.lineWidth = 1.4;
      g.beginPath();
      g.moveTo(hx + Math.sin(ca) * ry * 0.1, hy - ry * 0.2);
      g.lineTo(cx2, cy2);
      g.stroke();
      g.fillStyle = '#c23325';
      g.beginPath(); g.arc(cx2, cy2, ry * 0.075, 0, 6.283); g.fill();
      g.fillStyle = '#e0573f';
      g.beginPath(); g.arc(cx2 - ry * 0.025, cy2 - ry * 0.025, ry * 0.028, 0, 6.283); g.fill();
    }

    // legs
    g.strokeStyle = '#241a10';
    g.lineWidth = Math.max(2, ry * 0.075);
    g.lineCap = 'round';
    for (var li = 0; li < 2; li++) {
      var lx = bx - rx * 0.1 + li * rx * 0.34, ly0 = by + ry * 0.78, ly1 = by + ry * 1.62;
      g.beginPath();
      g.moveTo(lx, ly0);
      g.lineTo(lx + (li ? 4 : -3), ly1);
      g.stroke();
      g.lineWidth = Math.max(1.4, ry * 0.05);
      g.beginPath();
      g.moveTo(lx + (li ? 4 : -3), ly1);
      g.lineTo(lx - 7 + (li ? 4 : 0), ly1 + 4);
      g.moveTo(lx + (li ? 4 : -3), ly1);
      g.lineTo(lx + 1 + (li ? 4 : 0), ly1 + 5);
      g.moveTo(lx + (li ? 4 : -3), ly1);
      g.lineTo(lx + 9 + (li ? 4 : 0), ly1 + 3);
      g.stroke();
      g.lineWidth = Math.max(2, ry * 0.075);
    }
  }

  // ---------- foreground leaves (drawn over the bird's feet)
  function buildFront() {
    frontCv = document.createElement('canvas');
    frontCv.width = Math.floor(W * DPR); frontCv.height = Math.floor(H * DPR);
    var g = frontCv.getContext('2d');
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    var rg = mulberry(seed + 13);
    for (var i = 0; i < 22; i++) {
      var lx = rg() * W, ly = H - Math.pow(rg(), 2.2) * H * 0.13;
      var ls = 16 + rg() * 30;
      drawLeafAt(g, lx, ly, ls, ls * 0.42, rg() * 6.28, AUTUMN[(rg() * AUTUMN.length) | 0], 0.3);
    }
  }

  // ---------- the fan
  function buildStrands() {
    strands = [];
    var rg = mulberry(seed + 29);
    var L = layout();
    var ox = L.bx + L.rx * 0.72, oy = L.by - L.ry * 0.34;
    var reach = 0.60 * Math.max(W, H);
    var N = 27;
    for (var s = 0; s < N; s++) {
      var t = s / (N - 1);
      var ang = lerp(-1.82, 0.22, t) + (rg() - 0.5) * 0.05;   // up, then right
      var L = reach * (0.52 + 0.48 * Math.sin(Math.PI * Math.pow(t, 0.85))) * (0.92 + rg() * 0.16);
      var dirx = Math.cos(ang), diry = Math.sin(ang);
      var bow = (rg() - 0.35) * 0.16;
      var cxp = ox + dirx * L * 0.5 - diry * L * bow;
      var cyp = oy + diry * L * 0.5 + dirx * L * bow;
      var ex = ox + dirx * L, ey = oy + diry * L;
      strands.push({
        ox: ox, oy: oy, cx: cxp, cy: cyp, ex: ex, ey: ey, L: L,
        phase: rg() * 6.28, eye: (s % 3 === 1), off: (rg() - 0.5) * 0.5
      });
    }
  }

  function qPoint(st, u) {
    var a = (1 - u) * (1 - u), b = 2 * (1 - u) * u, c = u * u;
    return {
      x: a * st.ox + b * st.cx + c * st.ex,
      y: a * st.oy + b * st.cy + c * st.ey,
      tx: 2 * (1 - u) * (st.cx - st.ox) + 2 * u * (st.ex - st.cx),
      ty: 2 * (1 - u) * (st.cy - st.oy) + 2 * u * (st.ey - st.cy)
    };
  }

  function drawTail(now) {
    var t = now / 1000;
    for (var s = 0; s < strands.length; s++) {
      var st = strands[s];
      // filaments
      ctx.strokeStyle = 'rgba(84,110,120,0.4)';
      ctx.lineWidth = 1.1;
      ctx.beginPath();
      ctx.moveTo(st.ox, st.oy);
      ctx.quadraticCurveTo(st.cx, st.cy, st.ex, st.ey);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(84,110,120,0.16)';
      ctx.beginPath();
      ctx.moveTo(st.ox, st.oy);
      ctx.quadraticCurveTo(st.cx + 5, st.cy + 3, st.ex, st.ey);
      ctx.stroke();
      // leaflets
      var n = Math.max(9, Math.floor(st.L / 17));
      for (var j = 2; j <= n; j++) {
        var u = j / n;
        var p = qPoint(st, u);
        var tang = Math.atan2(p.ty, p.tx);
        var sway = Math.sin(t * 0.6 + st.phase + u * 2.2) * 0.045;
        var side = (j % 2 === 0) ? 1 : -1;
        var llen = (10 + 15 * Math.sin(Math.PI * Math.min(1, u * 1.06))) * (S / 620);
        drawLeafAt(ctx, p.x, p.y, llen, llen * 0.36,
          tang + Math.PI / 2 + side * (0.62 + st.off * 0.2) + sway,
          rampAt(u * 0.92 + st.off * 0.06), 0.22);
      }
      // eye spot near the tip of chosen strands
      if (st.eye) {
        var ep = qPoint(st, 0.94);
        var ea = Math.atan2(ep.ty, ep.tx) + Math.PI / 2;
        ctx.save();
        ctx.translate(ep.x, ep.y);
        ctx.rotate(ea);
        var es = S / 620;
        ctx.fillStyle = '#c9932f';
        ctx.beginPath(); ctx.ellipse(0, 0, 10 * es, 15 * es, 0, 0, 6.283); ctx.fill();
        ctx.fillStyle = '#1f6f6a';
        ctx.beginPath(); ctx.ellipse(0, 0, 7 * es, 11 * es, 0, 0, 6.283); ctx.fill();
        ctx.fillStyle = '#27356e';
        ctx.beginPath(); ctx.ellipse(0, 1 * es, 4.2 * es, 7 * es, 0, 0, 6.283); ctx.fill();
        ctx.fillStyle = '#57c1b6';
        ctx.beginPath(); ctx.ellipse(0, 2.4 * es, 2 * es, 3.4 * es, 0, 0, 6.283); ctx.fill();
        ctx.restore();
      }
    }
  }

  // ---------- leaves that never rest
  function spawnDrifter(top) {
    return {
      x: R() * W, y: top ? -30 : R() * H,
      len: 13 + R() * 15, rot: R() * 6.28, rotV: (R() - 0.5) * 0.7,
      vy: 11 + R() * 10, sway: R() * 6.28, swayAmp: 14 + R() * 22,
      col: AUTUMN[(R() * AUTUMN.length) | 0], vx: 0
    };
  }

  function frame(now) {
    var t = now / 1000;
    ctx.drawImage(groundCv, 0, 0, W, H);
    drawTail(now);
    ctx.drawImage(bodyCv, 0, 0, W, H);
    ctx.drawImage(frontCv, 0, 0, W, H);

    var dt = 1 / 60;
    for (var i = 0; i < drifters.length; i++) {
      var d = drifters[i];
      d.y += d.vy * dt;
      d.sway += dt * 0.7;
      d.x += Math.sin(d.sway) * d.swayAmp * dt + d.vx * dt;
      d.vx *= 0.94;
      d.rot += d.rotV * dt;
      if (wind.t > now - 900) {
        var dx = d.x - wind.x, dy = d.y - wind.y;
        var dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 130 && dist > 1) d.vx += (dx / dist) * 26 * dt * 8;
      }
      if (d.y > H + 34) drifters[i] = spawnDrifter(true);
      ctx.save();
      ctx.globalAlpha = 0.92;
      drawLeafAt(ctx, d.x, d.y, d.len, d.len * 0.42, d.rot, d.col, 0.3);
      ctx.restore();
    }
    // gust leaves
    for (var gi = gusts.length - 1; gi >= 0; gi--) {
      var gu = gusts[gi];
      gu.age += dt;
      gu.x += gu.vx * dt; gu.y += gu.vy * dt;
      gu.vy += 26 * dt; gu.vx *= 0.985; gu.vy *= 0.995;
      gu.rot += gu.rotV * dt;
      var life = 1 - gu.age / gu.ttl;
      if (life <= 0) { gusts.splice(gi, 1); continue; }
      ctx.save();
      ctx.globalAlpha = Math.min(1, life * 1.6) * 0.95;
      drawLeafAt(ctx, gu.x, gu.y, gu.len, gu.len * 0.42, gu.rot, gu.col, 0.3);
      ctx.restore();
    }

    requestAnimationFrame(frame);
  }

  canvas.addEventListener('pointermove', function (e) {
    wind.x = e.clientX; wind.y = e.clientY; wind.t = performance.now();
  });
  canvas.addEventListener('pointerdown', function (e) {
    for (var i = 0; i < 7; i++) {
      var a = R() * 6.28, sp = 24 + R() * 60;
      gusts.push({
        x: e.clientX, y: e.clientY, len: 12 + R() * 14,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 34,
        rot: R() * 6.28, rotV: (R() - 0.5) * 3.4,
        col: AUTUMN[(R() * AUTUMN.length) | 0], age: 0, ttl: 2.6 + R() * 1.6
      });
    }
  });

  var DPR = 1;
  function build() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    S = Math.min(W, H);
    R = mulberry(seed);
    buildGround();
    buildStrands();
    buildBody();
    buildFront();
    drifters = [];
    for (var i = 0; i < 9; i++) drifters.push(spawnDrifter(false));
  }

  window.addEventListener('resize', build);
  build();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
