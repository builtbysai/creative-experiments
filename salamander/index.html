<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Salamander · a procedural sketch</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #042e27; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
/*
 * Procedural salamander — jewel edition.
 *
 * An elegant naturalistic salamander on a deep teal pond. The body is
 * a spine chain rendered as layered countershaded silhouettes (dark
 * dorsal -> light edge), gold marbling in body space, and a soft rim
 * glow. Legs are tapered segments with proper toes (4 front / 5 hind),
 * feet planted in the world frame, asymmetric step cycle.
 *
 * Click: the body shatters into 6 parts. Each part tumbles, then seeks
 * its station behind the part ahead and docks — the animal reassembles
 * itself in order.
 */
const N = 24;
const CUTS = [0, 4, 8, 12, 16, 20, 24]; // 6 parts
const SEG = 16;

// palette: jewel pond
const BG_TOP = '#0a6b5c', BG_BOT = '#022a23';
const EDGE = '#7fa05c';      // light moss edge
const MID = '#4c6e44';       // mid moss
const DORSAL = '#2c4a2e';    // dark dorsal
const GOLD = 'rgba(224,179,78,0.20)';
const RIM = 'rgba(255,244,200,0.28)';
const IRIS_A = '#f0b43e', IRIS_B = '#7a4d15';

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, S = 1, DPR = 1;
let bgGrad = null;
const motes = [];

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  S = Math.min(W, H) / 620;
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  bgGrad = ctx.createRadialGradient(W / 2, H * 0.35, 10, W / 2, H / 2, Math.max(W, H) * 0.75);
  bgGrad.addColorStop(0, BG_TOP);
  bgGrad.addColorStop(1, BG_BOT);
}
window.addEventListener('resize', resize);
resize();
for (let i = 0; i < 36; i++) {
  motes.push({ x: Math.random(), y: Math.random(), r: 1 + Math.random() * 2.5,
               a: 0.04 + Math.random() * 0.09, vx: (Math.random() - 0.5) * 0.0004,
               vy: -0.0002 - Math.random() * 0.0005, ph: Math.random() * 6 });
}

const WIDTHS = [6.5, 9.5, 11.5, 10, 8, 9, 10, 11, 11.5, 11.5, 11, 10.5, 10, 9.5,
                8.6, 7.6, 6.6, 5.6, 4.7, 3.9, 3.2, 2.6, 2.0, 1.5];
function halfWidth(i) {
  i = Math.max(0, Math.min(WIDTHS.length - 1, i));
  const lo = Math.floor(i), hi = Math.ceil(i), t = i - lo;
  return WIDTHS[lo] * (1 - t) + WIDTHS[hi] * t;
}
function hash(n) { const x = Math.sin(n * 127.1) * 43758.5453; return x - Math.floor(x); }

function solveIK(hx, hy, fx, fy, a, b, bendSign) {
  let dx = fx - hx, dy = fy - hy;
  let d = Math.hypot(dx, dy);
  const maxD = a + b - 1;
  if (d > maxD) { dx *= maxD / d; dy *= maxD / d; d = maxD; }
  if (d < 1) d = 1;
  const ux = dx / d, uy = dy / d;
  const x = (a * a - b * b + d * d) / (2 * d);
  const y = Math.sqrt(Math.max(0, a * a - x * x));
  return { kx: hx + ux * x - uy * y * bendSign, ky: hy + uy * x + ux * y * bendSign };
}
function taperedSeg(x1, y1, x2, y2, w1, w2, color) {
  const dx = x2 - x1, dy = y2 - y1, d = Math.hypot(dx, dy) || 1;
  const px = -dy / d, py = dx / d;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x1 + px * w1 / 2, y1 + py * w1 / 2);
  ctx.lineTo(x2 + px * w2 / 2, y2 + py * w2 / 2);
  ctx.lineTo(x2 - px * w2 / 2, y2 - py * w2 / 2);
  ctx.lineTo(x1 - px * w1 / 2, y1 - py * w1 / 2);
  ctx.closePath(); ctx.fill();
}
// smooth closed path through points (midpoint quadratics)
function smoothLoop(pts) {
  const n = pts.length;
  ctx.beginPath();
  let mx = (pts[0][0] + pts[1][0]) / 2, my = (pts[0][1] + pts[1][1]) / 2;
  ctx.moveTo(mx, my);
  for (let i = 1; i <= n; i++) {
    const p = pts[i % n], q = pts[(i + 1) % n];
    ctx.quadraticCurveTo(p[0], p[1], (p[0] + q[0]) / 2, (p[1] + q[1]) / 2);
  }
  ctx.closePath();
}

// ---------------- parts ----------------
const parts = [];
function mkLeg(joint, side, front) {
  return { joint, side, front, phaseOffset: 0, L1: 26, L2: 22,
           foot: { x: 0, y: 0 }, planted: true, stepT: 0,
           from: { x: 0, y: 0 }, to: { x: 0, y: 0 }, cool: 0,
           toes: front ? 4 : 5 };
}
function makePart(pi) {
  const g0 = CUTS[pi], g1 = CUTS[pi + 1];
  const cx = W / 2, cy = H / 2, h0 = -Math.PI / 2;
  const pts = [];
  for (let g = g0; g <= g1; g++) {
    pts.push({ x: cx - Math.cos(h0) * SEG * S * g, y: cy - Math.sin(h0) * SEG * S * g });
  }
  const p = { pi, g0, pts, hd: pts.map(() => h0), legs: [],
              hasHead: pi === 0, leader: null, docked: true,
              heading: h0, speed: 1.3, tx: 0, ty: 0, targetAge: 0,
              stridePhase: Math.random(), wavePhase: Math.random() * 6,
              attachR: 0, scatterT: 0, svx: 0, svy: 0, spin: 0,
              pauseT: 0, lookT: 0, blotches: [] };
  if (pi > 0) p.leader = parts[pi - 1];
  // legs
  const defs = [{ g: 6, side: -1, front: true }, { g: 6, side: 1, front: true },
                { g: 13, side: -1, front: false }, { g: 13, side: 1, front: false }];
  const order = [2, 0, 3, 1];
  defs.forEach((d, di) => {
    if (d.g >= g0 && d.g <= g1) {
      const leg = mkLeg(d.g - g0, d.side, d.front);
      leg.phaseOffset = order[di] * 0.25;
      p.legs.push(leg);
    }
  });
  // gold marbling blotches in body space (u along part, v lateral -1..1)
  const nb = 7;
  for (let k = 0; k < nb; k++) {
    p.blotches.push({ u: hash(pi * 31 + k * 7.3), v: (hash(pi * 17 + k * 3.1) - 0.5) * 1.4,
                      r: (3.5 + hash(k * 13.7 + pi) * 5) });
  }
  refreshHeadings(p);
  for (const leg of p.legs) {
    const t = footTarget(p, leg, legAnchor(p, leg), 26);
    leg.foot.x = t.x; leg.foot.y = t.y;
  }
  return p;
}
function refreshHeadings(p) {
  const n = p.pts.length;
  for (let i = 0; i < n; i++) {
    const a = p.pts[Math.max(0, i - 1)], b = p.pts[Math.min(n - 1, i + 1)];
    p.hd[i] = Math.atan2(a.y - b.y, a.x - b.x);
  }
}
function legAnchor(p, leg) {
  const j = p.pts[leg.joint];
  const px = -Math.sin(p.hd[leg.joint]), py = Math.cos(p.hd[leg.joint]);
  return { x: j.x + px * leg.side * halfWidth(leg.joint + p.g0) * S * 0.9,
           y: j.y + py * leg.side * halfWidth(leg.joint + p.g0) * S * 0.9 };
}
function footTarget(p, leg, an, dist) {
  const h = p.hd[leg.joint];
  const ox = -Math.sin(h) * leg.side, oy = Math.cos(h) * leg.side;
  const fx = Math.cos(h), fy = Math.sin(h);
  const k = leg.front ? -0.55 : 0.55;
  let dx = ox + fx * k, dy = oy + fy * k;
  const d = Math.hypot(dx, dy) || 1;
  return { x: an.x + dx / d * dist * S, y: an.y + dy / d * dist * S };
}
for (let pi = 0; pi < 6; pi++) parts.push(makePart(pi));

function shatter() {
  if (parts.some(p => !p.docked)) return;
  const cx = W / 2, cy = H / 2;
  for (const p of parts) {
    if (p.pi === 0) continue;
    p.docked = false;
    p.attachR = 0;
    const c = p.pts[2];
    const a = Math.atan2(c.y - cy, c.x - cx) + (Math.random() - 0.5) * 0.8;
    const f = (2.2 + Math.random() * 1.6) * S;
    p.svx = Math.cos(a) * f; p.svy = Math.sin(a) * f;
    p.spin = (Math.random() - 0.5) * 0.25;
    p.scatterT = 45 + Math.random() * 20;
  }
}
setTimeout(shatter, 1500);

function pickTarget(p) {
  const m = 0.2;
  p.tx = W * (m + Math.random() * (1 - 2 * m));
  p.ty = H * (m + Math.random() * (1 - 2 * m));
  p.targetAge = 0;
}

// ---------------- simulation ----------------
function steerToward(p, tx, ty, dt, maxSp, agility) {
  const dx = tx - p.pts[0].x, dy = ty - p.pts[0].y;
  const d = Math.hypot(dx, dy);
  const want = Math.atan2(dy, dx);
  let dh = want - p.heading;
  while (dh > Math.PI) dh -= Math.PI * 2;
  while (dh < -Math.PI) dh += Math.PI * 2;
  const turn = agility * dt;
  p.heading += Math.max(-turn, Math.min(turn, dh * 0.15 * dt));
  const sp = Math.min(maxSp, d * 0.09) * S * dt;
  p.pts[0].x += Math.cos(p.heading) * sp;
  p.pts[0].y += Math.sin(p.heading) * sp;
  return sp;
}

function stepPart(p, dt, waiting) {
  let moved = 0;
  const n = p.pts.length;

  if (p.docked && p.leader) {
    // pinned to the leader's tail: one continuous spine
    const t = p.leader.pts[p.leader.pts.length - 1];
    p.pts[0].x = t.x; p.pts[0].y = t.y;
    p.heading = p.leader.hd[p.leader.pts.length - 1];
    moved = p.leader._moved || 0;
  } else if (p.pi === 0) {
    // the head: wander between targets, occasional curious pause-and-look
    if (p.pauseT > 0) {
      p.pauseT -= dt;
      p.lookT += dt;
      p.heading += Math.sin(p.lookT * 0.06) * 0.008 * dt;
    } else {
      if (p.tx === 0 && p.ty === 0) pickTarget(p);
      p.targetAge += dt;
      const dx = p.tx - p.pts[0].x, dy = p.ty - p.pts[0].y;
      if (Math.hypot(dx, dy) < 70 * S || p.targetAge > 700) {
        if (Math.random() < 0.25) { p.pauseT = 110; p.lookT = 0; }
        pickTarget(p);
      }
      const saved = p.speed;
      if (waiting) p.speed = 0.7;
      moved = steerToward(p, p.tx, p.ty, dt, p.speed, 0.05);
      p.speed = saved;
    }
  } else if (p.scatterT > 0) {
    // tumbling through the water
    p.scatterT -= dt;
    p.svx *= 0.985; p.svy *= 0.985;
    p.pts[0].x += p.svx * dt; p.pts[0].y += p.svy * dt;
    p.heading += p.spin * dt;
    moved = Math.hypot(p.svx, p.svy) * dt;
    if (p.scatterT <= 0) { p.svx = p.svy = 0; }
  } else {
    // seek the leader's tail stump, then dock
    const stump = p.leader.pts[p.leader.pts.length - 1];
    moved = steerToward(p, stump.x, stump.y, dt, 2.4, 0.09);
    const d = Math.hypot(p.pts[0].x - stump.x, p.pts[0].y - stump.y);
    if (d < 30 * S) {
      p.pts[0].x += (stump.x - p.pts[0].x) * 0.25;
      p.pts[0].y += (stump.y - p.pts[0].y) * 0.25;
      if (d < 14 * S && ++p.attachR > 8) {
        p.docked = true; p.attachR = 0;
        p.pts[0].x = stump.x; p.pts[0].y = stump.y;
      }
    } else p.attachR = 0;
  }
  p._moved = moved;

  // chain-follow within the part
  const seg = SEG * S;
  for (let i = 1; i < n; i++) {
    const a = p.pts[i - 1], q = p.pts[i];
    const dx = q.x - a.x, dy = q.y - a.y;
    const d = Math.hypot(dx, dy) || 1;
    q.x = a.x + dx / d * seg;
    q.y = a.y + dy / d * seg;
  }

  // lateral wave: trunk antiphase to tail, head counter-stabilized
  p.wavePhase += 0.085 * dt;
  const amp = 3 * S * Math.min(1, moved / (S * dt + 0.001) * 0.35 + 0.15);
  for (let i = 1; i < n; i++) {
    const gi = i + p.g0;
    let env;
    if (gi < 3) env = 0.15;                       // head: nearly still (gaze)
    else env = Math.sin(2 * Math.PI * (gi - 3) / (N - 4)); // trunk vs tail antiphase
    const lat = amp * env * Math.sin(p.wavePhase);
    const a = p.pts[Math.max(0, i - 1)], b = p.pts[Math.min(n - 1, i + 1)];
    const dx = a.x - b.x, dy = a.y - b.y;
    const d = Math.hypot(dx, dy) || 1;
    p.pts[i].x += -dy / d * lat;
    p.pts[i].y += dx / d * lat;
  }
  refreshHeadings(p);

  // legs: tuck when scattered, step when walking
  const walking = p.docked && moved > 0.004;
  p.stridePhase = (p.stridePhase + moved / (48 * S)) % 1;
  for (const leg of p.legs) {
    leg.cool = Math.max(0, leg.cool - dt);
    const an = legAnchor(p, leg);
    if (!p.docked) {
      // tuck the legs while tumbling
      const t = footTarget(p, leg, an, 9);
      leg.foot.x += (t.x - leg.foot.x) * 0.1;
      leg.foot.y += (t.y - leg.foot.y) * 0.1;
      leg.planted = true;
      continue;
    }
    if (leg.planted) {
      const d = Math.hypot(leg.foot.x - an.x, leg.foot.y - an.y);
      const reach = (leg.L1 + leg.L2) * S * 0.9;
      const slot = (((p.stridePhase - leg.phaseOffset) % 1) + 1) % 1;
      if (walking && d > reach * 0.94 && slot < 0.3 && leg.cool <= 0) {
        leg.from.x = leg.foot.x; leg.from.y = leg.foot.y;
        const t = footTarget(p, leg, an, 30);
        leg.to.x = t.x; leg.to.y = t.y;
        leg.stepT = 0; leg.planted = false;
      }
    } else {
      leg.stepT += dt / 13;
      const t = Math.min(1, leg.stepT);
      const e = 1 - Math.pow(1 - t, 3); // fast lift, eased touchdown
      leg.foot.x = leg.from.x + (leg.to.x - leg.from.x) * e;
      leg.foot.y = leg.from.y + (leg.to.y - leg.from.y) * e;
      if (t >= 1) { leg.planted = true; leg.cool = 9; }
    }
  }
}

// ---------------- drawing ----------------
function bodyLoop(p, wScale) {
  // edge points down the left, back up the right
  const L = [], R = [];
  const n = p.pts.length;
  for (let i = 0; i < n; i++) {
    const px = -Math.sin(p.hd[i]), py = Math.cos(p.hd[i]);
    const w = halfWidth(i + p.g0) * S * wScale;
    L.push([p.pts[i].x + px * w, p.pts[i].y + py * w]);
    R.push([p.pts[i].x - px * w, p.pts[i].y - py * w]);
  }
  return L.concat(R.reverse());
}

function drawLeg(p, leg) {
  const a = legAnchor(p, leg);
  const s = S;
  const h = p.hd[leg.joint];
  const px = -Math.sin(h) * leg.side, py = Math.cos(h) * leg.side;
  const hx = Math.cos(h), hy = Math.sin(h);
  const wx = leg.front ? -hx : hx, wy = leg.front ? -hy : hy;
  const bs = (px * wx + py * wy) >= 0 ? 1 : -1;
  const k = solveIK(a.x, a.y, leg.foot.x, leg.foot.y, leg.L1 * s, leg.L2 * s, bs);
  // tapered segments: thigh -> shin -> foot
  taperedSeg(a.x, a.y, k.kx, k.ky, 9 * s, 6 * s, MID);
  taperedSeg(k.kx, k.ky, leg.foot.x, leg.foot.y, 6 * s, 3.4 * s, MID);
  // joint softening
  ctx.fillStyle = MID;
  ctx.beginPath(); ctx.arc(k.kx, k.ky, 3.4 * s, 0, Math.PI * 2); ctx.fill();
  // toes fan out, splay wider when planted
  const fa = Math.atan2(leg.foot.y - k.ky, leg.foot.x - k.kx);
  const spread = leg.planted ? 0.5 : 0.34;
  ctx.lineCap = 'round';
  for (let ti = 0; ti < leg.toes; ti++) {
    const ta = fa + (ti / (leg.toes - 1) - 0.5) * 2 * spread + (spread * 0.9);
    const len = (6.5 - Math.abs(ti - (leg.toes - 1) / 2) * 1.1) * s;
    taperedSeg(leg.foot.x, leg.foot.y,
               leg.foot.x + Math.cos(ta) * len, leg.foot.y + Math.sin(ta) * len,
               2.2 * s, 1 * s, DORSAL);
  }
}

function drawRunBody(run) {
  // one continuous body for a run of docked parts — no seams
  const pts = [];
  run.forEach((p, ri) => {
    p.pts.forEach((q, li) => {
      if (ri > 0 && li === 0) return; // shared boundary joint
      pts.push({ x: q.x, y: q.y, gi: p.g0 + li });
    });
  });
  const n = pts.length;
  const hd = pts.map((_, i) => {
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(n - 1, i + 1)];
    return Math.atan2(a.y - b.y, a.x - b.x);
  });
  const loop = (wScale) => {
    const L = [], R = [];
    for (let i = 0; i < n; i++) {
      const px = -Math.sin(hd[i]), py = Math.cos(hd[i]);
      const w = halfWidth(pts[i].gi) * S * wScale;
      L.push([pts[i].x + px * w, pts[i].y + py * w]);
      R.push([pts[i].x - px * w, pts[i].y - py * w]);
    }
    return L.concat(R.reverse());
  };
  const s = S;

  // soft shadow
  ctx.save();
  ctx.filter = 'blur(6px)';
  ctx.fillStyle = 'rgba(0,0,0,0.28)';
  ctx.translate(7 * s, 11 * s);
  smoothLoop(loop(1));
  ctx.fill();
  ctx.restore();

  // countershaded nested silhouettes
  smoothLoop(loop(1));    ctx.fillStyle = EDGE;   ctx.fill();
  smoothLoop(loop(0.7));  ctx.fillStyle = MID;    ctx.fill();
  smoothLoop(loop(0.48)); ctx.fillStyle = DORSAL; ctx.fill();

  // gold marbling in body space, clipped to the body
  ctx.save();
  smoothLoop(loop(1)); ctx.clip();
  for (const p of run) {
    for (const b of p.blotches) {
      const fi = b.u * (p.pts.length - 1);
      const i0 = Math.floor(fi), i1 = Math.min(p.pts.length - 1, i0 + 1), ft = fi - i0;
      const sx = p.pts[i0].x * (1 - ft) + p.pts[i1].x * ft;
      const sy = p.pts[i0].y * (1 - ft) + p.pts[i1].y * ft;
      const hdb = p.hd[i0] * (1 - ft) + p.hd[i1] * ft;
      const px = -Math.sin(hdb), py = Math.cos(hdb);
      const w = halfWidth(i0 + p.g0) * S;
      const bx = sx + px * b.v * w, by = sy + py * b.v * w;
      const r = b.r * S * 1.3;
      const g = ctx.createRadialGradient(bx, by, 0, bx, by, r);
      g.addColorStop(0, 'rgba(224,179,78,0.30)');
      g.addColorStop(1, 'rgba(224,179,78,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(bx, by, r, 0, Math.PI * 2); ctx.fill();
    }
  }
  ctx.restore();

  // rim light
  ctx.strokeStyle = RIM;
  ctx.lineWidth = 2 * s;
  smoothLoop(loop(0.97));
  ctx.stroke();

  if (run[0].pi === 0) drawFace(run[0]);
}

function drawFace(p) {
  const s = S;
  const ex = p.pts[1].x * 0.6 + p.pts[2].x * 0.4;
  const ey = p.pts[1].y * 0.6 + p.pts[2].y * 0.4;
  const eh = p.hd[1];
  const epx = -Math.sin(eh), epy = Math.cos(eh);
  const ew = halfWidth(1.5) * s;
  for (const sd of [-1, 1]) {
    const cxp = ex + epx * sd * ew * 0.55, cyp = ey + epy * sd * ew * 0.55;
    // amber iris with depth
    const g = ctx.createRadialGradient(cxp - 1.5 * s, cyp - 1.5 * s, 0.5 * s, cxp, cyp, 5.2 * s);
    g.addColorStop(0, IRIS_A);
    g.addColorStop(1, IRIS_B);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(cxp, cyp, 5.2 * s, 0, Math.PI * 2); ctx.fill();
    // pupil
    ctx.fillStyle = '#141a12';
    ctx.beginPath(); ctx.arc(cxp + Math.cos(p.heading) * 1 * s, cyp + Math.sin(p.heading) * 1 * s, 2.4 * s, 0, Math.PI * 2); ctx.fill();
    // sharp specular highlight
    ctx.fillStyle = 'rgba(255,255,255,0.95)';
    ctx.beginPath(); ctx.arc(cxp - 1.7 * s, cyp - 1.9 * s, 1.4 * s, 0, Math.PI * 2); ctx.fill();
  }
  // gentle mouth line
  const hx = Math.cos(p.hd[0]), hy = Math.sin(p.hd[0]);
  ctx.strokeStyle = 'rgba(20,30,20,0.55)';
  ctx.lineWidth = 1.6 * s;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.arc(p.pts[0].x + hx * 4 * s, p.pts[0].y + hy * 4 * s, 5 * s, p.hd[0] + 0.7, p.hd[0] + Math.PI - 0.7);
  ctx.stroke();
}

function draw() {
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);
  // drifting motes
  const t = performance.now() / 1000;
  for (const m of motes) {
    m.x += m.vx; m.y += m.vy;
    if (m.y < -0.05) { m.y = 1.05; m.x = Math.random(); }
    if (m.x < -0.05) m.x = 1.05; if (m.x > 1.05) m.x = -0.05;
    const tw = 0.6 + 0.4 * Math.sin(t * 1.3 + m.ph);
    ctx.fillStyle = `rgba(210,255,240,${(m.a * tw).toFixed(3)})`;
    ctx.beginPath(); ctx.arc(m.x * W, m.y * H, m.r * S, 0, Math.PI * 2); ctx.fill();
  }
  // legs first (roots tuck under the body), then bodies tail->head.
  // docked runs render as one seamless body.
  for (const p of parts) for (const leg of p.legs) drawLeg(p, leg);
  const runs = [];
  const ordered = [...parts].sort((a, b) => a.pi - b.pi);
  for (const p of ordered) {
    const lastRun = runs[runs.length - 1];
    if (p.docked && lastRun && lastRun[lastRun.length - 1].pi === p.pi - 1 &&
        lastRun[lastRun.length - 1].docked) {
      lastRun.push(p);
    } else {
      runs.push([p]);
    }
  }
  for (let i = runs.length - 1; i >= 0; i--) drawRunBody(runs[i]);
  ctx.fillStyle = 'rgba(220,240,225,0.5)';
  ctx.font = `${13 * S}px system-ui, sans-serif`;
  ctx.fillText('click to shatter it', 14, H - 16);
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(3, (now - last) / 16.667);
  last = now;
  const waiting = parts.some(p => !p.docked);
  // head part first so followers can read its fresh tail
  const order = [...parts].sort((a, b) => a.pi - b.pi);
  for (const p of order) stepPart(p, dt, waiting);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

canvas.addEventListener('pointerdown', () => shatter());

window.SAL = {
  parts, shatter,
  whole() { return parts.every(p => p.docked); }
};
</script>
</body>
</html>
