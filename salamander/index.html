<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Salamander · a procedural sketch</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #042e27; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: crosshair; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
/*
 * Procedural salamander.
 *
 * The head follows your mouse / touch. The body trails behind it on a
 * spine chain, still, no sway. Tapered legs with proper toes step as it
 * walks, feet planted in the world frame.
 */
const N = 24;
const SEG = 16;

const BG_TOP = '#0a6b5c', BG_BOT = '#022a23';
const EDGE = '#7fa05c';
const MID = '#4c6e44';
const DORSAL = '#2c4a2e';
const RIM = 'rgba(255,244,200,0.28)';
const IRIS_A = '#f0b43e', IRIS_B = '#7a4d15';

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, S = 1, DPR = 1;
let bgGrad = null;
const motes = [];

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  S = Math.min(W, H) / 620;
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  bgGrad = ctx.createRadialGradient(W / 2, H * 0.35, 10, W / 2, H / 2, Math.max(W, H) * 0.75);
  bgGrad.addColorStop(0, BG_TOP);
  bgGrad.addColorStop(1, BG_BOT);
}
window.addEventListener('resize', resize);
resize();
for (let i = 0; i < 36; i++) {
  motes.push({ x: Math.random(), y: Math.random(), r: 1 + Math.random() * 2.5,
               a: 0.04 + Math.random() * 0.09, vx: (Math.random() - 0.5) * 0.0004,
               vy: -0.0002 - Math.random() * 0.0005, ph: Math.random() * 6 });
}

const WIDTHS = [6.5, 9.5, 11.5, 10, 8, 9, 10, 11, 11.5, 11.5, 11, 10.5, 10, 9.5,
                8.6, 7.6, 6.6, 5.6, 4.7, 3.9, 3.2, 2.6, 2.0, 1.5];
function halfWidth(i) {
  i = Math.max(0, Math.min(WIDTHS.length - 1, i));
  const lo = Math.floor(i), hi = Math.ceil(i), t = i - lo;
  return WIDTHS[lo] * (1 - t) + WIDTHS[hi] * t;
}
function hash(n) { const x = Math.sin(n * 127.1) * 43758.5453; return x - Math.floor(x); }

function solveIK(hx, hy, fx, fy, a, b, bendSign) {
  let dx = fx - hx, dy = fy - hy;
  let d = Math.hypot(dx, dy);
  const maxD = a + b - 1;
  if (d > maxD) { dx *= maxD / d; dy *= maxD / d; d = maxD; }
  if (d < 1) d = 1;
  const ux = dx / d, uy = dy / d;
  const x = (a * a - b * b + d * d) / (2 * d);
  const y = Math.sqrt(Math.max(0, a * a - x * x));
  return { kx: hx + ux * x - uy * y * bendSign, ky: hy + uy * x + ux * y * bendSign };
}
function taperedSeg(x1, y1, x2, y2, w1, w2, color) {
  const dx = x2 - x1, dy = y2 - y1, d = Math.hypot(dx, dy) || 1;
  const px = -dy / d, py = dx / d;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x1 + px * w1 / 2, y1 + py * w1 / 2);
  ctx.lineTo(x2 + px * w2 / 2, y2 + py * w2 / 2);
  ctx.lineTo(x2 - px * w2 / 2, y2 - py * w2 / 2);
  ctx.lineTo(x1 - px * w1 / 2, y1 - py * w1 / 2);
  ctx.closePath(); ctx.fill();
}
function smoothLoop(pts) {
  const n = pts.length;
  ctx.beginPath();
  ctx.moveTo((pts[0][0] + pts[1][0]) / 2, (pts[0][1] + pts[1][1]) / 2);
  for (let i = 1; i <= n; i++) {
    const p = pts[i % n], q = pts[(i + 1) % n];
    ctx.quadraticCurveTo(p[0], p[1], (p[0] + q[0]) / 2, (p[1] + q[1]) / 2);
  }
  ctx.closePath();
}

// ---------------- the animal ----------------
const pts = [];
const hd = new Array(N).fill(0);
const head = {
  x: W / 2, y: H / 2, heading: -Math.PI / 2,
  tx: W / 2, ty: H / 2,           // pointer target
  speed: 2.2, stridePhase: 0,
  idleT: 0,                       // time since last pointer move
  pauseT: 0, lookT: 0
};
for (let i = 0; i < N; i++) {
  pts.push({ x: head.x - Math.cos(head.heading) * SEG * S * i,
             y: head.y - Math.sin(head.heading) * SEG * S * i });
}

function refreshHeadings() {
  for (let i = 0; i < N; i++) {
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(N - 1, i + 1)];
    hd[i] = Math.atan2(a.y - b.y, a.x - b.x);
  }
}
refreshHeadings();

// gold marbling blotches in body space
const blotches = [];
for (let k = 0; k < 40; k++) {
  blotches.push({ u: hash(k * 7.3) * (N - 1), v: (hash(k * 3.1) - 0.5) * 1.4,
                  r: 3.5 + hash(k * 13.7) * 5 });
}

// legs
function mkLeg(joint, side, front) {
  return { joint, side, front, phaseOffset: 0, L1: 26, L2: 22,
           foot: { x: 0, y: 0 }, planted: true, stepT: 0,
           from: { x: 0, y: 0 }, to: { x: 0, y: 0 }, cool: 0,
           toes: front ? 4 : 5 };
}
const legs = [];
[{ g: 6, side: -1, front: true }, { g: 6, side: 1, front: true },
 { g: 13, side: -1, front: false }, { g: 13, side: 1, front: false }].forEach((d, di) => {
  const leg = mkLeg(d.g, d.side, d.front);
  leg.phaseOffset = [0.5, 0, 0.75, 0.25][di]; // LH -> LF -> RH -> RF
  legs.push(leg);
});
function legAnchor(leg) {
  const j = pts[leg.joint];
  const px = -Math.sin(hd[leg.joint]), py = Math.cos(hd[leg.joint]);
  return { x: j.x + px * leg.side * halfWidth(leg.joint) * S * 0.9,
           y: j.y + py * leg.side * halfWidth(leg.joint) * S * 0.9 };
}
function footTarget(leg, an, dist) {
  const h = hd[leg.joint];
  const ox = -Math.sin(h) * leg.side, oy = Math.cos(h) * leg.side;
  const fx = Math.cos(h), fy = Math.sin(h);
  const k = leg.front ? -0.55 : 0.55;
  let dx = ox + fx * k, dy = oy + fy * k;
  const d = Math.hypot(dx, dy) || 1;
  return { x: an.x + dx / d * dist * S, y: an.y + dy / d * dist * S };
}
for (const leg of legs) {
  const t = footTarget(leg, legAnchor(leg), 26);
  leg.foot.x = t.x; leg.foot.y = t.y;
}

// pointer: the head follows it
let lastPointerT = 0;
function setTarget(x, y) {
  head.tx = Math.max(20, Math.min(W - 20, x));
  head.ty = Math.max(20, Math.min(H - 20, y));
  head.idleT = 0;
  head.pauseT = 0;
}
canvas.addEventListener('pointermove', e => setTarget(e.clientX, e.clientY));
canvas.addEventListener('pointerdown', e => setTarget(e.clientX, e.clientY));

// ---------------- simulation ----------------
function step(dt) {
  head.idleT += dt;
  let moved = 0;

  // idle drift: if the pointer hasn't moved in a while, mosey gently
  let tx = head.tx, ty = head.ty, maxSp = head.speed;
  if (head.idleT > 420 && head.pauseT <= 0) {
    // slow wander around the current spot
    head.wt = (head.wt || 0) + dt * 0.004;
    tx = head.x + Math.cos(head.wt * 2.1) * 120 * S;
    ty = head.y + Math.sin(head.wt * 1.7) * 120 * S;
    maxSp = 0.9;
  }

  if (head.pauseT > 0) {
    // curious pause-and-look
    head.pauseT -= dt;
    head.lookT += dt;
    head.heading += Math.sin(head.lookT * 0.06) * 0.008 * dt;
  } else {
    const dx = tx - head.x, dy = ty - head.y;
    const d = Math.hypot(dx, dy);
    if (d < 24 * S && head.idleT < 420 && Math.random() < 0.004 * dt) {
      head.pauseT = 110; head.lookT = 0; // arrived: take a look around
    }
    const want = Math.atan2(dy, dx);
    let dh = want - head.heading;
    while (dh > Math.PI) dh -= Math.PI * 2;
    while (dh < -Math.PI) dh += Math.PI * 2;
    const turn = 0.055 * dt;
    head.heading += Math.max(-turn, Math.min(turn, dh * 0.16 * dt));
    const sp = Math.min(maxSp, d * 0.09) * S * dt;
    head.x += Math.cos(head.heading) * sp;
    head.y += Math.sin(head.heading) * sp;
    moved = sp;
  }
  pts[0].x = head.x; pts[0].y = head.y;

  // body trails the head: still chain, no sway
  const seg = SEG * S;
  for (let i = 1; i < N; i++) {
    const a = pts[i - 1], q = pts[i];
    const dx = q.x - a.x, dy = q.y - a.y;
    const d = Math.hypot(dx, dy) || 1;
    q.x = a.x + dx / d * seg;
    q.y = a.y + dy / d * seg;
  }
  refreshHeadings();

  // legs
  head.stridePhase = (head.stridePhase + moved / (48 * S)) % 1;
  const walking = moved > 0.004;
  for (const leg of legs) {
    leg.cool = Math.max(0, leg.cool - dt);
    const an = legAnchor(leg);
    if (leg.planted) {
      const d = Math.hypot(leg.foot.x - an.x, leg.foot.y - an.y);
      const reach = (leg.L1 + leg.L2) * S * 0.9;
      const slot = (((head.stridePhase - leg.phaseOffset) % 1) + 1) % 1;
      if (walking && d > reach * 0.94 && slot < 0.3 && leg.cool <= 0) {
        leg.from.x = leg.foot.x; leg.from.y = leg.foot.y;
        const t = footTarget(leg, an, 30);
        leg.to.x = t.x; leg.to.y = t.y;
        leg.stepT = 0; leg.planted = false;
      }
    } else {
      leg.stepT += dt / 13;
      const t = Math.min(1, leg.stepT);
      const e = 1 - Math.pow(1 - t, 3);
      leg.foot.x = leg.from.x + (leg.to.x - leg.from.x) * e;
      leg.foot.y = leg.from.y + (leg.to.y - leg.from.y) * e;
      if (t >= 1) { leg.planted = true; leg.cool = 9; }
    }
  }
}

// ---------------- drawing ----------------
function bodyLoop(wScale) {
  const L = [], R = [];
  for (let i = 0; i < N; i++) {
    const px = -Math.sin(hd[i]), py = Math.cos(hd[i]);
    const w = halfWidth(i) * S * wScale;
    L.push([pts[i].x + px * w, pts[i].y + py * w]);
    R.push([pts[i].x - px * w, pts[i].y - py * w]);
  }
  return L.concat(R.reverse());
}

function drawLeg(leg) {
  const a = legAnchor(leg);
  const s = S;
  const h = hd[leg.joint];
  const px = -Math.sin(h) * leg.side, py = Math.cos(h) * leg.side;
  const hx = Math.cos(h), hy = Math.sin(h);
  const wx = leg.front ? -hx : hx, wy = leg.front ? -hy : hy;
  const bs = (px * wx + py * wy) >= 0 ? 1 : -1;
  const k = solveIK(a.x, a.y, leg.foot.x, leg.foot.y, leg.L1 * s, leg.L2 * s, bs);
  taperedSeg(a.x, a.y, k.kx, k.ky, 9 * s, 6 * s, MID);
  taperedSeg(k.kx, k.ky, leg.foot.x, leg.foot.y, 6 * s, 3.4 * s, MID);
  ctx.fillStyle = MID;
  ctx.beginPath(); ctx.arc(k.kx, k.ky, 3.4 * s, 0, Math.PI * 2); ctx.fill();
  const fa = Math.atan2(leg.foot.y - k.ky, leg.foot.x - k.kx);
  const spread = leg.planted ? 0.5 : 0.34;
  ctx.lineCap = 'round';
  for (let ti = 0; ti < leg.toes; ti++) {
    const ta = fa + (ti / (leg.toes - 1) - 0.5) * 2 * spread + spread * 0.9;
    const len = (6.5 - Math.abs(ti - (leg.toes - 1) / 2) * 1.1) * s;
    taperedSeg(leg.foot.x, leg.foot.y,
               leg.foot.x + Math.cos(ta) * len, leg.foot.y + Math.sin(ta) * len,
               2.2 * s, 1 * s, DORSAL);
  }
}

function drawFace() {
  const s = S;
  const ex = pts[1].x * 0.6 + pts[2].x * 0.4;
  const ey = pts[1].y * 0.6 + pts[2].y * 0.4;
  const eh = hd[1];
  const epx = -Math.sin(eh), epy = Math.cos(eh);
  const ew = halfWidth(1.5) * s;
  for (const sd of [-1, 1]) {
    const cxp = ex + epx * sd * ew * 0.55, cyp = ey + epy * sd * ew * 0.55;
    const g = ctx.createRadialGradient(cxp - 1.5 * s, cyp - 1.5 * s, 0.5 * s, cxp, cyp, 5.2 * s);
    g.addColorStop(0, IRIS_A);
    g.addColorStop(1, IRIS_B);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(cxp, cyp, 5.2 * s, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#141a12';
    ctx.beginPath(); ctx.arc(cxp + Math.cos(head.heading) * 1 * s, cyp + Math.sin(head.heading) * 1 * s, 2.4 * s, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.95)';
    ctx.beginPath(); ctx.arc(cxp - 1.7 * s, cyp - 1.9 * s, 1.4 * s, 0, Math.PI * 2); ctx.fill();
  }
  const hx = Math.cos(hd[0]), hy = Math.sin(hd[0]);
  ctx.strokeStyle = 'rgba(20,30,20,0.55)';
  ctx.lineWidth = 1.6 * s;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.arc(pts[0].x + hx * 4 * s, pts[0].y + hy * 4 * s, 5 * s, hd[0] + 0.7, hd[0] + Math.PI - 0.7);
  ctx.stroke();
}

function draw() {
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);
  const t = performance.now() / 1000;
  for (const m of motes) {
    m.x += m.vx; m.y += m.vy;
    if (m.y < -0.05) { m.y = 1.05; m.x = Math.random(); }
    if (m.x < -0.05) m.x = 1.05; if (m.x > 1.05) m.x = -0.05;
    const tw = 0.6 + 0.4 * Math.sin(t * 1.3 + m.ph);
    ctx.fillStyle = `rgba(210,255,240,${(m.a * tw).toFixed(3)})`;
    ctx.beginPath(); ctx.arc(m.x * W, m.y * H, m.r * S, 0, Math.PI * 2); ctx.fill();
  }

  for (const leg of legs) drawLeg(leg);

  const s = S;
  ctx.save();
  ctx.filter = 'blur(6px)';
  ctx.fillStyle = 'rgba(0,0,0,0.28)';
  ctx.translate(7 * s, 11 * s);
  smoothLoop(bodyLoop(1));
  ctx.fill();
  ctx.restore();

  smoothLoop(bodyLoop(1));    ctx.fillStyle = EDGE;   ctx.fill();
  smoothLoop(bodyLoop(0.7));  ctx.fillStyle = MID;    ctx.fill();
  smoothLoop(bodyLoop(0.48)); ctx.fillStyle = DORSAL; ctx.fill();

  ctx.save();
  smoothLoop(bodyLoop(1)); ctx.clip();
  for (const b of blotches) {
    const i0 = Math.floor(b.u), i1 = Math.min(N - 1, i0 + 1), ft = b.u - i0;
    const sx = pts[i0].x * (1 - ft) + pts[i1].x * ft;
    const sy = pts[i0].y * (1 - ft) + pts[i1].y * ft;
    const hdb = hd[i0] * (1 - ft) + hd[i1] * ft;
    const px = -Math.sin(hdb), py = Math.cos(hdb);
    const w = halfWidth(i0) * S;
    const bx = sx + px * b.v * w, by = sy + py * b.v * w;
    const r = b.r * S * 1.3;
    const g = ctx.createRadialGradient(bx, by, 0, bx, by, r);
    g.addColorStop(0, 'rgba(224,179,78,0.30)');
    g.addColorStop(1, 'rgba(224,179,78,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(bx, by, r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();

  ctx.strokeStyle = RIM;
  ctx.lineWidth = 2 * s;
  smoothLoop(bodyLoop(0.97));
  ctx.stroke();

  drawFace();

  ctx.fillStyle = 'rgba(220,240,225,0.5)';
  ctx.font = `${13 * S}px system-ui, sans-serif`;
  ctx.fillText('move your mouse / touch — it follows', 14, H - 16);
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(3, (now - last) / 16.667);
  last = now;
  step(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

window.SAL = {};
</script>
</body>
</html>
