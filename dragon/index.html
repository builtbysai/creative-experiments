<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Draco · a procedural sketch</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231c1814'/%3E%3Cpath d='M6 22c6 2 10-2 12-8s5-6 8-4c-2 0-3 1-3 3 0 5-6 11-14 11z' fill='%23d4553a'/%3E%3C/svg%3E">
<style>
  @font-face { font-family: 'Fraunces'; font-weight: 400; font-display: swap;
    src: url('../assets/fonts/Fraunces-400.woff2') format('woff2'); }
  @font-face { font-family: 'Fraunces'; font-weight: 600; font-display: swap;
    src: url('../assets/fonts/Fraunces-600.woff2') format('woff2'); }
  @font-face { font-family: 'Plex Mono'; font-weight: 400; font-display: swap;
    src: url('../assets/fonts/IBMPlexMono-400.woff2') format('woff2'); }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #1a1612; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
/*
 * Draco: a procedural dragon that walks through a page of text.
 *
 * Nothing here is a sprite. The dragon is code:
 *
 *  - The head is steered like a vehicle: eased speed, a hard limit on how
 *    tightly it can turn, and a spring-damped head that looks ahead of the
 *    body. The body is not a chain; it is sampled from the exact path the
 *    head has walked, so it follows every curve without lag or snaking.
 *  - A gait phase is driven by distance travelled. Feet are planted in the
 *    page and swing in diagonal pairs (a trot), predicting where the hips
 *    will be, with two-bone IK for the knees.
 *  - The page is re-typeset every frame: each line is cut into free runs
 *    around the body and feet, so words slide aside as it passes.
 *  - Hold the pointer (or Space) and it breathes fire where you point.
 *    Words catch, the flame creeps along the line, they char, fall to ash,
 *    and the page mends itself.
 */
(() => {
const TAU = Math.PI * 2, PI = Math.PI;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const angDiff = (a, b) => { let d = a - b; while (d > PI) d -= TAU; while (d < -PI) d += TAU; return d; };
function seeded(seed) {
  let t = seed >>> 0;
  return () => {
    t = (t + 0x6D2B79F5) >>> 0;
    let r = Math.imul(t ^ (t >>> 15), 1 | t);
    r ^= r + Math.imul(r ^ (r >>> 7), 61 | r);
    return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
  };
}
const rr = (a, b) => a + Math.random() * (b - a);

// ---------- colour ----------
const _rgb = new Map();
function rgbOf(h) {
  let c = _rgb.get(h);
  if (!c) { const n = parseInt(h.slice(1), 16); c = [(n >> 16) & 255, (n >> 8) & 255, n & 255]; _rgb.set(h, c); }
  return c;
}
function mix(a, b, t) {
  const A = rgbOf(a), B = rgbOf(b);
  return `rgb(${(A[0] + (B[0] - A[0]) * t) | 0},${(A[1] + (B[1] - A[1]) * t) | 0},${(A[2] + (B[2] - A[2]) * t) | 0})`;
}
function rgba(h, a) { const c = rgbOf(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }

const THEMES = {
  light: {
    paper: '#efe6d2', vignette: 'rgba(110,80,40,0.30)', stain: '#b58b4a', speckA: 'rgba(90,60,30,0.10)', speckB: 'rgba(255,255,240,0.35)',
    rule: 'rgba(90,70,50,0.22)', ink: '#241c14', label: '#7a6c58', initial: '#a63a2b',
    burnt: '#3a1c0c', ash: '#8f8780', hole: '#140d09', scorch: '#7a4a26', ember: '#ff7a1f',
    skinDeep: '#46100c', skin: '#862619', skinLight: '#d4553a', belly: '#e9b95a', bellyDeep: '#a46f26',
    rim: '#220806', rimLight: '', spike: '#f2c660', horn: '#f3e6bd', hornDark: '#7d5a2c', eye: '#ffc43a',
    mouth: '#4a0b08', tongue: '#c0392f',
    wingA: 'rgba(118,26,20,0.90)', wingB: 'rgba(216,116,60,0.52)', wingVein: '#2b0907',
    shadow: 'rgba(40,20,6,0.36)', blend: 'source-over', bloom: 'rgba(255,160,60,0.16)', cursor: 'rgba(40,28,18,0.55)'
  },
  dark: {
    paper: '#1c1814', vignette: 'rgba(0,0,0,0.55)', stain: '#7a5a30', speckA: 'rgba(255,230,190,0.05)', speckB: 'rgba(0,0,0,0.25)',
    rule: 'rgba(230,215,190,0.14)', ink: '#e9e0d1', label: '#968c7f', initial: '#d4644f',
    burnt: '#8b5a3a', ash: '#77706a', hole: '#000000', scorch: '#5a3218', ember: '#ff8a2a',
    skinDeep: '#3a0d0a', skin: '#9b2c1d', skinLight: '#ee6a44', belly: '#f2c466', bellyDeep: '#b3792a',
    rim: '#0a0403', rimLight: 'rgba(255,175,115,0.30)', spike: '#f6cd68', horn: '#f4e6bb', hornDark: '#8a6532', eye: '#ffd84f',
    mouth: '#5a0f0a', tongue: '#d14b3a',
    wingA: 'rgba(140,34,22,0.90)', wingB: 'rgba(230,118,52,0.50)', wingVein: '#12080a',
    shadow: 'rgba(0,0,0,0.6)', blend: 'lighter', bloom: 'rgba(255,150,50,0.20)', cursor: 'rgba(236,224,205,0.6)'
  }
};
const mq = window.matchMedia('(prefers-color-scheme: dark)');
const qTheme = new URLSearchParams(location.search).get('theme');
const forced = qTheme === 'dark' || qTheme === 'light';
let T = THEMES[forced ? qTheme : (mq.matches ? 'dark' : 'light')];
mq.addEventListener && mq.addEventListener('change', () => {
  if (forced) return;
  T = THEMES[mq.matches ? 'dark' : 'light']; buildPaper();
});
const isDark = () => T === THEMES.dark;

// ---------- the page ----------
const LABEL = 'Bestiarium Ignis · f. 41 verso';
const HEADING = 'Draco';
const TEXT = [
  'The wyrm had slept under the abbey for longer than the abbey had stood, and the monks knew it only as a warmth in the cellar floor that kept the wine from freezing. Brother Anselm, who was sent down each winter to count the casks, swore that the stones hummed. Nobody believed him until the spring the floor split along the aisle.',
  'It came up through the nave like smoke rising, slow and broad in the shoulder, and the candles leaned toward it. The scribes did not flee. They had spent their lives drawing such creatures in the margins, in red lead and gold, and it seemed only courteous to be seen working when one arrived. The page parted for its feet. The lines of the psalter bent around its claws and settled again behind.',
  'The old bestiaries agree that a dragon does not hunt for hunger but for company, and that it burns whatever it cannot read. This is why the margins of the oldest books are so often scorched, and why a careful copyist keeps one hand free, to lay flat upon the vellum anything that is trying to leave it.'
];
const CLOSING = 'Lead it with a finger. Hold, and it answers in fire.';

const F_BODY = "Fraunces, Georgia, 'Times New Roman', serif";
const F_MONO = "'Plex Mono', ui-monospace, Menlo, monospace";
const STY = {
  label:   { font: s => `400 ${s * 0.62}px ${F_MONO}`, size: 0.62, lh: s => s * 0.62 * 1.9 },
  title:   { font: s => `600 ${s * 2.2}px ${F_BODY}`,  size: 2.2,  lh: s => s * 2.2 * 1.15 },
  body:    { font: s => `400 ${s}px ${F_BODY}`,        size: 1,    lh: s => s * 1.56 },
  closing: { font: s => `400 ${s * 0.95}px ${F_BODY}`, size: 0.95, lh: s => s * 1.56 }
};

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, L = 400;                   // L = dragon length
let fs = 18, colX0 = 0, colX1 = 0, topY = 40, capW = 0, capSize = 0;
let blocks = [], words = [];
let paperC = null;

function buildBlocks() {
  blocks = []; words = [];
  const add = (style, text, gap, cap) => {
    const b = { style, gap, cap: !!cap, words: [], space: 0, capChar: '' };
    const toks = text.split(' ');
    if (cap) { b.capChar = toks[0][0]; toks[0] = toks[0].slice(1); }
    for (const t of toks) {
      const w = { text: t, w: 0, x: 0, y: 0, tx: 0, ty: 0, placed: false, size: 16, burn: -1, ashed: false, fx: 0, a: 1, gen: 0, b };
      b.words.push(w); words.push(w);
    }
    blocks.push(b);
  };
  add('label', LABEL.toUpperCase(), 0);
  add('title', HEADING, 0.4);
  TEXT.forEach((t, i) => add('body', t, i ? 0.5 : 0.9, i === 0));
  add('closing', CLOSING, 1.0);
}

function measureAll() {
  for (const b of blocks) {
    ctx.font = STY[b.style].font(fs);
    b.space = ctx.measureText(' ').width;
    for (const w of b.words) w.w = Math.min(ctx.measureText(w.text).width, colX1 - colX0);
  }
  capSize = fs * 3 * 1.56 * 0.98;
  ctx.font = `600 ${capSize}px ${F_BODY}`;
  capW = ctx.measureText(blocks[2].capChar).width + fs * 0.35;
}

const circs = [];
function layout(useCircs) {
  const minRun = fs * 2.2, clear = fs * 0.55;
  let y = topY, first = true;
  for (const b of blocks) {
    const st = STY[b.style], size = fs * st.size, lh = st.lh(fs);
    if (!first) y += b.gap * fs * 1.56;
    first = false;
    let wi = 0, lineNo = 0, guard = 0;
    const capLines = b.cap ? 3 : 0;
    while (wi < b.words.length) {
      const ymid = y + lh / 2;
      const iv = [];
      if (useCircs) {
        for (let k = 0; k < circs.length; k++) {
          const c = circs[k], R = c.r + clear + lh * 0.3, dy = Math.abs(c.y - ymid);
          if (dy < R) { const hx = Math.sqrt(R * R - dy * dy); iv.push([c.x - hx, c.x + hx]); }
        }
      }
      if (lineNo < capLines) iv.push([colX0 - 2, colX0 + capW]);
      iv.sort((a, c) => a[0] - c[0]);
      const runs = []; let cur = colX0;
      for (const [a, c] of iv) {
        if (a > cur) runs.push([cur, Math.min(a, colX1)]);
        if (c > cur) cur = c;
        if (cur >= colX1) break;
      }
      if (cur < colX1) runs.push([cur, colX1]);
      let placed = 0;
      for (const r of runs) {
        if (r[1] - r[0] < minRun && !(guard > 40)) continue;
        let x = r[0];
        while (wi < b.words.length) {
          const w = b.words[wi];
          if (x + w.w > r[1] + 0.5 && !(guard > 60)) break;
          w.tx = x; w.ty = y + lh * 0.5 + size * 0.33; w.size = size; w.sty = st;
          x += w.w + b.space; wi++; placed++;
          if (guard > 60) break;
        }
        if (wi >= b.words.length) break;
      }
      guard = placed ? 0 : guard + 1;
      y += lh; lineNo++;
    }
  }
  return y;
}

function fitText() {
  const pad = Math.max(18, W * 0.055);
  let size = 21;
  for (;;) {
    fs = size;
    const colW = Math.min(W - pad * 2, fs * 41);
    colX0 = (W - colW) / 2; colX1 = colX0 + colW;
    topY = clamp(H * 0.07, 16, 72);
    measureAll();
    const bottom = layout(false);
    if (bottom <= H - Math.max(14, H * 0.045) || size <= 11.5) break;
    size -= 0.5;
  }
  for (const w of words) w.placed = false;
  layout(false);
}

// ---------- paper ----------
function buildPaper() {
  paperC = document.createElement('canvas');
  paperC.width = cv.width; paperC.height = cv.height;
  const g = paperC.getContext('2d');
  g.scale(DPR, DPR);
  g.fillStyle = T.paper; g.fillRect(0, 0, W, H);
  const r = seeded(5);
  for (let i = 0; i < 16; i++) {
    const x = r() * W, y = r() * H, rad = (0.08 + r() * 0.22) * Math.max(W, H);
    const rg = g.createRadialGradient(x, y, 0, x, y, rad);
    rg.addColorStop(0, rgba(T.stain, 0.07)); rg.addColorStop(1, rgba(T.stain, 0));
    g.fillStyle = rg; g.fillRect(x - rad, y - rad, rad * 2, rad * 2);
  }
  const n = Math.min(9000, (W * H) / 600) | 0;
  for (let i = 0; i < n; i++) {
    g.fillStyle = r() < 0.5 ? T.speckA : T.speckB;
    const x = r() * W, y = r() * H, len = 1 + r() * 4;
    g.save(); g.translate(x, y); g.rotate(r() * TAU); g.fillRect(0, 0, len, 0.8); g.restore();
  }
  const vg = g.createRadialGradient(W / 2, H * 0.46, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.82);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, T.vignette);
  g.fillStyle = vg; g.fillRect(0, 0, W, H);
  g.strokeStyle = T.rule; g.lineWidth = 1;
  g.beginPath();
  const rx0 = colX0 - fs * 0.9, rx1 = colX1 + fs * 0.9, ry0 = topY - fs * 0.8, ry1 = H - topY * 0.5;
  g.moveTo(rx0, ry0); g.lineTo(rx0, ry1); g.moveTo(rx1, ry0); g.lineTo(rx1, ry1);
  g.moveTo(rx0 - fs * 0.35, ry0); g.lineTo(rx0 - fs * 0.35, ry1); g.moveTo(rx1 + fs * 0.35, ry0); g.lineTo(rx1 + fs * 0.35, ry1);
  g.stroke();
}

// =====================================================================
//  THE DRAGON
// =====================================================================
const N = 40, SUB = 3, M = (N - 1) * SUB + 1;         // control points, subdivision, drawn samples
const TS = 2;                                          // trail spacing (px)
const PROF = [[0, .030], [.04, .037], [.09, .033], [.15, .047], [.25, .059], [.36, .057], [.46, .051], [.58, .043], [.70, .031], [.82, .020], [.92, .0105], [1, .003]];
function profAt(t) {
  for (let i = 1; i < PROF.length; i++) {
    if (t <= PROF[i][0]) {
      const [a, pa] = PROF[i - 1], [b, pb] = PROF[i];
      return lerp(pa, pb, sstep(0, 1, (t - a) / (b - a)));
    }
  }
  return PROF[PROF.length - 1][1];
}

const trail = [];
const C = Array.from({ length: N }, () => ({ x: 0, y: 0 }));
const S = Array.from({ length: M }, () => ({ x: 0, y: 0, tx: 1, ty: 0, nx: 0, ny: 1, hw: 0, t: 0 }));
const D = {
  x: 0, y: 0, h: 0, v: 0, w: 0, dist: 0, phase: 0, time: 0, turnSign: 0,
  headYaw: 0, headYawV: 0, headAng: 0, look: { x: 0, y: 0 }, lookOn: false, glance: null, glanceUntil: 0,
  breath: 0, holdUntil: 0, burstUntil: 0, burstFrom: 0, burstPlan: 0,
  wing: 0.1, wphase: 0, flap: 0.03, stretchUntil: 0, nextStretch: 9,
  mode: 'walk', modeUntil: 0, wp: null,
  blinkT: -1, nextBlink: 2.2, nextPuff: 2, emit: 0, sparkAcc: 0,
  legs: [], wg: [null, null], steps: 0, hips: []
};
const ptr = { x: 0, y: 0, inside: false, down: false, moved: -99, type: 'mouse' };
let keyBreath = false, clock = 0, initialised = false;

const LEGDEF = [
  { frac: 0.185, side: -1, pair: 0, front: true },
  { frac: 0.185, side: 1, pair: 1, front: true },
  { frac: 0.575, side: -1, pair: 1, front: false },
  { frac: 0.575, side: 1, pair: 0, front: false }
];

function gAt(f) {
  const x = clamp(f, 0, 1) * (M - 1), i = Math.min(M - 2, x | 0), k = x - i, a = S[i], b = S[i + 1];
  return {
    x: lerp(a.x, b.x, k), y: lerp(a.y, b.y, k), tx: lerp(a.tx, b.tx, k), ty: lerp(a.ty, b.ty, k),
    nx: lerp(a.nx, b.nx, k), ny: lerp(a.ny, b.ny, k), hw: lerp(a.hw, b.hw, k)
  };
}

function pushTrail() {
  const last = trail[trail.length - 1];
  if (!last || Math.hypot(D.x - last.x, D.y - last.y) >= TS) trail.push({ x: D.x, y: D.y });
  const keep = Math.ceil((L * 1.25) / TS) + 6;
  if (trail.length > keep) trail.splice(0, trail.length - keep);
}

function sampleTrail() {
  const sp = L / (N - 1);
  let idx = trail.length - 1, px = D.x, py = D.y, cum = 0, ex = -Math.cos(D.h), ey = -Math.sin(D.h);
  C[0].x = D.x; C[0].y = D.y;
  for (let i = 1; i < N; i++) {
    const s = i * sp;
    let done = false;
    while (idx >= 0) {
      const q = trail[idx], seg = Math.hypot(q.x - px, q.y - py);
      if (cum + seg >= s) {
        const r = seg > 1e-9 ? (s - cum) / seg : 0;
        C[i].x = px + (q.x - px) * r; C[i].y = py + (q.y - py) * r; done = true; break;
      }
      if (seg > 1e-9) { ex = (q.x - px) / seg; ey = (q.y - py) / seg; }
      cum += seg; px = q.x; py = q.y; idx--;
    }
    if (!done) { C[i].x = px + ex * (s - cum); C[i].y = py + ey * (s - cum); }
  }
}

function frames() {
  for (let j = 0; j < M; j++) {
    const a = S[Math.max(j - 1, 0)], b = S[Math.min(j + 1, M - 1)];
    let tx = a.x - b.x, ty = a.y - b.y; const d = Math.hypot(tx, ty) || 1; tx /= d; ty /= d;
    const s = S[j]; s.tx = tx; s.ty = ty; s.nx = -ty; s.ny = tx;
  }
}

function buildGeometry() {
  const vc = 0.46 * L, vk = clamp(D.v / vc, 0, 1);
  sampleTrail();
  for (let pass = 0; pass < 2; pass++) {
    let px = C[0].x, py = C[0].y;
    for (let i = 1; i < N - 1; i++) {
      const cx = C[i].x, cy = C[i].y;
      C[i].x = 0.25 * px + 0.5 * cx + 0.25 * C[i + 1].x; C[i].y = 0.25 * py + 0.5 * cy + 0.25 * C[i + 1].y;
      px = cx; py = cy;
    }
  }
  let k = 0;
  for (let i = 0; i < N - 1; i++) {
    const p0 = C[Math.max(0, i - 1)], p1 = C[i], p2 = C[i + 1], p3 = C[Math.min(N - 1, i + 2)];
    for (let s = 0; s < SUB; s++, k++) {
      const t = s / SUB, t2 = t * t, t3 = t2 * t;
      S[k].x = 0.5 * (2 * p1.x + (-p0.x + p2.x) * t + (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * t2 + (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * t3);
      S[k].y = 0.5 * (2 * p1.y + (-p0.y + p2.y) * t + (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * t2 + (-p0.y + 3 * p1.y - 3 * p2.y + p3.y) * t3);
    }
  }
  S[k].x = C[N - 1].x; S[k].y = C[N - 1].y;
  frames();
  // gait-synchronised body wave + a lazy idle swish of the tail
  const A = 0.036 * L * vk, idleA = 0.02 * L * (1 - 0.7 * vk);
  for (let j = 0; j < M; j++) {
    const s = S[j], t = j / (M - 1);
    s.t = t;
    const env = sstep(0, 0.28, t) * (0.18 + 0.82 * Math.pow(t, 1.1));
    let d = A * env * Math.sin(D.phase - t * TAU * 1.1);
    d += idleA * sstep(0.35, 1, t) * Math.sin(D.time * 1.1 - t * 3.4);
    s.x += s.nx * d; s.y += s.ny * d;
    const bump = sstep(0.08, 0.2, t) * (1 - sstep(0.42, 0.62, t));
    s.hw = profAt(t) * L * (1 + (0.028 * Math.sin(D.time * 2.2) + 0.09 * D.breath) * bump);
  }
  frames();
}

function pickWaypoint() {
  const m = Math.max(L * 0.2, 40);
  for (let tries = 0; tries < 14; tries++) {
    const a = D.h + rr(-1.6, 1.6), d = rr(0.8, 1.7) * L;
    const x = D.x + Math.cos(a) * d, y = D.y + Math.sin(a) * d;
    if (x > m && x < W - m && y > m && y < H - m) return { x, y };
  }
  return { x: rr(m, Math.max(m + 1, W - m)), y: rr(m, Math.max(m + 1, H - m)) };
}

function initDragon(enter) {
  trail.length = 0;
  D.h = 0; D.v = enter ? 0.3 * 0.46 * L : 0; D.w = 0; D.turnSign = 0;
  D.x = enter ? -L * 0.5 : clamp(D.x || W * 0.5, W * 0.15, W * 0.85);
  D.y = enter ? H * 0.6 : clamp(D.y || H * 0.58, H * 0.2, H * 0.8);
  for (let d = L * 1.25; d >= 0; d -= TS) trail.push({ x: D.x - Math.cos(D.h) * d, y: D.y - Math.sin(D.h) * d });
  D.dist = 0; D.phase = 0; D.headYaw = 0; D.headYawV = 0; D.breath = 0; D.wing = 0.1;
  D.mode = 'walk'; D.wp = enter ? { x: W * 0.42, y: H * 0.58 } : null; D.wpEnter = !!enter;
  buildGeometry();
  D.headAng = Math.atan2(S[0].ty, S[0].tx);
  D.legs = LEGDEF.map(d => {
    const l = Object.assign({ sw: null, lift: 0, fx: 0, fy: 0, fang: 0 }, d);
    return l;
  });
  updateLegs(0);
  for (const l of D.legs) { l.fx = l.tgx; l.fy = l.tgy; l.fang = Math.atan2(l.ty, l.tx) + l.side * 0.38; }
  updateLegs(0);
  initialised = true;
}

// ---------- wings ----------
function wingGeom(side) {

// ---------- particles / burning ----------

// ---------- the update ----------

const spr = (stops) => {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  stops.forEach(([o, col]) => gr.addColorStop(o, col)); g.fillStyle = gr; g.fillRect(0, 0, 64, 64); return c;
};
const SP = {
  core: spr([[0, 'rgba(255,246,200,1)'], [.45, 'rgba(255,226,128,.7)'], [1, 'rgba(255,200,90,0)']]),
  mid: spr([[0, 'rgba(255,190,70,1)'], [.5, 'rgba(255,150,40,.6)'], [1, 'rgba(255,120,30,0)']]),
  edge: spr([[0, 'rgba(232,80,44,.9)'], [.5, 'rgba(200,50,25,.45)'], [1, 'rgba(160,30,10,0)']]),
  smoke: spr([[0, 'rgba(96,86,78,.55)'], [1, 'rgba(96,86,78,0)']]),
  glow: spr([[0, 'rgba(255,200,110,1)'], [.35, 'rgba(255,150,60,.45)'], [1, 'rgba(255,110,30,0)']])

function smoothClosed(pts) {
  const n = pts.length;
  ctx.beginPath();
  ctx.moveTo((pts[0][0] + pts[1][0]) / 2, (pts[0][1] + pts[1][1]) / 2);
  for (let i = 1; i <= n; i++) {
    const a = pts[i % n], b = pts[(i + 1) % n];
    ctx.quadraticCurveTo(a[0], a[1], (a[0] + b[0]) / 2, (a[1] + b[1]) / 2);
  }
  ctx.closePath();
}
function limbPath(ax, ay, bx, by, wa, wm, wb, p) {
  const dx = bx - ax, dy = by - ay, d = Math.hypot(dx, dy) || 1, nx = -dy / d, ny = dx / d;
  const mx = ax + dx * 0.42, my = ay + dy * 0.42;
  p.moveTo(ax + nx * wa / 2, ay + ny * wa / 2);
  p.quadraticCurveTo(mx + nx * wm * 0.58, my + ny * wm * 0.58, bx + nx * wb / 2, by + ny * wb / 2);
  p.lineTo(bx - nx * wb / 2, by - ny * wb / 2);
  p.quadraticCurveTo(mx - nx * wm * 0.58, my - ny * wm * 0.58, ax - nx * wa / 2, ay - ny * wa / 2);
  p.closePath();
}

// A leg as one smooth silhouette: thigh muscle, narrow knee, tapering shin, ankle.
const LEG_PROFILE = [[0, 0.046], [0.16, 0.058], [0.34, 0.052], [0.5, 0.032], [0.62, 0.034], [0.8, 0.026], [1, 0.019]];
function legCurve(l, n) {
  const pts = [];
  for (let i = 0; i <= n; i++) {
    const t = i / n, u = 1 - t;
    // quadratic through the knee so the bend is rounded, not a hinge
    const cx = 2 * l.kx - 0.5 * (l.ax + l.ex), cy = 2 * l.ky - 0.5 * (l.ay + l.ey);
    pts.push({ x: u * u * l.ax + 2 * u * t * cx + t * t * l.ex, y: u * u * l.ay + 2 * u * t * cy + t * t * l.ey, t });
  }
  for (let i = 0; i <= n; i++) {
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(n, i + 1)], d = Math.hypot(b.x - a.x, b.y - a.y) || 1;
    pts[i].nx = -(b.y - a.y) / d; pts[i].ny = (b.x - a.x) / d;
    let w = LEG_PROFILE[LEG_PROFILE.length - 1][1];
    for (let k = 1; k < LEG_PROFILE.length; k++) if (pts[i].t <= LEG_PROFILE[k][0]) {
      const p0 = LEG_PROFILE[k - 1], p1 = LEG_PROFILE[k];
      w = lerp(p0[1], p1[1], sstep(0, 1, (pts[i].t - p0[0]) / (p1[0] - p0[0]))); break;
    }
    pts[i].w = w * L;
  }
  return pts;
}
function legOutline(l, p) {
  const c = legCurve(l, 16);
  p.moveTo(c[0].x + c[0].nx * c[0].w / 2, c[0].y + c[0].ny * c[0].w / 2);
  for (let i = 1; i < c.length; i++) p.lineTo(c[i].x + c[i].nx * c[i].w / 2, c[i].y + c[i].ny * c[i].w / 2);
  const e = c[c.length - 1];
  p.arc(e.x, e.y, e.w / 2, Math.atan2(e.ny, e.nx), Math.atan2(e.ny, e.nx) + PI, false);
  for (let i = c.length - 1; i >= 0; i--) p.lineTo(c[i].x - c[i].nx * c[i].w / 2, c[i].y - c[i].ny * c[i].w / 2);
  p.closePath();
  return c;
}

let bodyPath = null, legPath = null;
function buildPaths() {
  bodyPath = new Path2D();
  bodyPath.moveTo(S[0].x + S[0].nx * S[0].hw, S[0].y + S[0].ny * S[0].hw);
  for (let j = 1; j < M; j++) bodyPath.lineTo(S[j].x + S[j].nx * S[j].hw, S[j].y + S[j].ny * S[j].hw);
  const tl = S[M - 1];
  bodyPath.lineTo(tl.x - tl.tx * L * 0.012, tl.y - tl.ty * L * 0.012);
  for (let j = M - 1; j >= 0; j--) bodyPath.lineTo(S[j].x - S[j].nx * S[j].hw, S[j].y - S[j].ny * S[j].hw);
  bodyPath.closePath();
  legPath = new Path2D();
  for (const l of D.legs) {
    legOutline(l, legPath);
  }
}

function drawScorches() {
  for (const b of scorches) {
    const s = sstep(0, 0.5, b.t) * (1 - sstep(MEND - 1, MEND + MENDT, b.t));
    if (s <= 0.01) continue;
    ctx.save();
    ctx.translate(b.x, b.y); ctx.scale(1, b.ry / b.rx);
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, b.rx);
    const dk = isDark() ? 1 : 0.62;
    g.addColorStop(0, rgba(T.hole, 0.8 * s * dk));
    g.addColorStop(0.42, rgba(T.scorch, 0.55 * s * dk + 0.1 * s));
    g.addColorStop(0.72, rgba(T.scorch, 0.36 * s));
    g.addColorStop(1, rgba(T.scorch, 0));
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, b.rx, 0, TAU); ctx.fill();
    if (b.t < 1.8) {
      const e = 1 - b.t / 1.8;
      const eg = ctx.createRadialGradient(0, 0, b.rx * 0.2, 0, 0, b.rx * 0.8);
      eg.addColorStop(0, rgba(T.ember, 0)); eg.addColorStop(0.6, rgba(T.ember, 0.45 * e)); eg.addColorStop(1, rgba(T.ember, 0));
      ctx.fillStyle = eg; ctx.beginPath(); ctx.arc(0, 0, b.rx * 0.8, 0, TAU); ctx.fill();
    }

  }
}

function drawBurnGlow() {
  ctx.globalCompositeOperation = T.blend;
  for (const w of words) {
    if (w.burn < 0 || w.burn > T_FLAME + T_CHAR) continue;
    const k = 1 - w.burn / (T_FLAME + T_CHAR), s = w.w * 0.7 + w.size;
    ctx.globalAlpha = 0.5 * k * (0.8 + 0.2 * Math.sin(clock * 30 + w.x));
    ctx.drawImage(SP.mid, w.x + w.w / 2 - s, w.y - w.size * 0.3 - s * 0.55, s * 2, s * 1.1);
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
}

function drawText() {
  ctx.textBaseline = 'alphabetic';
  ctx.font = `600 ${capSize}px ${F_BODY}`;
  ctx.fillStyle = T.initial; ctx.globalAlpha = 1;
  const b2 = blocks[2], firstW = b2.words[0];
  ctx.fillText(b2.capChar, colX0, firstW.ty + STY.body.lh(fs) * 2 - fs * 0.05);
  let curFont = '';

    const f = w.sty.font(fs);
    if (f !== curFont) { ctx.font = f; curFont = f; }
    const inkKey = w.b.style === 'label' || w.b.style === 'closing' ? T.label : T.ink;
    let col = inkKey, a = 1, dx = 0, dy = 0;
    if (w.burn >= 0) {
      const t = w.burn;
      if (t < T_FLAME) { const k = t / T_FLAME; col = mix(inkKey, T.burnt, k); dx = (Math.random() - 0.5) * 1.1; dy = (Math.random() - 0.5) * 0.8; }
      else if (t < T_FLAME + T_CHAR) col = T.burnt;
      else if (t < T_FLAME + T_CHAR + T_ASH) { const k = (t - T_FLAME - T_CHAR) / T_ASH; col = mix(T.burnt, T.ash, k); a = 1 - k * 0.78; }
      else if (t < MEND) { col = T.ash; a = 0.22 * (1 - sstep(MEND - 1.5, MEND, t)); }

}

function drawShadows() {

  ctx.save();

  ctx.translate(-OFF, 0);

  ctx.restore();

  ctx.fillStyle = 'rgba(0,0,0,0.75)'; ctx.shadowColor = T.shadow;
  ctx.shadowBlur = 26 * DPR; ctx.shadowOffsetX = (OFF + 16 + 14 * D.wing) * DPR; ctx.shadowOffsetY = (24 + 18 * D.wing) * DPR;
  ctx.translate(-OFF, 0);

  ctx.restore();
}

function drawLegs() {
  const lw = Math.max(1.2, L * 0.0028);
  for (const l of D.legs) {
    const lift = l.lift, sc = 1 + lift * 0.14;
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    // foot: webbed paw with four toes, fanned wider mid-stride, claws at the tips
    const fa = l.fang, ca0 = Math.cos(fa), sa0 = Math.sin(fa);
    const spread = 0.3 + lift * 0.2, tl = L * 0.037 * sc, pr = L * 0.025 * sc;
    const toes = [];
    for (let c = 0; c < 4; c++) {
      const a = fa + (c - 1.5) * spread;
      toes.push({ a, bx: l.ex + Math.cos(a) * pr * 0.9, by: l.ey + Math.sin(a) * pr * 0.9,
        tx: l.ex + Math.cos(a) * (pr * 0.9 + tl * (c === 1 || c === 2 ? 1 : 0.85)), ty: l.ey + Math.sin(a) * (pr * 0.9 + tl * (c === 1 || c === 2 ? 1 : 0.85)) });
    }

    ctx.beginPath(); ctx.moveTo(l.ex, l.ey);

    ctx.closePath(); ctx.fill();

      const px = -Math.sin(t.a), py = Math.cos(t.a);
      ctx.fillStyle = T.skin;
      ctx.beginPath();
      ctx.moveTo(l.ex + px * L * 0.009, l.ey + py * L * 0.009);
      ctx.lineTo(t.tx + px * L * 0.005, t.ty + py * L * 0.005); ctx.lineTo(t.tx - px * L * 0.005, t.ty - py * L * 0.005);
      ctx.lineTo(l.ex - px * L * 0.009, l.ey - py * L * 0.009); ctx.closePath(); ctx.fill(); ctx.stroke();
      // claw

      ctx.fillStyle = T.horn;
      ctx.beginPath(); ctx.moveTo(t.tx + px * 2.1, t.ty + py * 2.1);
      ctx.quadraticCurveTo(t.tx + Math.cos(t.a) * cl * 0.65 + px * 0.6, t.ty + Math.sin(t.a) * cl * 0.65 + py * 0.6 + 0.6, t.tx + Math.cos(t.a) * cl, t.ty + Math.sin(t.a) * cl + 1);
      ctx.lineTo(t.tx - px * 2.1, t.ty - py * 2.1); ctx.closePath(); ctx.fill(); ctx.lineWidth = 0.8; ctx.stroke(); ctx.lineWidth = lw;

      ctx.quadraticCurveTo(q.x + (c[i + 1].x - c[i - 1].x) * 0.35, q.y + (c[i + 1].y - c[i - 1].y) * 0.35, q.x + q.nx * q.w * 0.42, q.y + q.ny * q.w * 0.42);
      ctx.stroke();
    }
    ctx.restore();

const LX = -0.55, LY = -0.83;
function drawBody() {
  ctx.fillStyle = T.skinDeep; ctx.fill(bodyPath);
  // cylinder shading: each slice gets a gradient across the body, highlight leaning toward the light
  for (let j = 0; j < M - 1; j++) {
    const a = S[j], b = S[j + 1];
    let nx = a.nx + b.nx, ny = a.ny + b.ny; const nl = Math.hypot(nx, ny) || 1; nx /= nl; ny /= nl;
    const hw = (a.hw + b.hw) / 2, cx = (a.x + b.x) / 2, cy = (a.y + b.y) / 2;
    const uh = clamp(0.5 - 0.1 * (nx * LX + ny * LY), 0.4, 0.6);
    const g = ctx.createLinearGradient(cx + nx * hw, cy + ny * hw, cx - nx * hw, cy - ny * hw);
    g.addColorStop(0, T.rim); g.addColorStop(0.05, T.bellyDeep); g.addColorStop(0.11, T.belly); g.addColorStop(0.21, T.skin);
    g.addColorStop(uh - 0.17, T.skin); g.addColorStop(uh, T.skinLight); g.addColorStop(uh + 0.17, T.skin);
    g.addColorStop(0.79, T.skin); g.addColorStop(0.89, T.belly); g.addColorStop(0.95, T.bellyDeep); g.addColorStop(1, T.rim);
    ctx.fillStyle = g;

    ctx.beginPath();
    ctx.moveTo(a.x + a.nx * a.hw + a.tx * e, a.y + a.ny * a.hw + a.ty * e);
    ctx.lineTo(b.x + b.nx * b.hw - b.tx * e, b.y + b.ny * b.hw - b.ty * e);
    ctx.lineTo(b.x - b.nx * b.hw - b.tx * e, b.y - b.ny * b.hw - b.ty * e);
    ctx.lineTo(a.x - a.nx * a.hw + a.tx * e, a.y - a.ny * a.hw + a.ty * e);
    ctx.closePath(); ctx.fill();
  }

  const dark = new Path2D(), hi = new Path2D(), plates = new Path2D();
  for (let j = 2; j < M - 1; j++) {
    const s = S[j]; if (s.hw < 3.5) continue;

    for (let r = 0; r < rows; r++) {

      hi.quadraticCurveTo(qx - s.tx * b * 1.7 + LX * 1.1, qy - s.ty * b * 1.7 + LY * 1.1, qx - s.nx * a + LX * 1.1, qy - s.ny * a + LY * 1.1);
    }
    if ((j & 1) === 0) for (const sd of [-1, 1]) {

      plates.lineTo(s.x + s.nx * sd * s.hw * 0.8 - s.tx * 1.5, s.y + s.ny * sd * s.hw * 0.8 - s.ty * 1.5);

  ctx.strokeStyle = rgba(T.bellyDeep, 0.8); ctx.lineWidth = 1; ctx.stroke(plates);

  ctx.beginPath(); ctx.moveTo(S[6].x, S[6].y);
  for (let j = 7; j < M - 3; j++) ctx.lineTo(S[j].x, S[j].y);
  ctx.stroke();
  // throat glow while breathing
  if (D.breath > 0.05) {
    for (let j = 0; j < 20; j += 3) {

function drawPlates() {

  ctx.strokeStyle = T.rim; ctx.lineWidth = 1;
  let acc = 0, alt = 0;
  for (let j = 6; j < M - 3; j++) {

  ctx.save(); ctx.translate(t.x, t.y); ctx.rotate(ang);
  const g = ctx.createLinearGradient(0, 0, L * 0.09, 0);
  g.addColorStop(0, T.skin); g.addColorStop(0.35, T.spike); g.addColorStop(1, T.bellyDeep);
  ctx.fillStyle = g; ctx.strokeStyle = T.rim; ctx.lineWidth = 1.3;
  ctx.beginPath(); ctx.moveTo(-L * 0.01, 0);
  ctx.bezierCurveTo(L * 0.015, -L * 0.04, L * 0.06, -L * 0.034, L * 0.095, 0);
  ctx.bezierCurveTo(L * 0.06, L * 0.034, L * 0.015, L * 0.04, -L * 0.01, 0);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = rgba(T.rim, 0.55); ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(L * 0.085, 0); ctx.stroke();
  ctx.restore();
}

function drawWing(g) {
  const path = wingPath(g);
  const mx = (g.tips[1][0] + g.tips[2][0]) / 2, my = (g.tips[1][1] + g.tips[2][1]) / 2;
  const grad = ctx.createLinearGradient(g.S[0], g.S[1], mx, my);
  grad.addColorStop(0, T.wingA); grad.addColorStop(0.55, T.wingA); grad.addColorStop(1, T.wingB);
  ctx.fillStyle = grad; ctx.fill(path);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.strokeStyle = rgba(T.wingVein, 0.85); ctx.lineWidth = Math.max(1.2, L * 0.0025); ctx.stroke(path);
  // fine veins between the fingers
  ctx.strokeStyle = rgba(T.wingVein, 0.32); ctx.lineWidth = 1;
  ctx.beginPath();
  for (let i = 0; i < 3; i++) {
    const a = g.tips[i], b = g.tips[i + 1];
    for (let k = 1; k < 4; k++) {
      const f = k / 4, px = lerp(g.W[0], (a[0] + b[0]) / 2, 0.0), py = lerp(g.W[1], (a[1] + b[1]) / 2, 0.0);
      const ex = lerp(a[0], b[0], f), ey = lerp(a[1], b[1], f);
      ctx.moveTo(px + (ex - px) * 0.28, py + (ey - py) * 0.28); ctx.lineTo(ex + (g.W[0] - ex) * 0.1, ey + (g.W[1] - ey) * 0.1);
    }
  }
  ctx.stroke();
  // bones: arm + four curved fingers, with a highlight edge
  const arm = [[g.S[0], g.S[1], (g.S[0] + g.W[0]) / 2 + g.f[0] * L * 0.012, (g.S[1] + g.W[1]) / 2 + g.f[1] * L * 0.012, g.W[0], g.W[1], Math.max(3, L * 0.013)]];
  for (let i = 0; i < 4; i++) arm.push([g.W[0], g.W[1], g.ctr[i][0], g.ctr[i][1], g.tips[i][0], g.tips[i][1], Math.max(1.4, L * (0.0075 - i * 0.0011))]);
  for (const [x0, y0, cx, cy, x1, y1, lw] of arm) {
    ctx.strokeStyle = T.wingVein; ctx.lineWidth = lw;
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.quadraticCurveTo(cx, cy, x1, y1); ctx.stroke();
    ctx.strokeStyle = rgba(T.skinLight, 0.4); ctx.lineWidth = Math.max(0.8, lw * 0.28);
    ctx.beginPath(); ctx.moveTo(x0 + LX, y0 + LY); ctx.quadraticCurveTo(cx + LX, cy + LY, x1 + LX, y1 + LY); ctx.stroke();
  }
  // wrist claw + knuckle
  const cd = g.dir(g.armTh - 0.9);
  ctx.fillStyle = T.horn; ctx.strokeStyle = T.rim; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(g.W[0] - g.n[1] * 3.2, g.W[1] + g.n[0] * 3.2);
  ctx.quadraticCurveTo(g.W[0] + cd[0] * L * 0.02, g.W[1] + cd[1] * L * 0.02 + 1, g.W[0] + cd[0] * L * 0.046, g.W[1] + cd[1] * L * 0.046);
  ctx.lineTo(g.W[0] + g.n[1] * 3.2, g.W[1] - g.n[0] * 3.2); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = T.skin; ctx.beginPath(); ctx.arc(g.W[0], g.W[1], Math.max(3.2, L * 0.012), 0, TAU); ctx.fill(); ctx.stroke();
  ctx.fillStyle = T.skin; ctx.beginPath(); ctx.arc(g.S[0], g.S[1], Math.max(3.4, L * 0.014), 0, TAU); ctx.fill(); ctx.stroke();
}

function drawHead() {
  const p = S[0], j = clamp(D.breath * 0.92 + 0.035 * Math.sin(D.time * 1.7), 0, 1);
  ctx.save();
  ctx.translate(p.x, p.y); ctx.rotate(D.headAng); ctx.scale(L, L);
  const px = v => v / L;
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.strokeStyle = T.rim; ctx.lineWidth = px(1.3);

  for (const s of [-1, 1]) {
    // ear frills: three ribs and a scalloped membrane
    const fg = ctx.createLinearGradient(0, 0, -0.09, s * 0.08);
    fg.addColorStop(0, T.wingA); fg.addColorStop(1, T.wingB);
    ctx.fillStyle = fg;
    ctx.beginPath(); ctx.moveTo(0.012, s * 0.04);
    ctx.quadraticCurveTo(-0.03, s * 0.05, -0.078, s * 0.09);
    ctx.quadraticCurveTo(-0.082, s * 0.07, -0.098, s * 0.066);
    ctx.quadraticCurveTo(-0.08, s * 0.058, -0.09, s * 0.04);
    ctx.quadraticCurveTo(-0.06, s * 0.044, -0.05, s * 0.03);
    ctx.lineTo(0, s * 0.03); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = rgba(T.wingVein, 0.7); ctx.lineWidth = px(1.1);
    for (const [x, y] of [[-0.078, 0.09], [-0.098, 0.066], [-0.09, 0.04]]) { ctx.beginPath(); ctx.moveTo(0.004, s * 0.036); ctx.lineTo(x * 0.96, s * y * 0.96); ctx.stroke(); }
    ctx.strokeStyle = T.rim; ctx.lineWidth = px(1.3);
    // main horns, swept back, ivory to dark at the base
    const hg = ctx.createLinearGradient(0.012, 0, -0.13, 0);
    hg.addColorStop(0, T.hornDark); hg.addColorStop(0.5, T.horn); hg.addColorStop(1, T.horn);
    ctx.fillStyle = hg;
    ctx.beginPath(); ctx.moveTo(0.016, s * 0.036);
    ctx.bezierCurveTo(-0.03, s * 0.078, -0.095, s * 0.09, -0.142, s * 0.05);
    ctx.bezierCurveTo(-0.092, s * 0.07, -0.03, s * 0.056, -0.004, s * 0.026);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = rgba(T.hornDark, 0.65); ctx.lineWidth = px(1);
    for (let r = 1; r <= 3; r++) { const x = 0.004 - r * 0.026, y = s * (0.052 + r * 0.007); ctx.beginPath(); ctx.moveTo(x, y - s * 0.008); ctx.lineTo(x - 0.003, y + s * 0.006); ctx.stroke(); }
    ctx.strokeStyle = T.rim; ctx.lineWidth = px(1.3);
    // cheek spines
    ctx.fillStyle = T.spike;
    for (const [x, y, tx, ty] of [[0.046, 0.044, 0.026, 0.074], [0.02, 0.046, -0.002, 0.07]]) {
      ctx.beginPath(); ctx.moveTo(x, s * y); ctx.lineTo(tx, s * ty); ctx.lineTo(x - 0.016, s * (y - 0.002)); ctx.closePath(); ctx.fill(); ctx.stroke();
    }
  }

  // lower jaw and the mouth
  const jx = 0.122 + 0.02 * j;
  const jg = ctx.createLinearGradient(0, -0.03, 0, 0.03);
  jg.addColorStop(0, T.skinDeep); jg.addColorStop(0.5, T.skin); jg.addColorStop(1, T.skinDeep);
  ctx.fillStyle = jg;
  smoothClosed([[-0.012, -0.029], [0.04, -0.032], [0.082, -0.024 - 0.005 * j], [jx, 0], [0.082, 0.024 + 0.005 * j], [0.04, 0.032], [-0.012, 0.029]]);
  ctx.fill(); ctx.stroke();
  if (j > 0.05) {
    ctx.fillStyle = T.mouth;
    ctx.beginPath(); ctx.moveTo(0.05, -0.018); ctx.quadraticCurveTo(0.09, -0.019, jx - 0.006, 0); ctx.quadraticCurveTo(0.09, 0.019, 0.05, 0.018); ctx.closePath(); ctx.fill();
    ctx.fillStyle = T.tongue;
    ctx.beginPath(); ctx.moveTo(0.06, -0.005); ctx.quadraticCurveTo(0.09, -0.012 + 0.003 * Math.sin(D.time * 9), jx - 0.012, -0.003);
    ctx.lineTo(jx - 0.004, 0); ctx.lineTo(jx - 0.012, 0.004); ctx.quadraticCurveTo(0.09, 0.012 - 0.003 * Math.sin(D.time * 9), 0.06, 0.005); ctx.closePath(); ctx.fill();
    if (D.breath > 0.05) {
      const g = ctx.createRadialGradient(0.108, 0, 0, 0.108, 0, 0.07);
      g.addColorStop(0, `rgba(255,224,130,${0.95 * D.breath})`); g.addColorStop(0.5, `rgba(255,160,50,${0.5 * D.breath})`); g.addColorStop(1, 'rgba(255,140,30,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0.108, 0, 0.07, 0, TAU); ctx.fill();
    }
  }

  // upper skull, shaded like a rounded form
  const tipx = 0.118 - 0.013 * j;
  const sg = ctx.createLinearGradient(0, -0.045, 0, 0.045);
  sg.addColorStop(0, T.skinDeep); sg.addColorStop(0.3, T.skin); sg.addColorStop(0.5, T.skinLight); sg.addColorStop(0.7, T.skin); sg.addColorStop(1, T.skinDeep);
  ctx.fillStyle = sg; ctx.strokeStyle = T.rim; ctx.lineWidth = px(1.5);
  smoothClosed([[-0.03, -0.034], [-0.004, -0.047], [0.028, -0.043], [0.058, -0.033], [0.09, -0.022], [tipx - 0.004, -0.0125], [tipx + 0.004, 0], [tipx - 0.004, 0.0125], [0.09, 0.022], [0.058, 0.033], [0.028, 0.043], [-0.004, 0.047], [-0.03, 0.034]]);
  ctx.fill(); ctx.stroke();
  // scale lines + crest
  ctx.strokeStyle = rgba(T.skinDeep, 0.55); ctx.lineWidth = px(1);
  for (let x = -0.02; x < tipx - 0.012; x += 0.014) {
    const w = 0.04 * (1 - Math.max(0, (x - 0.02) / 0.1)) + 0.004;
    ctx.beginPath(); ctx.moveTo(x, -w * 0.8); ctx.quadraticCurveTo(x - 0.007, 0, x, w * 0.8); ctx.stroke();
  }
  ctx.strokeStyle = rgba(T.spike, 0.75); ctx.lineWidth = px(1.6);
  ctx.beginPath(); ctx.moveTo(-0.028, 0); ctx.lineTo(tipx - 0.012, 0); ctx.stroke();
  // teeth
  if (j > 0.12) {
    ctx.fillStyle = T.horn; ctx.strokeStyle = rgba(T.rim, 0.8); ctx.lineWidth = px(0.8);
    for (const s of [-1, 1]) for (const x of [0.058, 0.07, 0.082, 0.094, 0.104 - 0.013 * j]) {
      const wy = Math.max(0.008, 0.033 - (x - 0.058) * 0.5);
      ctx.beginPath(); ctx.moveTo(x - 0.005, s * wy); ctx.lineTo(x + 0.001, s * (wy - 0.011)); ctx.lineTo(x + 0.005, s * wy); ctx.closePath(); ctx.fill(); ctx.stroke();
    }
  }
  // nostrils, brows
  for (const s of [-1, 1]) {
    ctx.fillStyle = T.rim;
    ctx.beginPath(); ctx.ellipse(tipx - 0.006, s * 0.0062, 0.0027, 0.0016, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = T.skinDeep; ctx.lineWidth = 0.0085;
    ctx.beginPath(); ctx.moveTo(0.012, s * 0.043); ctx.quadraticCurveTo(0.03, s * 0.037, 0.05, s * 0.022); ctx.stroke();
  }
  // eyes that follow what it is looking at
  const lookLocalAng = D.lookOn ? angDiff(Math.atan2(D.look.y - p.y, D.look.x - p.x), D.headAng) : 0;
  const blink = D.blinkT >= 0 ? Math.sin(clamp(D.blinkT / 0.2, 0, 1) * PI) : 0;
  for (const s of [-1, 1]) {
    const ex = 0.036, ey = s * 0.028, rx = 0.0092, ry = 0.0076 * (1 - 0.9 * blink);
    if (D.breath > 0.1) {
      const g = ctx.createRadialGradient(ex, ey, 0, ex, ey, 0.026);
      g.addColorStop(0, `rgba(255,210,80,${0.75 * D.breath})`); g.addColorStop(1, 'rgba(255,170,40,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(ex, ey, 0.026, 0, TAU); ctx.fill();
    }
    const eg = ctx.createRadialGradient(ex, ey, 0, ex, ey, rx);
    eg.addColorStop(0, '#fff2a8'); eg.addColorStop(0.55, T.eye); eg.addColorStop(1, '#c26a1c');
    ctx.fillStyle = eg; ctx.strokeStyle = T.rim; ctx.lineWidth = px(1.1);
    ctx.beginPath(); ctx.ellipse(ex, ey, rx, Math.max(0.0008, ry), 0, 0, TAU); ctx.fill(); ctx.stroke();
    if (blink < 0.85) {
      const ox = Math.cos(lookLocalAng) * 0.0022, oy = Math.sin(lookLocalAng) * 0.0034;
      ctx.fillStyle = '#0a0403';
      ctx.beginPath(); ctx.ellipse(ex + ox, ey + oy, 0.0016 + 0.0012 * D.breath, ry * 0.92, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.beginPath(); ctx.arc(ex - 0.0025, ey - 0.0025, 0.0011, 0, TAU); ctx.fill();
    }
  }
  ctx.restore();
}

function drawParticles() {
  const add = T.blend;
  for (const q of parts) {
    const f = q.age / q.life;
    if (q.k === 'fire' || q.k === 'flame') {
      const sp = f < 0.22 ? SP.core : f < 0.6 ? SP.mid : SP.edge;
      const s = q.size * (0.5 + 1.5 * f) * (q.k === 'flame' ? 1.3 : 1);
      ctx.globalCompositeOperation = add;
      ctx.globalAlpha = Math.pow(1 - f, 0.9) * (q.k === 'flame' ? 0.75 : isDark() ? 0.5 : 0.8);
      ctx.drawImage(sp, q.x - s, q.y - s, s * 2, s * 2);
    } else if (q.k === 'smoke') {
      const s = q.size * (1 + f * 2.2);
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = (1 - f) * (isDark() ? 0.5 : 0.7);
      ctx.drawImage(SP.smoke, q.x - s, q.y - s, s * 2, s * 2);
    }
  }
  // sparks and embers as crisp little marks
  ctx.globalCompositeOperation = add; ctx.lineCap = 'round';
  for (const q of parts) {
    const f = q.age / q.life;
    if (q.k === 'spark') {
      ctx.globalAlpha = (1 - f) * 0.9; ctx.strokeStyle = isDark() ? 'rgb(255,214,130)' : 'rgb(236,130,30)'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(q.x, q.y); ctx.lineTo(q.x - q.vx * 0.035, q.y - q.vy * 0.035); ctx.stroke();
    } else if (q.k === 'ember') {
      const fl = 0.65 + 0.35 * Math.sin(clock * 22 + q.rot * 4);
      ctx.globalAlpha = (1 - f) * fl; ctx.fillStyle = f < 0.5 ? '#ffb347' : '#ff6a20';
      ctx.beginPath(); ctx.arc(q.x, q.y, 1.5 + 1.3 * (1 - f), 0, TAU); ctx.fill();
    }
  }
  ctx.globalCompositeOperation = 'source-over';
  for (const q of parts) {
    if (q.k !== 'ash') continue;
    const f = q.age / q.life;
    ctx.globalAlpha = (1 - f) * 0.85; ctx.fillStyle = T.ash;
    ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.rot); ctx.fillRect(-q.s, -q.s * 0.45, q.s * 2, q.s * 0.9); ctx.restore();
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
}

function drawBloom() {
  if (D.breath < 0.05 && fireW <= 0) return;
  ctx.globalCompositeOperation = isDark() ? 'lighter' : 'source-over';
  if (D.mouth) {
    const s = L * 0.26 * D.breath;
    ctx.globalAlpha = (isDark() ? 0.3 : 0.24) * D.breath;
    ctx.drawImage(SP.glow, D.mouth.x - s, D.mouth.y - s, s * 2, s * 2);
  }
  if (fireW > 0) {
    const s = L * 0.42;
    ctx.globalAlpha = (isDark() ? 0.14 : 0.1) * clamp(fireW / 40, 0, 1);
    ctx.drawImage(SP.glow, fireCx - s, fireCy - s, s * 2, s * 2);
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
}

function drawCursor() {
  if (!ptr.inside || (clock - ptr.moved > 10 && !ptr.down)) return;
  if (ptr.type === 'touch' && !ptr.down && clock - ptr.moved > 1.2) return;
  const r = ptr.down ? 9 : 12 + 1.8 * Math.sin(clock * 4);
  ctx.save();
  if (ptr.down) {
    ctx.globalCompositeOperation = isDark() ? 'lighter' : 'source-over';
    ctx.globalAlpha = 0.55; ctx.drawImage(SP.glow, ptr.x - 30, ptr.y - 30, 60, 60); ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }
  ctx.lineWidth = 1.5; ctx.strokeStyle = ptr.down ? 'rgba(255,150,50,0.95)' : T.cursor;
  ctx.beginPath(); ctx.arc(ptr.x, ptr.y, r, 0, TAU); ctx.stroke();
  ctx.fillStyle = ptr.down ? 'rgba(255,200,110,1)' : T.cursor;
  ctx.beginPath(); ctx.arc(ptr.x, ptr.y, 2.2, 0, TAU); ctx.fill();
  ctx.restore();
}

function draw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(paperC, 0, 0);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawScorches();
  drawBurnGlow();
  drawText();
  buildPaths();
  drawShadows();
  drawLegs();
  drawBody();
  drawPlates();
  drawWing(D.wg[0]); drawWing(D.wg[1]);
  drawHead();
  drawParticles();
  drawBloom();
  drawCursor();
}

// ---------- input & loop ----------
function setPtr(e) { ptr.x = e.clientX; ptr.y = e.clientY; ptr.inside = true; ptr.moved = clock; ptr.type = e.pointerType || 'mouse'; }
cv.addEventListener('pointermove', setPtr);
cv.addEventListener('pointerdown', e => { setPtr(e); ptr.down = true; D.holdUntil = clock + 0.55; try { cv.setPointerCapture(e.pointerId); } catch (_) {} });
const up = () => { ptr.down = false; };
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
cv.addEventListener('pointerleave', e => { if (e.pointerType !== 'touch') { ptr.inside = false; } ptr.down = false; });
window.addEventListener('keydown', e => { if (e.code === 'Space') { keyBreath = true; e.preventDefault(); } });
window.addEventListener('keyup', e => { if (e.code === 'Space') keyBreath = false; });

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  L = clamp(Math.min(W, H * 1.15) * 0.82, 250, 640);
  fitText(); buildPaper();
  initDragon(!initialised);
}
window.addEventListener('resize', resize);

let last = 0, running = true;
function frame(t) {
  if (!running) return;
  const dt = Math.min(0.033, last ? (t - last) / 1000 : 0.016);
  last = t;
  update(dt); draw();
  requestAnimationFrame(frame);
}

buildBlocks();
resize();
Promise.all(['400 18px Fraunces', '600 18px Fraunces', '400 12px "Plex Mono"'].map(f => document.fonts.load(f).catch(() => {})))
  .then(() => { fitText(); buildPaper(); });
requestAnimationFrame(frame);

// stepping hooks: deterministic screenshots and movement analysis
window.__dragon = {
  step(sec, hz) { hz = hz || 60; const n = Math.round(sec * hz); for (let i = 0; i < n; i++) update(1 / hz); draw(); },
  pause() { running = false; }, resume() { if (!running) { running = true; last = 0; requestAnimationFrame(frame); } },
  pointer(x, y, down) { ptr.x = x; ptr.y = y; ptr.inside = true; ptr.moved = clock; ptr.down = !!down; if (down) D.holdUntil = clock + 0.55; },
  release() { ptr.down = false; ptr.inside = false; },
  trace(sec, hz, script) {
    hz = hz || 60; const out = [], n = Math.round(sec * hz);
    for (let i = 0; i < n; i++) {
      if (script) script(i / hz);
      const before = D.steps; update(1 / hz);
      let len = 0; for (let k = 1; k < N; k++) len += Math.hypot(C[k].x - C[k - 1].x, C[k].y - C[k - 1].y);
      let minSep = 1e9; for (let a = 0; a < N; a++) for (let b = a + 8; b < N; b++) minSep = Math.min(minSep, Math.hypot(C[a].x - C[b].x, C[a].y - C[b].y));
      let stretch = 0; for (const l of D.legs) stretch = Math.max(stretch, Math.hypot(l.ex - l.ax, l.ey - l.ay) / (L * 0.182));
      out.push([i / hz, D.x, D.y, D.h, D.v, D.w, len, minSep, D.steps - before, stretch, D.headYaw, D.mode]);
    }
    draw(); return out;
  },
  state() { return { x: D.x, y: D.y, h: D.h, v: D.v, w: D.w, breath: D.breath, wing: D.wing, parts: parts.length, burning: words.filter(w => w.burn >= 0).length, words: words.length, fs, W, H, L, steps: D.steps, mode: D.mode, legs: D.legs.map(l => ({ sw: !!l.sw, ex: l.ex, ey: l.ey, ax: l.ax, ay: l.ay, pair: l.pair })) }; }
};
})();
</script>
