<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#151e22">
<title>Against the Line — A Generative Study</title>
<style>
:root{color-scheme:dark;--ink:#18272d;--bar:#142126;--panel:#18282e;--stroke:#405157;--text:#f0f0e8;--quiet:#a1b0ad;--accent:#f6a14a;--paper:#e7e7db}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif;background:var(--paper)}
button,input{font:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:2px solid #f7b977;outline-offset:3px}
button:disabled{opacity:.4;cursor:default}
#app{position:fixed;inset:0;overflow:hidden;isolation:isolate;background:var(--paper)}
.artboard{position:absolute;inset:0;background:var(--paper);overflow:hidden}
#art{position:absolute;inset:0;width:100%;height:100%;display:block}
/* These controls float above the full viewport, without a page header or footer. */
.hud{position:absolute;inset:0;pointer-events:none;z-index:5;color:var(--text)}
.hud>*{pointer-events:auto}
.identity{position:absolute;top:clamp(18px,3vw,41px);left:clamp(18px,3vw,48px);color:var(--ink);max-width:310px;text-shadow:0 1px 1px #e7e7db66}
.identity .eyebrow{font:10px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.14em;color:#55696d}
.identity h1{font-size:clamp(23px,2.5vw,35px);line-height:1.02;letter-spacing:-.055em;margin:12px 0 9px;font-weight:700}
.identity h1 em{font-style:normal;font-weight:400}
.identity .dek{font:10px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.09em;color:#52686b}
.identity::before{content:'';position:absolute;top:-11px;left:0;width:27px;height:3px;background:#d86a32}
.toolbar{position:absolute;top:clamp(13px,2.2vw,28px);right:clamp(12px,2.2vw,30px);display:flex;align-items:stretch;background:var(--bar);box-shadow:0 9px 25px #12232936;border:1px solid #33454b;min-height:44px}
.tool{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-width:43px;min-height:44px;padding:0 13px;background:transparent;border:0;border-right:1px solid #33454b;color:#dbe2dd;font-size:11px;letter-spacing:.01em;white-space:nowrap}
.tool:last-child{border-right:0}
.tool:hover,.tool[aria-pressed="true"],.tool[aria-expanded="true"]{background:#293b40;color:#fff}
.tool.variation{color:#f8b470}
.tool svg,.round-button svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round;flex:none}
.tool .shortcut{font:10px ui-monospace,SFMono-Regular,Consolas,monospace;color:#73898d}
.panel{position:absolute;bottom:clamp(20px,3vw,42px);left:clamp(18px,3vw,48px);width:306px;max-height:min(650px,calc(100dvh - 126px));display:flex;flex-direction:column;background:var(--panel);border:1px solid #405359;box-shadow:0 18px 60px #06131952;color:var(--text);overflow:hidden;transform-origin:bottom left}
.panel[hidden]{display:none}
.panel-top{flex:none;display:flex;align-items:center;gap:8px;border-bottom:1px solid #34464b;padding:14px 16px 12px}
.panel-kicker{font:10px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.13em;color:#b7c3bd}
.panel-name{font-size:15px;font-weight:700;margin-top:4px;letter-spacing:-.025em}
.panel-top button{margin-left:auto;background:none;color:#a9bab5;border:0;width:31px;height:32px;display:grid;place-items:center;font-size:22px}
.panel-top button:hover{color:#fff;background:#2b3b40}
.panel-body{padding:15px 16px 10px;overflow:auto;overscroll-behavior:contain;scrollbar-color:#607175 transparent;scrollbar-width:thin}
.section-label{margin:3px 0 15px;font:10px ui-monospace,SFMono-Regular,Consolas,monospace;color:#7e979a;letter-spacing:.15em}
.param{margin-bottom:18px}
.param-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.param-head label{font-size:12px;color:#e3e9e2}
.param-head output{color:var(--accent);font:12px ui-monospace,SFMono-Regular,Consolas,monospace}
input[type=range]{display:block;width:100%;height:3px;margin:0;accent-color:var(--accent);cursor:pointer}
input[type=range]::-webkit-slider-thumb{cursor:grab}
.panel-rule{height:1px;background:#394b4f;margin:21px 0 17px}
.switchrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:7px 0;font-size:12px;color:#e0e8e3;cursor:pointer}
.switchrow small{font-size:10px;color:#8fa2a2}
.switch{position:relative;display:inline-block;width:31px;height:18px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;cursor:pointer;margin:0;width:100%;height:100%}
.switch .track{display:block;width:100%;height:100%;border:1px solid #64767a;background:#28373c;transition:background .12s}
.switch .track::before{content:'';display:block;width:10px;height:10px;margin:3px;background:#96a5a5;transition:transform .12s,background .12s}
.switch input:checked+.track{background:#664632;border-color:#d78949}
.switch input:checked+.track::before{transform:translateX(13px);background:#ffb674}
.switch input:focus-visible+.track{outline:2px solid #f7b977;outline-offset:3px}
.panel-foot{border-top:1px solid #34464b;padding:10px 16px 11px;display:flex;align-items:center;justify-content:space-between;flex:none}
.textbutton{border:0;background:none;padding:6px 0;color:#bfcac5;font-size:11px;text-decoration:underline;text-decoration-color:#627679;text-underline-offset:4px}
.textbutton:hover{color:#fff}
.panel-tip{font:10px ui-monospace,SFMono-Regular,Consolas,monospace;color:#72898b}
.status{position:absolute;right:clamp(18px,3vw,42px);bottom:clamp(21px,3vw,38px);text-align:right;color:#34494c;font:10px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.08em;text-shadow:0 1px #eee8}
.status .counter{font-size:11px;letter-spacing:.12em;color:#23373c;margin-bottom:7px}
.view-controls{position:absolute;left:50%;bottom:clamp(19px,3vw,34px);transform:translateX(-50%);display:flex;background:var(--bar);border:1px solid #344a50;box-shadow:0 8px 24px #0613192e}
.view-controls button{border:0;background:transparent;color:#c2d0cb;font:11px ui-monospace,SFMono-Regular,Consolas,monospace;min-width:48px;padding:12px 15px}
.view-controls button+button{border-left:1px solid #3a4b50}
.view-controls button:hover,.view-controls button[aria-pressed="true"]{background:#34474b;color:#fff}
.view-controls button[aria-pressed="true"]{box-shadow:inset 0 -2px var(--accent)}
.export-menu{position:absolute;top:calc(clamp(13px,2.2vw,28px) + 52px);right:clamp(12px,2.2vw,30px);width:235px;background:#18282e;border:1px solid #4a5a5d;color:#e7eee8;box-shadow:0 18px 42px #06131958;z-index:10;padding:7px}
.export-menu[hidden]{display:none}
.export-menu .menu-caption{font:10px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.14em;color:#839799;padding:10px 9px 9px}
.export-menu button{border:0;background:transparent;color:inherit;display:flex;align-items:center;justify-content:space-between;text-align:left;width:100%;padding:12px 10px;font-size:12px}
.export-menu button:hover,.export-menu button:focus-visible{background:#314347}
.export-menu button span{font-size:10px;color:#a7b8b5}
.reveal{position:absolute;right:0;top:24px;z-index:8;display:none;background:#16252a;color:#f5f3e7;border:1px solid #688081;border-right:0;padding:11px 12px;transform:translateX(calc(100% - 5px));transition:transform .16s ease;font-size:11px;letter-spacing:.02em;box-shadow:0 10px 25px #101b2060}
.reveal:hover,.reveal:focus-visible{transform:translateX(0)}
#app[data-ui="hidden"] .hud{display:none}
#app[data-ui="hidden"] .reveal{display:block}
.toast{position:absolute;top:86px;left:50%;transform:translateX(-50%);background:#17272b;color:#f5f2e9;border:1px solid #586a69;padding:10px 18px;font-size:11px;z-index:15;box-shadow:0 12px 28px #15282a40;pointer-events:none}
.toast[hidden]{display:none}
/* Landscape editor, small screens, portrait mode, and short laptop viewports. */
@media(max-width:900px){
 .identity{top:18px;left:18px;max-width:190px}.identity h1{font-size:23px;margin:8px 0 7px}.identity .dek{font-size:9px;line-height:1.6}
 .toolbar{top:12px;right:12px;min-height:44px}.tool{min-width:42px;padding:0 11px}.tool .word,.tool .shortcut{display:none}
 .panel{left:12px;bottom:12px;width:min(325px,calc(100vw - 24px));max-height:calc(100dvh - 100px)}
 .status{bottom:18px;right:15px;font-size:9px}
 .view-controls{bottom:13px}.view-controls button{padding:10px 12px;min-width:42px}
 .export-menu{right:12px;top:64px}
}
@media(max-width:600px){
 .hud::before{content:'';position:absolute;top:0;left:0;right:0;height:83px;background:rgba(234,236,229,.97);border-bottom:1px solid #9fb0ae80;pointer-events:none}
 .identity{top:17px;left:13px;max-width:145px}.identity h1{font-size:18px;line-height:1.08;margin:10px 0 7px}.identity .eyebrow{font-size:8px;letter-spacing:.06em}.identity .dek{font-size:8px;letter-spacing:0}
 .toolbar{top:12px;right:9px}.tool{min-width:38px;padding:0 9px}
 .toolbar .tool svg{width:17px;height:17px}
 .panel{bottom:62px;left:8px;width:calc(100vw - 16px);max-height:min(460px,calc(100dvh - 145px))}
 .view-controls{left:13px;transform:none;bottom:9px}
 .status{right:12px;bottom:12px}
 .status .counter{font-size:10px;margin-bottom:2px}
 .status .detail{display:none}
 .export-menu{right:9px;top:63px;width:min(235px,calc(100vw - 18px))}
}
@media(max-height:600px){.identity .dek{display:none}.panel{bottom:8px;max-height:calc(100dvh - 92px)}.view-controls,.status{bottom:8px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app" data-ui="visible">
  <main class="artboard" id="artboard" aria-label="Interactive generative artwork">
    <svg id="art" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Top-down abstract artwork of three orange snowplows in echelon formation and a silver Chevrolet Cruze trying to pass on the shoulder"></svg>
  </main>
  <div class="hud" id="hud">
    <div class="identity">
      <div class="eyebrow">GENERATIVE WORK &nbsp;/&nbsp; 001</div>
      <h1>Against <em>the</em> Line</h1>
      <div class="dek">ECHELON SWEEP. ONE BREAKAWAY.</div>
    </div>
    <nav class="toolbar" aria-label="Artwork actions">
      <button class="tool" id="togglePanel" title="Show or hide composition controls" aria-expanded="true" aria-controls="controlPanel"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M7 4v6M4 17h16M16 14v6"/></svg><span class="word">Adjust</span></button>
      <button class="tool variation" id="shuffle" title="New variation (R)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 3h5v5M4 20l6-6M15 9l6-6M4 4l17 17M16 21h5v-5"/></svg><span class="word">Variation</span><span class="shortcut">R</span></button>
      <button class="tool" id="toggleExport" title="Export artwork" aria-expanded="false" aria-controls="exportMenu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M4 16v4h16v-4"/></svg><span class="word">Export</span></button>
      <button class="tool" id="toggleHud" title="Hide HUD (H)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18M9.8 9.8a3 3 0 004.4 4.4M6.5 6.5A10.6 10.6 0 001 12s4 7 11 7c1.9 0 3.6-.5 5-1.3M10 5.1c.7-.1 1.4-.1 2-.1 7 0 11 7 11 7a16 16 0 01-2.1 2.9"/></svg><span class="word">Hide HUD</span><span class="shortcut">H</span></button>
      <button class="tool" id="toggleFullscreen" title="Enter fullscreen (F)" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg><span class="word" id="fullscreenLabel">Fullscreen</span></button>
    </nav>
    <aside class="panel" id="controlPanel" aria-label="Composition controls">
      <div class="panel-top"><div><div class="panel-kicker">STUDIO / 01</div><div class="panel-name">Composition</div></div><button id="closePanel" title="Close composition controls" aria-label="Close composition controls">×</button></div>
      <div class="panel-body">
        <div class="section-label">01 &nbsp; WEATHER &amp; FORM</div>
        <div class="param"><div class="param-head"><label for="reduction">Abstraction</label><output id="reductionValue">65</output></div><input id="reduction" type="range" min="0" max="100" value="65" aria-label="Abstraction level"></div>
        <div class="param"><div class="param-head"><label for="storm">Snow density</label><output id="stormValue">64</output></div><input id="storm" type="range" min="0" max="100" value="64" aria-label="Snow density"></div>
        <div class="param"><div class="param-head"><label for="heading">Road angle</label><output id="headingValue">24°</output></div><input id="heading" type="range" min="-10" max="40" value="24" aria-label="Road angle"></div>
        <div class="panel-rule"></div>
        <div class="section-label">02 &nbsp; ANNOTATION</div>
        <label class="switchrow" for="pathVisible"><span>Cruze trajectory</span><span class="switch"><input type="checkbox" id="pathVisible" checked><span class="track"></span></span></label>
        <label class="switchrow" for="notesVisible"><span>Field notes</span><span class="switch"><input type="checkbox" id="notesVisible"><span class="track"></span></span></label>
      </div>
      <div class="panel-foot"><button class="textbutton" id="reset">Restore original</button><span class="panel-tip">H: HIDE ALL &nbsp;·&nbsp; R: REMIX</span></div>
    </aside>
    <div class="view-controls" role="group" aria-label="Artwork framing">
      <button id="fit" aria-pressed="false" title="Show entire artwork">FIT</button><button id="fill" aria-pressed="true" title="Fill screen, cropping when necessary">FILL</button>
    </div>
    <div class="status" aria-label="Current edition"><div class="counter" id="edition">EDITION 042</div><div class="detail">PLAN VIEW &nbsp;/&nbsp; ECHELON SWEEP &nbsp;/&nbsp; SVG</div></div>
    <div class="export-menu" id="exportMenu" hidden>
      <div class="menu-caption">OUTPUT / NO HUD</div>
      <button id="saveSvg">Vector artwork <span>SVG</span></button>
      <button id="savePng">High-resolution print <span>PNG · 3200 × 2000</span></button>
    </div>
  </div>
  <button class="reveal" id="revealHud" title="Show HUD (H)">SHOW HUD &nbsp; H</button>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</div>
<script>
/*
 * AGAINST THE LINE
 * A small, dependency-free generative artwork written as editable SVG.
 * EDITING MAP:
 *   drawGround()    = paper and road
 *   drawRoad()      = lanes, old tire tracks and scraped asphalt
 *   drawSnow()      = atmospheric marks and aerodynamic snow ribbons
 *   drawPlow()      = one abstract snowplow assembled from vector pieces
 *   drawCruze()     = a silver sedan, abstracted but with a Chevy grille
 *   drawTrajectory()= the conflict between a convoy and a passing car
 * Everything is procedural. No reference images are embedded or traced.
 */
const W=1600,H=1000;
const C={paper:'#e7e7db',paper2:'#f4f1e8',road:'#202f36',asphalt:'#304049',deep:'#142126',navy:'#152229',powder:'#d1dbe0',ice:'#b6c9ce',snow:'#faf8ee',rust:'#de6429',orange:'#f28a32',gold:'#f7c265',car:'#c4ccd0',carHi:'#f4f4ef',crimson:'#bb3b2b'};
const art=document.getElementById('art');
const reduce=document.getElementById('reduction');
const storm=document.getElementById('storm');
const rVal=document.getElementById('reductionValue');
const sVal=document.getElementById('stormValue');
const edition=document.getElementById('edition');
const heading=document.getElementById('heading');
const headingValue=document.getElementById('headingValue');
const pathVisible=document.getElementById('pathVisible');
const notesVisible=document.getElementById('notesVisible');
let seed=42;
let idCounter=0;
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;');
function hash(s){let a=s>>>0;return ()=>{a+=0x6D2B79F5;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return ((t^t>>>14)>>>0)/4294967296;};}
let rnd=hash(seed);
const rr=(min,max)=>min+rnd()*(max-min);
const ri=(min,max)=>Math.floor(rr(min,max));
const choice=a=>a[ri(0,a.length)];
const f=n=>Number(n).toFixed(1);
const rect=(x,y,w,h,fill,extra='')=>`<rect x="${f(x)}" y="${f(y)}" width="${f(w)}" height="${f(h)}" fill="${fill}" ${extra}/>`;
const line=(x1,y1,x2,y2,stroke,sw=1,extra='')=>`<line x1="${f(x1)}" y1="${f(y1)}" x2="${f(x2)}" y2="${f(y2)}" stroke="${stroke}" stroke-width="${sw}" ${extra}/>`;
const path=(d,fill='none',extra='')=>`<path d="${d}" fill="${fill}" ${extra}/>`;
const poly=(pts,fill,extra='')=>`<polygon points="${pts.map(p=>`${f(p[0])},${f(p[1])}`).join(' ')}" fill="${fill}" ${extra}/>`;
const circ=(x,y,r,fill,extra='')=>`<circle cx="${f(x)}" cy="${f(y)}" r="${f(r)}" fill="${fill}" ${extra}/>`;
const grp=(content,transform,extra='')=>`<g transform="${transform}" ${extra}>${content}</g>`;
const absVal=()=>+reduce.value/100, stormVal=()=>+storm.value/100;
const LANDSCAPE_PLOWS=[
  {x:558,y:386,angle:-8,scale:.95,index:1},
  {x:812,y:470,angle:-4,scale:1.04,index:2},
  {x:1062,y:554,angle:0,scale:.95,index:3}
];
const PORTRAIT_PLOWS=[
  {x:148,y:390,angle:-9,scale:.59,index:1},
  {x:278,y:475,angle:-4,scale:.68,index:2},
  {x:406,y:560,angle:1,scale:.60,index:3}
];

function drawGround(){
  let b=rect(0,0,W,H,C.paper);
  // Broken slabs of paper, not landscape illustration.
  b+=poly([[0,0],[540,0],[205,470],[0,590]],'#e2e6df');
  b+=poly([[1260,0],[1600,0],[1600,430],[1510,460]],'#f0eee3');
  b+=poly([[0,760],[425,1000],[0,1000]],'#d9e0dd');
  b+=poly([[1465,700],[1600,630],[1600,1000],[1200,1000]],'#d5ddda');
  // Some broad pale overprinted gestures cross the landscape.
  b+=path('M-100 135 Q310 250 550 50 T1150 100', 'none',`stroke="#becdd1" stroke-width="57" opacity=".38"`);
  b+=path('M1080 1180 Q1200 650 1740 560','none',`stroke="#f6f2e7" stroke-width="72" opacity=".65"`);
  return b;
}
function drawPaperGrain(){
  let b='';
  for(let i=0;i<540;i++){
    const x=rr(0,W),y=rr(0,H),sz=rr(.5,2.2);
    b+=circ(x,y,sz,rnd()>.48?'#fff':'#5e7883',`opacity="${rr(.06,.19).toFixed(2)}"`);
  }
  return b;
}
function drawRoad(){
  let b='';
  // A highway is a single dark slice, not a photorealistic place.
  b+=rect(385,-500,825,2000,C.deep);
  b+=rect(407,-500,780,2000,C.road);
  b+=poly([[390,-500],[555,-500],[610,1500],[410,1500]],'#2e4149',`opacity=".55"`);
  b+=poly([[1020,-500],[1188,-500],[1190,1500],[1065,1500]],'#394b50',`opacity=".28"`);
  b+=rect(411,-500,10,2000,C.snow,'opacity=".86"');
  b+=rect(1178,-500,9,2000,C.snow,'opacity=".86"');
  // Lanes are only traces, fractured beneath snow.
  for(const x of [675,940]){
    for(let y=-480;y<1500;y+=105){
      b+=rect(x,y,7,rr(39,65),C.snow,`opacity="${rr(.29,.63).toFixed(2)}"`);
    }
  }
  // Old snow and salt sit in thin parallel linear strata.
  for(let i=0;i<135;i++){
    const x=rr(425,1170),y=rr(-400,1460),len=rr(25,230);
    b+=line(x,y,x+rr(-7,7),y+len,choice(['#71878b','#71878b','#c2d3d2','#17262d']),rr(.6,2.5),`opacity="${rr(.08,.35).toFixed(2)}"`);
  }
  // Cleared dark paths behind the formation, brushed vertically.
  [[568,440],[823,510],[1051,432]].forEach(([x,y])=>{
    b+=path(`M${x-61} ${y+74} L${x-54} 1500 M${x+65} ${y+55} L${x+55} 1500`,'none',`stroke="#6d7a78" stroke-width="7" opacity=".24"`);
    for(let t=0;t<23;t++){
      const dx=rr(-62,62),yt=rr(y+100,1400);
      b+=line(x+dx,yt,x+dx+rr(-3,3),yt+rr(22,160),'#c8d5d0',rr(.4,1.5),`opacity="${rr(.1,.28).toFixed(2)}"`);
    }
  });
  return b;
}
function jaggedRibbon(cx,startY,width,len,fill,alpha){
  const pts=[];
  let step=26;
  for(let y=startY;y<startY+len;y+=step){
    pts.push([cx-width/2+rr(-16,18),y]);
  }
  for(let y=startY+len;y>=startY;y-=step){
    pts.push([cx+width/2+rr(-16,18),y]);
  }
  return poly(pts,fill,`opacity="${alpha}"`);
}
function drawSnow(){
  const weather=stormVal(), abstraction=absVal();
  let b='';
  // The upper highway remains under a continuous geometrically fractured field.
  b+=poly([[420,-500],[1180,-500],[1180,35],[1120,115],[960,73],[880,120],[740,58],[580,125],[420,85]],C.paper2);
  b+=poly([[440,-450],[690,-440],[595,170],[436,65]],'#c8d8db',`opacity=".71"`);
  b+=poly([[956,-440],[1175,-440],[1171,100],[1030,180]],'#c0d2d5',`opacity=".60"`);
  b+=poly([[560,45],[645,55],[605,215],[555,253],[490,231]],C.snow,`opacity=".62"`);
  b+=poly([[1035,48],[1158,-30],[1190,335],[1102,292]],C.snow,`opacity=".6"`);
  // Some hard planes turn the storm into cut-paper shapes.
  for(let i=0;i<20+weather*(55+65*abstraction);i++){
    let x=rr(415,1180),y=rr(-320,480),sz=rr(8,55);
    b+=poly([[x,y],[x+rr(-24,24),y+sz],[x+rr(9,60),y+sz*.3]],choice([C.snow,C.powder,C.ice,'#e8eeeb']),`opacity="${rr(.13,.62).toFixed(2)}"`);
  }
  // Wind lines, disjointed rather than uniformly noisy.
  for(let i=0;i<85+weather*(115+145*abstraction);i++){
    const x=rr(390,1210),y=rr(-330,1400),len=rr(10,130);
    b+=line(x,y,x+rr(-38,-4),y+len,choice([C.snow,C.powder,C.ice]),rr(.7,2.6),`opacity="${rr(.12,.6).toFixed(2)}"`);
  }
  // Snow displacement is tied to an echelon sweep: each truck sits behind and to the right
  // of the one ahead, all pushing snow toward the same shoulder.
  for(const plow of LANDSCAPE_PLOWS){
    b+=grp(drawSnowWake(weather,abstraction),'translate('+(plow.x+6)+' '+(plow.y-8)+') scale('+(plow.scale*1.02)+')');
  }
  return b;
}
function drawSnowWake(weather,abstraction){
  let b='';
  // Front fan: wedge shapes, spatially distinct from vehicle parts.
  b+=poly([[-113,-145],[-220,-231],[-173,-295],[-93,-188]],C.snow,`opacity=".92"`);
  b+=poly([[113,-145],[245,-250],[210,-319],[90,-182]],C.snow,`opacity=".87"`);
  b+=poly([[-119,-175],[2,-260],[123,-173],[0,-179]],'#d4e0df',`opacity=".75"`);
  b+=path('M-116 -161 Q-215 -211 -294 -365 M120 -162 Q260 -243 304 -425','none',`stroke="#f5f4e9" stroke-width="18" opacity=".81"`);
  b+=path('M-112 -157 Q-230 -176 -319 -294 M124 -161 Q255 -219 309 -318','none',`stroke="#9eb8bd" stroke-width="5" opacity=".5"`);
  for(let i=0;i<54+weather*(75+120*abstraction);i++){
    const side=rnd()<.5?-1:1;
    const spread=rr(78,300),distance=rr(145,415),wide=rr(1.5,19)*weather+2;
    const xx=side*spread, yy=-distance;
    if(rnd()<.32){
      b+=line(xx,yy,xx+side*rr(12,64),yy-rr(8,50),choice([C.snow,C.ice,'#ecf4f1']),rr(1,4),`opacity="${rr(.28,.87).toFixed(2)}"`);
    }else{
      b+=poly([[xx,yy],[xx+side*wide,yy-rr(7,38)],[xx+side*rr(4,17),yy+rr(5,22)]],choice([C.snow,C.paper2,C.ice,'#b0c2c7']),`opacity="${rr(.3,.96).toFixed(2)}"`);
    }
  }
  return b;
}
function drawPlow({x,y,angle=0,scale=1,index=1,abstraction=.65}){
  const a=abstraction;
  let b='';
  // Silhouette and mechanical rhythm: one dark chassis, two square bodies, one angled steel blade.
  b+=rect(-68,-121,136,254,'#0e1b20');
  b+=rect(-64,-118,128,250,C.rust);
  b+=rect(-56,13,112,112,'#a94729');
  b+=rect(-46,28,92,79,'#18282e');
  for(let j=0;j<7;j++){
    const yy=29+j*12;
    b+=line(-44,yy,44,yy,'#df9b5d',1.6,`opacity="${f(.72-a*.55)}"`);
  }
  b+=poly([[-57,-115],[57,-115],[60,-14],[-60,-14]],C.orange);
  b+=rect(-46,-101,92,56,'#22353b');
  b+=poly([[-44,-100],[13,-100],[-13,-48],[-43,-48]],'#819b9e',`opacity="${f(.36-a*.2)}"`);
  b+=poly([[21,-100],[44,-100],[44,-47],[-2,-47]],'#415e66');
  b+=rect(-46,-32,92,8,'#edb05e');
  b+=rect(-55,-10,110,17,'#c85529');
  b+=rect(-63,-110,8,86,'#f0a95c');b+=rect(55,-110,8,86,'#f0a95c');
  for(const yy of [-90,67]){
    b+=rect(-78,yy,14,40,C.deep);b+=rect(64,yy,14,40,C.deep);
  }
  for(const xx of [-47,-19,19,47]) b+=rect(xx-5,-130,10,9,C.gold);
  b+=poly([[-61,38],[-46,21],[-46,125],[-61,125]],'#f7ad5b');
  b+=poly([[45,26],[61,16],[61,128],[45,123]],'#a83f21');
  b+=rect(-10,-142,20,20,C.deep);
  // The blade is intentionally angled so every plow pushes snow to the right shoulder.
  b+=poly([[-118,-184],[110,-168],[122,-138],[-108,-154]],'#111f25');
  b+=poly([[-122,-191],[114,-174],[123,-160],[-118,-176]],C.rust);
  b+=poly([[-121,-191],[-12,-183],[114,-174],[-118,-176]],C.gold,`opacity=".94"`);
  b+=line(-112,-166,112,-150,C.snow,3,`opacity=".82"`);
  b+=poly([[-124,-187],[-129,-201],[-113,-197],[-111,-178]],C.deep);
  b+=poly([[112,-173],[124,-186],[122,-160],[109,-156]],C.deep);
  // A shoulder wing blade extends on the right side so the formation reads like highway clearing.
  b+=poly([[59,-102],[104,-95],[106,-40],[59,-47]],'#111f25');
  b+=poly([[59,-104],[110,-96],[111,-81],[59,-88]],C.rust);
  b+=poly([[59,-104],[91,-99],[110,-96],[59,-88]],C.gold,`opacity=".9"`);
  if(a>.12){
    const strength=(a-.12)/.88;
    b+=poly([[-63,-112],[-28,-112],[-48,-71],[-64,-62]],C.gold,`opacity="${f(strength*.46)}"`);
    b+=poly([[22,-101],[62,-90],[59,-23],[2,-47]],C.deep,`opacity="${f(strength*.24)}"`);
    b+=poly([[-58,13],[-14,22],[-38,115],[-65,119]],C.gold,`opacity="${f(strength*.26)}"`);
    b+=poly([[18,18],[66,6],[71,112],[27,93]],C.orange,`opacity="${f(strength*.46)}"`);
    b+=line(-68,5,63,37,C.snow,1.5+4*strength,`opacity="${f(strength*.4)}"`);
    b+=line(-120,-188,120,-171,C.paper2,1+4*strength,`opacity="${f(strength*.45)}"`);
  }
  if(a<.88){
    b+=line(0,-113,0,-42,'#aabfc0',1.2,`opacity="${f(.8-a)}"`);
    b+=line(-38,117,37,117,C.gold,1.4,`opacity="${f(1-a*.65)}"`);
    b+=rect(-30,-13,60,4,C.deep,`opacity="${f(1-a*.5)}"`);
  }
  // Cleared-lane marks trail behind each truck and reinforce the stagger.
  for(let k=0;k<3;k++){
    b+=line(-42+k*36,133,-54+k*43,193,'#dee7df',4-k,`opacity=".28"`);
  }
  b+=`<text x="0" y="87" text-anchor="middle" fill="#dfa478" opacity=".64" font-size="12" font-family="monospace" letter-spacing="2">0${index}</text>`;
  return grp(b,`translate(${x} ${y}) rotate(${angle}) scale(${scale})`);
}

function drawCruze({x,y,angle=-17,abstraction=.65}){
  let b='';
  // An intentionally compact top-down silver Chevrolet Cruze, no emergency beacons.
  b+=path('M-34 -82 Q-40 -70 -42 -54 L-44 60 Q-42 86 -26 98 L26 98 Q42 86 44 60 L42 -54 Q40 -70 34 -82 Z','#101d22');
  b+=path('M-30 -81 Q-36 -68 -36 -50 L-39 60 Q-35 83 -22 89 L22 89 Q35 83 39 60 L36 -50 Q36 -68 30 -81 Z',C.car);
  // Cap / hood / roof/ trunk are simple nested planes.
  b+=poly([[-30,-77],[30,-77],[36,-30],[-36,-30]],'#e4e7e5');
  b+=poly([[-33,-27],[33,-27],[28,-8],[-28,-8]],'#3d5660');
  b+=poly([[-28,-6],[28,-6],[30,47],[-30,47]],'#a9b6b9');
  b+=poly([[-30,50],[30,50],[30,65],[-30,65]],'#4a5d61');
  b+=poly([[-30,66],[30,66],[23,86],[-23,86]],'#d9dede');
  // Chrome highlight and narrow nose become the identifiers, not realistic detailing.
  b+=rect(-28,-82,56,7,'#18272e');
  b+=rect(-20,-77,40,3,'#d5b571');
  b+=poly([[-4,-80],[4,-80],[8,-76],[0,-72],[-8,-76]],'#d3aa49');
  b+=rect(-35,-69,8,10,'#fff1cf');b+=rect(27,-69,8,10,'#fff1cf');
  b+=rect(-31,78,9,5,'#9d5d52');b+=rect(22,78,9,5,'#9d5d52');
  for(const yy of [-42,49]){b+=rect(-46,yy,10,29,'#16242a');b+=rect(36,yy,10,29,'#16242a');}
  if(abstraction<.84){b+=line(-28,25,28,25,'#edf1eb',2,`opacity="${f(.82-abstraction*.8)}"`);}
  // Strong dark stroke around a quiet metallic body.
  return grp(b,`translate(${x} ${y}) rotate(${angle})`);
}
function drawTrajectory(){
  let b='';
  // The Cruze is trying to sneak around on the shoulder side of an echelon formation.
  const d='M 1162 1018 C 1168 920, 1175 832, 1172 748 C 1164 653, 1147 601, 1119 568 C 1097 543, 1084 538, 1068 536';
  b+=path(d,'none',`stroke="#e8d6b4" stroke-width="21" opacity=".17"`);
  b+=path(d,'none',`stroke="${C.crimson}" stroke-width="5" stroke-linecap="square" stroke-dasharray="35 21 5 21" opacity=".95"`);
  b+=poly([[1061,548],[1085,526],[1080,556]],C.crimson);
  for(let i=0;i<5;i++){
    const yy=804+i*38;
    b+=path(`M${1127+i*4} ${yy} Q ${1187+i*7} ${yy+48} ${1194+i*4} ${yy+102}`,'none',`stroke="${C.snow}" stroke-width="${f(3-i*.3)}" opacity=".5"`);
  }
  return b;
}

function drawMargins(){
  let b='';
  // Field notes kept tiny: almost part of the abstraction.
  b+=line(54,85,225,85,'#657f83',1.2,'opacity=".7"');
  b+=`<text x="54" y="70" fill="#415963" font-size="15" letter-spacing="5" font-family="monospace">THREE / ONE</text>`;
  b+=`<text x="54" y="111" fill="#6c8186" font-size="11" letter-spacing="2" font-family="monospace">STORM FRONT   03</text>`;
  b+=`<text x="1370" y="906" fill="#4c6469" font-size="12" letter-spacing="2" font-family="monospace">NO CLEAR PATH</text>`;
  b+=line(1368,925,1532,925,'#899b99',1.2);
  for(let i=0;i<7;i++) b+=line(1370+i*24,935,1370+i*24,943,'#7f9697',1);
  return b;
}
// A separate authored composition for portrait screens. No stretching or cropping
// the desktop painting; the echelon sweep is rearranged for a tall stage.
function drawPortrait(a,w){
  const PW=540,PH=1168;
  let b=rect(0,0,PW,PH,C.paper);
  b+=poly([[0,0],[160,0],[0,460]],'#d6e1df');
  b+=poly([[540,0],[425,0],[540,280]],'#f2efe4');
  b+=poly([[0,885],[100,1060],[0,1168]],'#d8e0db');
  // A long road plane, with an open lane below the wall of plows.
  let world=rect(25,-360,490,1980,C.deep);
  world+=rect(39,-360,463,1980,C.road);
  world+=rect(44,-360,4,1980,C.snow,'opacity=".78"');
  world+=rect(492,-360,5,1980,C.snow,'opacity=".74"');
  world+=poly([[70,-360],[143,-360],[169,1560],[66,1560]],'#3b4e54','opacity=".47"');
  world+=poly([[438,-360],[487,-360],[492,1560],[419,1560]],'#40555a','opacity=".36"');
  for(const x of [205,355]){
    for(let y=-310;y<1550;y+=104){world+=rect(x,y,4,rr(40,64),C.snow,`opacity="${rr(.27,.65).toFixed(2)}"`);}
  }
  for(let i=0;i<230;i++){
    let x=rr(50,490),y=rr(0,1390),dy=rr(18,120);
    world+=line(x,y,x+rr(-8,8),y+dy,choice(['#b6c5c5','#71868d','#778d92','#182b30']),rr(.5,2.3),`opacity="${rr(.08,.33).toFixed(2)}"`);
  }
  // The storm is concentrated *ahead* of the three steel blades.
  world+=poly([[38,0],[500,0],[490,135],[418,165],[365,114],[291,194],[192,145],[98,184],[37,100]],'#f6f4e9','opacity=".89"');
  world+=poly([[39,0],[180,0],[125,210],[54,350]],'#c1d2d5','opacity=".53"');
  world+=poly([[395,0],[499,0],[496,315],[461,279]],'#c2d3d5','opacity=".59"');
  for(let i=0;i<55+w*165;i++){
    const x=rr(24,516),y=rr(-100,530),s=rr(5,41);
    world+=poly([[x,y],[x+rr(-18,18),y+s],[x+rr(4,43),y+rr(0,s)]],choice([C.snow,C.powder,C.ice,C.paper2]),`opacity="${rr(.18,.7).toFixed(2)}"`);
  }
  for(let i=0;i<40+w*110;i++){
    let x=rr(28,510),y=rr(-100,950);
    world+=line(x,y,x+rr(-24,8),y+rr(14,92),C.snow,rr(.8,2.5),`opacity="${rr(.15,.55).toFixed(2)}"`);
  }
  // Wakes, plows and escaping car remain separate, editable marks.
  const plows=PORTRAIT_PLOWS;
  for(const plow of plows){
    world+=grp(drawSnowWake(w,a),`translate(${plow.x} ${plow.y-12}) scale(${plow.scale*.76})`);
  }
  if(pathVisible.checked){
    world+=path('M 418 1218 C 415 1087 419 974 419 870 C 425 780 471 708 511 622 C 523 598 524 588 507 571','none',`stroke="${C.crimson}" stroke-width="4" stroke-dasharray="26 18 4 16" opacity=".91"`);
    world+=poly([[500,582],[520,556],[521,588]],C.crimson);
    world+=path('M 412 1068 Q 478 1098 486 1189 M 413 992 Q 485 1017 492 1107','none',`stroke="${C.snow}" stroke-width="4" opacity=".44"`);
  }
  for(const plow of plows)world+=drawPlow({...plow,abstraction:a});
  world+=drawCruze({x:424,y:888,angle:14,abstraction:a});
  // A narrow change of heading adds motion without rotating cars out of frame.
  b+=grp(world,`rotate(${(+heading.value-24)*.17} 270 560)`);
  if(notesVisible.checked){
    b+=`<text x="22" y="65" fill="#3f5d60" font-size="10" letter-spacing="3" font-family="monospace">THREE / ONE</text>`;
    b+=line(22,78,140,78,'#91a7a6',1);
    b+=`<text x="22" y="1120" fill="#3f5d60" font-size="10" letter-spacing="2" font-family="monospace">NO CLEAR PATH</text>`;
  }
  return b;
}
function render(){
  rnd=hash(seed);idCounter=0;
  const portrait=window.matchMedia('(max-aspect-ratio:3/4)').matches;
  if(portrait){
    art.setAttribute('viewBox','0 0 540 1168');
    art.innerHTML=drawPortrait(absVal(),stormVal());
    edition.textContent='EDITION '+String(seed).padStart(3,'0');
    rVal.value=reduce.value;sVal.value=storm.value;headingValue.value=heading.value+'°';
    return;
  }
  art.setAttribute('viewBox','0 0 1600 1000');
  const a=absVal(),w=stormVal();
  const defs=`<defs>
    <clipPath id="frame"><rect width="1600" height="1000"/></clipPath>
    <filter id="soft"><feGaussianBlur stdDeviation="2.5"/></filter>
  </defs>`;
  let paper=drawGround()+drawPaperGrain();
  // Everything in this layer shares a diagonal top-down coordinate system.
  let world=drawRoad()+drawSnow();
  if(pathVisible.checked) world+=drawTrajectory();
  // Each car can be moved and recolored independently.
  for(const plow of LANDSCAPE_PLOWS) world+=drawPlow({...plow,abstraction:a});
  // A silver Cruze, behind the plow line and angling dangerously toward the shoulder side.
  world+=drawCruze({x:1162,y:770,angle:17,abstraction:a});
  let output=defs+`<g clip-path="url(#frame)">${paper}`;
  output+=grp(world,`rotate(${+heading.value} 800 500)`);
  if(notesVisible.checked) output+=drawMargins();
  output+='</g>';
  art.innerHTML=output;
  edition.textContent='EDITION '+String(seed).padStart(3,'0');
  rVal.value=reduce.value;sVal.value=storm.value;headingValue.value=heading.value+'°';
}
function saveBlob(blob,name){
  const url=URL.createObjectURL(blob),link=document.createElement('a');
  link.href=url;link.download=name;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1200);
}
function svgData(){
  const outer=art.cloneNode(true);
  outer.setAttribute('xmlns','http://www.w3.org/2000/svg');
  const vb=art.viewBox.baseVal;
  outer.setAttribute('width',String(vb.width));outer.setAttribute('height',String(vb.height));
  return new XMLSerializer().serializeToString(outer);
}
function exportSvg(){saveBlob(new Blob([svgData()],{type:'image/svg+xml;charset=utf-8'}),`against-the-line-${seed}.svg`);}
function exportPng(){
  const img=new Image(); const url=URL.createObjectURL(new Blob([svgData()],{type:'image/svg+xml;charset=utf-8'}));
  img.onload=()=>{
    const canvas=document.createElement('canvas');
    const portrait=art.viewBox.baseVal.height>art.viewBox.baseVal.width;
    canvas.width=portrait?2000:3200;canvas.height=portrait?4326:2000;
    const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,canvas.width,canvas.height);
    canvas.toBlob(blob=>{if(blob)saveBlob(blob,`against-the-line-${seed}-${canvas.width}x${canvas.height}.png`);URL.revokeObjectURL(url);},'image/png');
  };
  img.onerror=()=>{URL.revokeObjectURL(url);alert('PNG export was blocked by your browser. SVG export is available instead.');};
  img.src=url;
}
// Presentation interface: visual parameters and interface state are independent.
const app=document.getElementById('app');
const panel=document.getElementById('controlPanel');
const panelButton=document.getElementById('togglePanel');
const exportMenu=document.getElementById('exportMenu');
const exportButton=document.getElementById('toggleExport');
const toast=document.getElementById('toast');
const fsButton=document.getElementById('toggleFullscreen');
let toastTimer=0;
let isPanelOpen=window.matchMedia('(min-width:901px)').matches;
let frameMode=window.matchMedia('(max-aspect-ratio:5/4)').matches?'fit':'fill';
function notify(message){
  clearTimeout(toastTimer);toast.textContent=message;toast.hidden=false;
  toastTimer=setTimeout(()=>toast.hidden=true,2200);
}
function setPanel(open){
  isPanelOpen=Boolean(open);panel.hidden=!isPanelOpen;
  panelButton.setAttribute('aria-expanded',String(isPanelOpen));
}
function setMenu(open){
  exportMenu.hidden=!open;exportButton.setAttribute('aria-expanded',String(open));
}
function setHud(show){
  app.dataset.ui=show?'visible':'hidden';
  setMenu(false);
  if(!show){document.getElementById('revealHud').focus({preventScroll:true});notify('Artwork only. Press H or hover at the right edge to restore controls.');}
  else document.getElementById('toggleHud').focus({preventScroll:true});
}
function setFrame(mode){
  frameMode=mode==='fit'?'fit':'fill';
  art.setAttribute('preserveAspectRatio',frameMode==='fit'?'xMidYMid meet':'xMidYMid slice');
  document.getElementById('fit').setAttribute('aria-pressed',String(frameMode==='fit'));
  document.getElementById('fill').setAttribute('aria-pressed',String(frameMode==='fill'));
}
function nextSeed(){seed=(seed*1664525+1013904223)>>>0;seed%=100000;render();notify('New composition · Edition '+String(seed).padStart(3,'0'));}
function restore(){seed=42;reduce.value=65;storm.value=64;heading.value=24;pathVisible.checked=true;notesVisible.checked=false;render();notify('Original composition restored');}
async function toggleFullscreen(){
  try{
    if(document.fullscreenElement){await document.exitFullscreen();}
    else if(app.requestFullscreen){await app.requestFullscreen();}
    else notify('Fullscreen is not supported in this browser.');
  }catch(err){notify('Browser denied fullscreen. Try its fullscreen shortcut.');}
}
function syncFullscreen(){
  const active=Boolean(document.fullscreenElement);
  fsButton.setAttribute('aria-pressed',String(active));
  fsButton.title=active?'Exit fullscreen (F)':'Enter fullscreen (F)';
  document.getElementById('fullscreenLabel').textContent=active?'Exit fullscreen':'Fullscreen';
}
[reduce,storm,heading].forEach(input=>input.addEventListener('input',render));
[pathVisible,notesVisible].forEach(input=>input.addEventListener('change',render));
panelButton.addEventListener('click',()=>setPanel(!isPanelOpen));
document.getElementById('closePanel').addEventListener('click',()=>setPanel(false));
document.getElementById('reset').addEventListener('click',restore);
document.getElementById('shuffle').addEventListener('click',nextSeed);
exportButton.addEventListener('click',()=>setMenu(exportMenu.hidden));
document.getElementById('saveSvg').addEventListener('click',()=>{setMenu(false);exportSvg();notify('Vector artwork exported');});
document.getElementById('savePng').addEventListener('click',()=>{setMenu(false);exportPng();notify('Preparing print-quality PNG');});
document.getElementById('toggleHud').addEventListener('click',()=>setHud(false));
document.getElementById('revealHud').addEventListener('click',()=>setHud(true));
document.getElementById('toggleFullscreen').addEventListener('click',toggleFullscreen);
document.getElementById('fit').addEventListener('click',()=>setFrame('fit'));
document.getElementById('fill').addEventListener('click',()=>setFrame('fill'));
document.addEventListener('fullscreenchange',syncFullscreen);
document.addEventListener('pointerdown',e=>{
  if(!exportMenu.hidden && !exportMenu.contains(e.target) && !exportButton.contains(e.target))setMenu(false);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){setMenu(false);return;}
  if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName) || e.altKey || e.ctrlKey || e.metaKey || e.repeat)return;
  const key=e.key.toLowerCase();
  if(key==='h'){e.preventDefault();setHud(app.dataset.ui==='hidden');}
  if(key==='r'){e.preventDefault();nextSeed();}
  if(key==='f'){e.preventDefault();toggleFullscreen();}
  if(key==='c'){e.preventDefault();setHud(true);setPanel(!isPanelOpen);}
});
setPanel(isPanelOpen);
setFrame(frameMode);
let lastPortrait=window.matchMedia('(max-aspect-ratio:3/4)').matches;
window.addEventListener('resize',()=>{const now=window.matchMedia('(max-aspect-ratio:3/4)').matches;if(now!==lastPortrait){lastPortrait=now;render();}});
render();
</script>
