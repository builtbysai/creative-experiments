  var PALETTES = [
    { name: "Bone",     kind: "wash",    bg: ["#f4f1e8", "#e6ddc8"], ink: "#1b1815", dark: false },
    { name: "Amber",    kind: "glow",    bg: ["#2e1604", "#c96a1b", "#f2b13d"], ink: "#221105", dark: false },
    { name: "Inverted", kind: "wash",    bg: ["#101012", "#000000"], ink: "#f2ede2", dark: true },
    { name: "Rainbow",  kind: "stripes", bg: ["#ff3b1f", "#ff9a1f", "#ffe81f", "#3ddc5f", "#22d3ee", "#a855f7"], ink: "#141414", dark: false },
    { name: "Ash",      kind: "glow",    bg: ["#f0f0f0", "#8f8f8f", "#232323"], ink: "#0e0e0e", dark: false },
    { name: "Ember",    kind: "wash",    bg: ["#1c1611", "#0d0b09"], ink: "#f2ddab", dark: true }
  ];

  var cv = document.getElementById("pieceCanvas");
  var ctx = cv.getContext("2d");
  var seed = (Math.random() * 1e9) | 0;

  function paintBackground(g, pal, rng) {
    if (pal.kind === "stripes") {
      var cols = pal.bg.slice();
      // shuffle stripe order per view
      for (var i = cols.length - 1; i > 0; i--) {
        var j = (rng() * (i + 1)) | 0, t = cols[i]; cols[i] = cols[j]; cols[j] = t;
      }
      var y = 0, k = 0;
      while (y < H) {
        var h = H * (0.08 + rng() * 0.16);
        g.fillStyle = cols[k % cols.length];
        g.fillRect(0, y, W, h + 1);
        y += h; k++;
      }
    } else if (pal.kind === "glow") {
      var cx = W * (0.3 + rng() * 0.4), cy = H * (0.3 + rng() * 0.4);
      var gr = g.createRadialGradient(cx, cy, 40, cx, cy, W * 0.75);
      gr.addColorStop(0, pal.bg[pal.bg.length - 1]);
      gr.addColorStop(0.55, pal.bg[1] || pal.bg[0]);
      gr.addColorStop(1, pal.bg[0]);
      g.fillStyle = gr;
      g.fillRect(0, 0, W, H);
    } else {
      var ang = rng() * Math.PI * 2;
      var x0 = W/2 - Math.cos(ang) * W/2, y0 = H/2 - Math.sin(ang) * H/2;
      var x1 = W/2 + Math.cos(ang) * W/2, y1 = H/2 + Math.sin(ang) * H/2;
      var lg = g.createLinearGradient(x0, y0, x1, y1);
      lg.addColorStop(0, pal.bg[0]);
      lg.addColorStop(1, pal.bg[pal.bg.length - 1]);
      g.fillStyle = lg;
      g.fillRect(0, 0, W, H);
    }
    // grain
    var n = 900 + ((rng() * 900) | 0);
    g.fillStyle = pal.dark ? "rgba(255,240,210,1)" : "rgba(20,12,6,1)";
    for (var s = 0; s < n; s++) {
      g.globalAlpha = 0.02 + rng() * 0.05;
      var sz = 1 + rng() * 2.2;
      g.fillRect(rng() * W, rng() * H, sz, sz);
    }
    g.globalAlpha = 1;
    // vignette
    var vg = g.createRadialGradient(W/2, H/2, W*0.28, W/2, H/2, W*0.74);
    vg.addColorStop(0, "rgba(0,0,0,0)");
    vg.addColorStop(1, pal.dark ? "rgba(0,0,0,0.5)" : "rgba(20,10,4,0.38)");
    g.fillStyle = vg;
    g.fillRect(0, 0, W, H);
  }

  function strokeOutline(g, pal, progress) {
    g.strokeStyle = pal.ink;
    g.lineWidth = pal.dark ? 2.0 : 2.6;
    g.lineCap = "round";
    g.lineJoin = "round";
    g.globalAlpha = 0.92;
    var total = LINES.length;
    var upto = Math.max(1, Math.floor(total * progress));
    g.beginPath();
    for (var i = 0; i < upto; i++) {
      var ln = LINES[i];
      g.moveTo(ln[0][0], ln[0][1]);
      for (var k = 1; k < ln.length; k++) g.lineTo(ln[k][0], ln[k][1]);
    }
    g.stroke();
    g.globalAlpha = 1;
    if (progress >= 1) {
      // ember eye: ring + glow
      g.strokeStyle = "rgba(255,138,61,0.92)";
      g.lineWidth = 2.4;
      eyeLoops.slice(0, 3).forEach(function (e) {
        g.beginPath();
        g.arc(e.cx, e.cy, Math.max(4, e.r), 0, 6.2832);
        g.stroke();
      });
      var gr = g.createRadialGradient(eye.cx, eye.cy, 1, eye.cx, eye.cy, 52);
      gr.addColorStop(0, "rgba(255,140,60,0.55)");
      gr.addColorStop(0.4, "rgba(255,110,40,0.22)");
      gr.addColorStop(1, "rgba(255,110,40,0)");
      g.fillStyle = gr;
      g.beginPath();
      g.arc(eye.cx, eye.cy, 52, 0, 6.2832);
      g.fill();
    }
  }

  var anim = null;
  function dealView(newSeed) {
    if (anim) cancelAnimationFrame(anim);
    seed = (newSeed === undefined) ? ((Math.random() * 1e9) | 0) : newSeed;
    var rng = mulberry32(seed);
    var pal = PALETTES[(rng() * PALETTES.length) | 0];
    paintBackground(ctx, pal, rng);
    document.getElementById("seedLine").textContent =
      "№ " + seed.toString(16) + " · " + pal.name;
    if (reduced) { strokeOutline(ctx, pal, 1); return; }
    var t0 = performance.now(), dur = 1400;
    // repaint bg each frame so the outline draws over a fresh field
    var bgSnap = document.createElement("canvas");
    bgSnap.width = W; bgSnap.height = H;
    bgSnap.getContext("2d").drawImage(cv, 0, 0);
    function frame(t) {
      var p = Math.min(1, (t - t0) / dur);
      ctx.drawImage(bgSnap, 0, 0);
      strokeOutline(ctx, pal, p);
      if (p < 1) anim = requestAnimationFrame(frame);
      else anim = null;
    }
    anim = requestAnimationFrame(frame);
  }

  document.getElementById("viewBtn").addEventListener("click", function () { dealView(); });
  dealView(seed);
})();
</script>
</body>
