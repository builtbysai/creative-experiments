<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a3a5c" />
  <title>Aurelia Study V7 — Living Jellyfish</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { width:100%; height:100%; margin:0; overflow:hidden; background:#0a1e32; }
    body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    #stage { position:fixed; inset:0; overflow:hidden; background:#0a1e32; }
    canvas { width:100%; height:100%; display:block; touch-action:none; cursor:crosshair; }
    .veil {
      position:absolute; inset:0; pointer-events:none; z-index:4;
      background:
        radial-gradient(ellipse at 50% 30%, transparent 35%, rgba(8,28,52,.18) 72%, rgba(4,12,28,.55) 120%),
        linear-gradient(180deg, rgba(140,190,230,.06), transparent 30%, rgba(4,14,28,.2) 100%);
    }
    .grain {
      position:absolute; inset:-50%; pointer-events:none; z-index:5; opacity:.028;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.88' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.5'/%3E%3C/svg%3E");
      animation:grain .35s steps(2) infinite;
    }
    @keyframes grain {
      0%{transform:translate3d(0,0,0)}
      25%{transform:translate3d(2%,-3%,0)}
      50%{transform:translate3d(-3%,2%,0)}
      75%{transform:translate3d(3%,3%,0)}
      100%{transform:translate3d(-2%,-2%,0)}
    }
    .hint {
      position:absolute; z-index:7; left:50%; bottom:max(18px, env(safe-area-inset-bottom));
      transform:translateX(-50%);
      padding:9px 14px; border:1px solid rgba(200,230,255,.12); border-radius:999px;
      background:rgba(6,20,40,.35); backdrop-filter:blur(18px) saturate(160%);
      -webkit-backdrop-filter:blur(18px) saturate(160%);
      color:rgba(220,240,255,.55); font-size:10px; letter-spacing:.14em; text-transform:uppercase;
      transition:opacity 1.5s ease, transform 1.5s ease; pointer-events:none; user-select:none;
      box-shadow:0 16px 48px rgba(0,0,0,.25), inset 0 1px rgba(255,255,255,.03);
    }
    .hint.hide { opacity:0; transform:translate(-50%,14px); }
    .loading {
      position:absolute; inset:0; display:grid; place-items:center; z-index:10;
      background:#0a1e32; color:rgba(200,230,250,.5); font-size:10px;
      letter-spacing:.2em; text-transform:uppercase;
      transition:opacity 1.1s ease, visibility 1.1s ease;
    }
    .loading.done { opacity:0; visibility:hidden; }
    .fallback {
      position:absolute; inset:0; z-index:20; display:none; place-items:center;
      padding:28px; text-align:center; color:rgba(220,235,250,.8);
      background:#0a1e32; font-size:14px; line-height:1.55;
    }
    @media (max-width:720px) {
      .hint { font-size:9px; bottom:max(12px, env(safe-area-inset-bottom)); }
    }
    @media (prefers-reduced-motion: reduce) {
      .grain, .hint { display:none; }
    }
  </style>
</head>
<body>
  <main id="stage" aria-label="Interactive procedural jellyfish simulation">
    <div class="loading" id="loading">deepening water</div>
    <div class="fallback" id="fallback">This study needs WebGL 2. Please open it in a current Chrome, Edge, Firefox, or Safari.</div>
    <div class="veil"></div>
    <div class="grain"></div>
    <div class="hint" id="hint">move through the water · tap to disturb</div>
  </main>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

    const stage = document.querySelector('#stage');
    const loading = document.querySelector('#loading');
    const fallback = document.querySelector('#fallback');
    const hint = document.querySelector('#hint');

    const probe = document.createElement('canvas');
    const gl = probe.getContext('webgl2', { antialias: true });
    if (!gl) {
      fallback.style.display = 'grid';
      loading.style.display = 'none';
      throw new Error('WebGL2 unavailable');
    }

    const isMobile = innerWidth < 760;
    const quality = isMobile ? 0.65 : 1.0;

    // ── RNG ───────────────────────────────────────────────────
    function mulberry32(a) {
      return function () {
        let t = (a += 0x6d2b79f5);
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }
    const rnd = mulberry32(0xc0ffee);
    const rr = (a, b) => a + (b - a) * rnd();
    const clamp01 = (v) => Math.max(0, Math.min(1, v));
    const smoothstep = (a, b, x) => {
      const t = clamp01((x - a) / (b - a));
      return t * t * (3 - 2 * t);
    };
    function hash11(x) {
      const s = Math.sin(x * 127.1) * 43758.5453123;
      return s - Math.floor(s);
    }
    function noise1(x) {
      const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f);
      return THREE.MathUtils.lerp(hash11(i), hash11(i + 1), u) * 2 - 1;
    }

    // ── Color morphs (inspired by real Aurelia + Aki Rodić) ──
    // Warm coral / peach / amber / rose + cooler cyan morphs
    const MORPHS = [
      { name: 'coral',   bell: 0xf2b898, gonad: 0xe84838, canal: 0xff7a58, tent: 0xf0c8b0, glow: 0xffa078 },
      { name: 'amber',   bell: 0xf5d0a0, gonad: 0xd07828, canal: 0xe89840, tent: 0xf5d8b0, glow: 0xffc060 },
      { name: 'rose',    bell: 0xf2b0b8, gonad: 0xd03858, canal: 0xe86880, tent: 0xf0c0c8, glow: 0xff90a0 },
      { name: 'peach',   bell: 0xf5c8a8, gonad: 0xe06040, canal: 0xf09068, tent: 0xf5d8c0, glow: 0xffb088 },
      { name: 'honey',   bell: 0xf0d8a8, gonad: 0xc88030, canal: 0xd8a050, tent: 0xf0e0c0, glow: 0xffd070 },
      { name: 'cyan',    bell: 0xc8e0ec, gonad: 0x3898b8, canal: 0x68c0d8, tent: 0xd8ecf4, glow: 0x88d8e8 },
      { name: 'lavender',bell: 0xe0cce8, gonad: 0x8058a8, canal: 0xa888c8, tent: 0xe8dcf0, glow: 0xb8a0d8 },
      { name: 'opal',    bell: 0xd4ecec, gonad: 0x58a8b0, canal: 0x88c8d0, tent: 0xe8f4f4, glow: 0x98dce0 },
    ];

    // ── Renderer ──────────────────────────────────────────────
    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: false,
      powerPreference: 'high-performance',
    });
    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, isMobile ? 1.3 : 1.7));
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.12;
    renderer.setClearColor(0x0a1e32, 1);
    stage.prepend(renderer.domElement);

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x0c2438, 0.032);

    const camera = new THREE.PerspectiveCamera(36, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(0, 0.4, 14);
    const cameraTarget = new THREE.Vector3(0, 0.2, 0);

    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloom = new UnrealBloomPass(
      new THREE.Vector2(innerWidth, innerHeight),
      0.8 * quality,
      0.48,
      0.82
    );
    composer.addPass(bloom);
    composer.addPass(new OutputPass());

    // ── Soft blue background (Aki-style) ──────────────────────
    const bgMat = new THREE.ShaderMaterial({
      depthWrite: false,
      depthTest: false,
      uniforms: {
        uTime: { value: 0 },
        uAspect: { value: innerWidth / innerHeight },
      },
      vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,1.,1.); }`,
      fragmentShader: `
        varying vec2 vUv; uniform float uTime; uniform float uAspect;
        float h(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
        float n(vec2 p){
          vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
          return mix(mix(h(i),h(i+vec2(1,0)),f.x), mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x), f.y);
        }
        float fbm(vec2 p){
          float s=0., a=.5;
          for(int i=0;i<5;i++){ s+=a*n(p); p=p*2.08+vec2(11.3,7.1); a*=.5; }
          return s;
        }
        float caustics(vec2 p){
          p *= 1.3;
          float c = 0.;
          for(int i=0;i<3;i++){
            float t = uTime*(.022 + .01*float(i));
            vec2 q = p + vec2(sin(t+p.y*1.6), cos(t*1.1+p.x*1.9))*0.2;
            float a = abs(fract(q.x)-.5);
            float b = abs(fract(q.y)-.5);
            c += pow(1.0-min(min(a,b)*2.0,1.0), 5.5);
            p = mat2(.82,-.57,.57,.82)*p*1.32;
          }
          return c/3.0;
        }
        void main(){
          vec2 p=vUv; vec2 q=(p-.5)*vec2(uAspect,1.0);
          float depth=smoothstep(.0,1.,1.-p.y);
          // Soft sky-to-deep gradient like Aki's demo
          vec3 top=vec3(.42,.58,.78);
          vec3 mid=vec3(.22,.42,.62);
          vec3 deep=vec3(.08,.18,.32);
          vec3 col=mix(top,mid,smoothstep(.0,.45,depth));
          col=mix(col,deep,smoothstep(.4,1.,depth));
          float haze=fbm(q*1.1 + vec2(0.,uTime*.008));
          col += vec3(.04,.08,.12)*(haze-.4)*.35;
          float c = caustics(q*1.4 + vec2(0.,uTime*.008));
          col += vec3(.08,.16,.22)*c*(1.0-depth)*.28;
          float center=1.-smoothstep(.1,1.2,length(q*vec2(.7,1.0)));
          col += vec3(.05,.1,.16)*center*.25;
          gl_FragColor=vec4(col,1.);
        }`,
    });
    const bg = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), bgMat);
    bg.frustumCulled = false;
    bg.renderOrder = -1000;
    scene.add(bg);

    // ── Caustic light planes ──────────────────────────────────
    function makeCausticsPlane(depth, scale, opacity, speed, tint) {
      const mat = new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: false,
        depthTest: false,
        blending: THREE.AdditiveBlending,
        uniforms: {
          uTime: { value: 0 },
          uOpacity: { value: opacity },
          uTint: { value: new THREE.Color(tint) },
        },
        vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
        fragmentShader: `
          varying vec2 vUv; uniform float uTime; uniform float uOpacity; uniform vec3 uTint;
          mat2 r(float a){ float s=sin(a),c=cos(a); return mat2(c,-s,s,c); }
          float bands(vec2 p){
            float sum=0.;
            for(int i=0;i<4;i++){
              p = r(.5) * p * 1.3;
              vec2 q = p + vec2(sin(uTime*.12+float(i)*1.1+p.y*3.5), cos(uTime*.1+float(i)*1.4+p.x*3.5));
              float gx = abs(fract(q.x)-.5);
              float gy = abs(fract(q.y)-.5);
              sum += pow(1.0-min(min(gx,gy)*2.0,1.0), 6.5);
            }
            return sum/4.0;
          }
          void main(){
            vec2 p = (vUv-.5)*vec2(3.4,1.5);
            float c = bands(p + vec2(0., uTime*.025));
            float edge = smoothstep(0.0,0.14,vUv.y) * (1.0-smoothstep(0.86,1.0,vUv.y));
            float a = c * edge * uOpacity;
            gl_FragColor = vec4(uTint, a);
          }`,
      });
      const plane = new THREE.Mesh(new THREE.PlaneGeometry(scale * 4.6, scale * 2), mat);
      plane.position.set(0, rr(-1, 1.2), depth);
      plane.rotation.x = -Math.PI / 2 + rr(-0.1, 0.1);
      plane.rotation.z = rr(-0.3, 0.3);
      plane.userData.speed = speed;
      return plane;
    }
    const causticPlanes = new THREE.Group();
    scene.add(causticPlanes);
    causticPlanes.add(makeCausticsPlane(-9, 7.5, 0.035, 0.38, 0x90d8ff));
    causticPlanes.add(makeCausticsPlane(-4.5, 5, 0.02, 0.52, 0x70c8f0));
    causticPlanes.add(makeCausticsPlane(-2, 3.5, 0.012, 0.65, 0xb0e8ff));

    // ── Soft light shafts ─────────────────────────────────────
    const shaftGroup = new THREE.Group();
    scene.add(shaftGroup);
    const shaftGeo = new THREE.ConeGeometry(1, 20, 14, 1, true);
    shaftGeo.translate(0, -10, 0);
    for (let i = 0; i < (isMobile ? 6 : 10); i++) {
      const m = new THREE.MeshBasicMaterial({
        color: i % 2 ? 0x70b8e0 : 0xa0d8f8,
        transparent: true,
        opacity: rr(0.008, 0.022),
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        side: THREE.DoubleSide,
      });
      const s = new THREE.Mesh(shaftGeo, m);
      s.position.set(rr(-11, 11), 10, rr(-12, -2));
      s.scale.set(rr(0.25, 1.0), 1, rr(0.3, 1.1));
      s.rotation.z = rr(-0.14, 0.14);
      s.rotation.x = rr(-0.08, 0.08);
      s.rotation.y = rr(-Math.PI, Math.PI);
      shaftGroup.add(s);
    }

    // ── Marine snow particles ─────────────────────────────────
    function makeParticleCloud(count, near = false) {
      const geo = new THREE.BufferGeometry();
      const pos = new Float32Array(count * 3);
      const size = new Float32Array(count);
      const seed = new Float32Array(count);
      for (let i = 0; i < count; i++) {
        pos[i * 3] = rr(-15, 15);
        pos[i * 3 + 1] = rr(-11, 11);
        pos[i * 3 + 2] = near ? rr(-10, 3) : rr(-17, 0);
        size[i] = near ? rr(0.8, 2.6) : rr(0.18, 1.3);
        seed[i] = rr(0, 100);
      }
      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      geo.setAttribute('aSize', new THREE.BufferAttribute(size, 1));
      geo.setAttribute('aSeed', new THREE.BufferAttribute(seed, 1));
      const mat = new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        uniforms: { uTime: { value: 0 }, uNear: { value: near ? 1 : 0 } },
        vertexShader: `
          attribute float aSize; attribute float aSeed;
          uniform float uTime; uniform float uNear;
          varying float vA;
          void main(){
            vec3 p = position;
            float rise = (.004 + .0065*aSize);
            p.y += mod(uTime*(rise*85.) + aSeed*13., 22.) - 11.;
            p.x += sin(uTime*.06 + aSeed + p.y)*(.05 + .03*uNear);
            p.z += cos(uTime*.05 + aSeed*2.)*.045*uNear;
            vec4 mv = modelViewMatrix * vec4(p,1.);
            gl_Position = projectionMatrix * mv;
            gl_PointSize = (1.0 + 2.2*aSize) * (290.0 / -mv.z);
            vA = smoothstep(-20., 2., p.z);
          }`,
        fragmentShader: `
          varying float vA;
          void main(){
            vec2 p = gl_PointCoord - .5;
            float d = length(p);
            float a = smoothstep(.46, .02, d) * .11 * vA;
            float core = smoothstep(.2, .01, d) * .06 * vA;
            gl_FragColor = vec4(.7+core, .9, 1., a+core);
          }`,
      });
      return new THREE.Points(geo, mat);
    }
    const farParticles = makeParticleCloud(Math.floor(220 * quality), false);
    const nearParticles = makeParticleCloud(Math.floor(45 * quality), true);
    scene.add(farParticles);
    scene.add(nearParticles);

    // ── Lighting ──────────────────────────────────────────────
    scene.add(new THREE.HemisphereLight(0x90c8e8, 0x0a1828, 1.15));
    const key = new THREE.DirectionalLight(0xe8f4ff, 2.8);
    key.position.set(-2.5, 8, 6);
    scene.add(key);
    const fill = new THREE.PointLight(0x60b0e0, 10, 28, 2);
    fill.position.set(5, 1.5, 5);
    scene.add(fill);
    const warm = new THREE.PointLight(0xffc890, 4.5, 14, 2);
    warm.position.set(-3, 0, 4);
    scene.add(warm);
    const rim = new THREE.PointLight(0xa0d8f0, 3, 18, 2);
    rim.position.set(0, -2, 6);
    scene.add(rim);

    // ── Verlet chain (fluid tentacles) ────────────────────────
    class VerletChain {
      constructor(points, locked = true) {
        this.p = points.map((v) => v.clone());
        this.prev = points.map((v) => v.clone());
        this.rest = [];
        for (let i = 1; i < points.length; i++) this.rest.push(points[i].distanceTo(points[i - 1]));
        this.locked = locked;
        this.anchor = points[0].clone();
      }
      setAnchor(v) { this.anchor.copy(v); }
      impulse(v, falloff = 1) {
        for (let i = 1; i < this.p.length; i++)
          this.prev[i].sub(v.clone().multiplyScalar((i / this.p.length) * falloff));
      }
      step(dt, time, flow, drag = 0.988, gravity = 0.00035, stiffness = 0.95, curl = 0.00014) {
        if (this.locked) {
          this.p[0].copy(this.anchor);
          this.prev[0].copy(this.anchor);
        }
        // dt is already clamped to 1/30 at the animate() call site
        const dt2 = dt * dt * 3600;
        for (let i = 1; i < this.p.length; i++) {
          const cur = this.p[i], old = this.prev[i];
          const vx = (cur.x - old.x) * drag;
          const vy = (cur.y - old.y) * drag;
          const vz = (cur.z - old.z) * drag;
          old.copy(cur);
          const wobble = Math.sin(time * 0.95 + i * 0.85 + cur.x * 2.2) * curl;
          cur.x += vx + flow.x * 0.00055 * dt2 + wobble * dt2 * 0.65;
          cur.y += vy + (flow.y * 0.00028 - gravity * 0.7) * dt2;
          cur.z += vz + flow.z * 0.00045 * dt2 + Math.cos(time * 0.65 + i * 0.55) * curl * 0.45 * dt2;
        }
        for (let it = 0; it < 6; it++) {
          if (this.locked) this.p[0].copy(this.anchor);
          for (let i = 1; i < this.p.length; i++) {
            const a = this.p[i - 1], b = this.p[i];
            const d = b.clone().sub(a);
            const len = Math.max(0.00001, d.length());
            const err = (len - this.rest[i - 1]) / len;
            const corr = d.multiplyScalar(0.5 * err * stiffness);
            if (i > 1 || !this.locked) a.add(corr);
            b.sub(corr);
          }
        }
      }
    }

    // ── Bell geometry ─────────────────────────────────────────
    function makeBellGeometry(radial = 80, rings = 32) {
      const pos = [], uv = [], idx = [];
      for (let y = 0; y <= rings; y++) {
        const t = y / rings;
        for (let x = 0; x <= radial; x++) {
          pos.push(0, 0, 0);
          uv.push(x / radial, t);
        }
      }
      for (let y = 0; y < rings; y++)
        for (let x = 0; x < radial; x++) {
          const a = y * (radial + 1) + x, b = a + 1, c = a + (radial + 1), d = c + 1;
          idx.push(a, c, b, b, c, d);
        }
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
      g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
      g.setIndex(idx);
      return g;
    }

    // Organic bell surface with traveling contraction wave
    function bellPoint(t, a, phase, scale, seed, turnBias, wave) {
      const cyc = ((phase % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
      const s = (Math.sin(cyc) + 1) * 0.5;
      // Wave travels from apex (t=0) toward rim (t=1)
      const waveT = clamp01(t - wave * 0.4);
      const contract = Math.pow(smoothstep(0.12, 0.88, s) * (0.5 + 0.5 * (1 - waveT)), 1.45);
      const relax = Math.pow(1 - contract, 0.75);
      const rim = Math.pow(t, 2.1);

      // Organic lobing + irregularity
      const lobes =
        1 +
        Math.sin(a * 16 + seed) * 0.018 * rim +
        Math.sin(a * 8 - seed * 0.6) * 0.01 * rim +
        Math.sin(a * 4 + seed * 1.3) * 0.006 * rim;
      const irregular = 1 + noise1(a * 2.2 + seed * 3.2) * 0.018 * (0.2 + 0.8 * t);
      const asym = 1 + Math.cos(a - turnBias) * 0.08 * contract * rim;

      // Slightly flatter, more saucer-like (real Aurelia)
      const R = (1.72 - 0.38 * contract * rim - 0.09 * contract * t) * scale;
      const H = (0.58 + 0.22 * contract) * scale;
      const theta = t * Math.PI * 0.5;

      let r = Math.sin(theta) * R * lobes * irregular * asym;
      r *= 1 - 0.13 * contract * Math.pow(t, 4.8);
      let y = Math.cos(theta) * H - H * 0.08;
      y += 0.06 * Math.sin(a * 4 + seed) * Math.pow(t, 2.3) * relax;
      y -= 0.11 * contract * Math.pow(t, 3.4);
      y += Math.cos(a - turnBias) * 0.036 * contract * Math.pow(t, 2.2) * scale;

      // Subtle radial canal ridges
      const canalRidge = Math.sin(a * 8) * 0.012 * scale * Math.pow(t, 1.5) * (1 - contract * 0.4);
      r += canalRidge;

      return new THREE.Vector3(Math.sin(a) * r, y, Math.cos(a) * r);
    }

    // ── Moon Jelly class ──────────────────────────────────────
    class MoonJelly {
      constructor({ position, scale = 1, seed = 1, detail = 1, hero = false, morphIndex = 0 }) {
        this.seed = seed;
        this.scale = scale;
        this.detail = detail;
        this.hero = hero;
        this.morph = MORPHS[morphIndex % MORPHS.length];
        this.group = new THREE.Group();
        this.group.position.copy(position);
        scene.add(this.group);

        this.phase = rr(0, Math.PI * 2);
        this.speed = rr(0.16, 0.26);
        this.charge = 0;
        this.turnBias = rr(-Math.PI, Math.PI);
        this.velocity = new THREE.Vector3(rr(-0.0015, 0.0015), rr(0.001, 0.0035), rr(-0.001, 0.001));
        this.driftSeed = rr(0, 50);
        this.prevContract = 0;
        this.homeBase = position.clone();
        this.schoolId = 0;
        this.laneBias = rr(-0.8, 0.8);
        this.baseRot = new THREE.Euler(rr(-0.2, 0.2), rr(-0.3, 0.3), rr(-0.1, 0.1));
        this.group.rotation.copy(this.baseRot);

        this.makeBell();
        this.makeCanals();
        this.makeGonads();
        this.makeHairTentacles();
        this.makeOralArms();
        // Initialize geometry so first frame is not empty/NaN
        this.updateBell(0.5);
        this.updateCanals(0, 0.5);
      }

      makeBell() {
        const radial = this.hero ? (isMobile ? 72 : 96) : this.detail > 0.65 ? 56 : 36;
        const rings = this.hero ? (isMobile ? 30 : 40) : this.detail > 0.65 ? 22 : 14;
        this.bellGeo = makeBellGeometry(radial, rings);
        this.radial = radial;
        this.rings = rings;

        // Translucent physical material with morph color
        // Base flesh layer — more solid like Aki Rodić's painted bells
        this.bellMat = new THREE.MeshPhysicalMaterial({
          color: new THREE.Color(this.morph.bell),
          roughness: 0.22,
          metalness: 0,
          transmission: 0.55,
          thickness: 1.4 * this.scale,
          ior: 1.36,
          transparent: true,
          opacity: this.hero ? 0.72 : 0.58,
          side: THREE.DoubleSide,
          depthWrite: false,
          iridescence: 0.55,
          iridescenceIOR: 1.18,
          iridescenceThicknessRange: [80, 420],
          clearcoat: 0.4,
          clearcoatRoughness: 0.18,
          attenuationColor: new THREE.Color(this.morph.glow).multiplyScalar(0.75),
          attenuationDistance: 4.2,
          sheen: 0.55,
          sheenColor: new THREE.Color(this.morph.tent),
          sheenRoughness: 0.4,
        });
        this.bell = new THREE.Mesh(this.bellGeo, this.bellMat);
        this.bell.renderOrder = 10;
        this.group.add(this.bell);

        // Soft inner volume glow (subsurface feel)
        this.innerMat = new THREE.MeshBasicMaterial({
          color: this.morph.glow,
          transparent: true,
          opacity: this.hero ? 0.14 : 0.08,
          side: THREE.BackSide,
          depthWrite: false,
          blending: THREE.AdditiveBlending,
        });
        this.inner = new THREE.Mesh(this.bellGeo, this.innerMat);
        this.inner.scale.setScalar(0.96);
        this.inner.renderOrder = 9;
        this.group.add(this.inner);

        // Slightly darker outer shell for edge definition
        this.shellMat = new THREE.MeshBasicMaterial({
          color: this.morph.canal,
          transparent: true,
          opacity: this.hero ? 0.08 : 0.05,
          side: THREE.FrontSide,
          depthWrite: false,
          blending: THREE.NormalBlending,
        });
        this.shell = new THREE.Mesh(this.bellGeo, this.shellMat);
        this.shell.scale.setScalar(1.008);
        this.shell.renderOrder = 11;
        this.group.add(this.shell);

        // Procedural organic overlay (radial canals, mottling, rim)
        this.overlayUniforms = {
          uTime: { value: 0 },
          uGlow: { value: 0 },
          uTint: { value: new THREE.Color(this.morph.canal) },
          uWarm: { value: new THREE.Color(this.morph.gonad) },
          uSeed: { value: this.seed },
        };
        const overlayMat = new THREE.ShaderMaterial({
          transparent: true,
          depthWrite: false,
          side: THREE.DoubleSide,
          blending: THREE.AdditiveBlending,
          uniforms: this.overlayUniforms,
          vertexShader: `
            varying vec2 vUv; varying vec3 vNormalW; varying vec3 vPosW;
            void main(){
              vUv=uv;
              vec4 wp=modelMatrix*vec4(position,1.);
              vPosW=wp.xyz;
              vNormalW=normalize(mat3(modelMatrix)*normal);
              gl_Position=projectionMatrix*viewMatrix*wp;
            }`,
          fragmentShader: `
            varying vec2 vUv; varying vec3 vNormalW; varying vec3 vPosW;
            uniform float uTime; uniform float uGlow; uniform vec3 uTint; uniform vec3 uWarm; uniform float uSeed;
            float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
            float n(vec2 p){
              vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
              return mix(mix(hash(i),hash(i+vec2(1,0)),f.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x), f.y);
            }
            float fbm(vec2 p){ float s=0.,a=.5; for(int i=0;i<4;i++){ s+=a*n(p); p*=2.1; a*=.5; } return s; }
            void main(){
              vec2 p = vUv * 2. - 1.;
              float r = length(p);
              float az = atan(p.x, p.y);

              // Soft tissue base fill (gives solid painted look)
              float tissue = smoothstep(1.05, 0.15, r) * (0.35 + 0.25 * fbm(p * 2.2 + uSeed));
              tissue *= 0.55 + 0.45 * (1.0 - abs(dot(normalize(cameraPosition - vPosW), normalize(vNormalW))));

              // Radial canal lines (8 primary + secondary)
              float canals = 0.;
              canals += 1.0 - smoothstep(0.0, 0.03, abs(sin(az * 8.0 + uSeed)));
              canals += 0.55 * (1.0 - smoothstep(0.0, 0.022, abs(sin(az * 16.0 + uSeed * 1.3))));
              canals *= smoothstep(0.06, 0.78, r) * (1.0 - smoothstep(0.8, 0.99, r));

              // Organic mottling / muscle texture
              float mott = fbm(p * 5.0 + vec2(uSeed, uTime * 0.012));
              mott = smoothstep(0.28, 0.72, mott) * smoothstep(0.1, 0.9, r);

              // Rim ring
              float ring = 1.0 - smoothstep(0.0, 0.055, abs(r - 0.87 + n(vec2(az * 3., uTime * 0.018)) * 0.018));

              // Horseshoe gonad suggestion (4 lobes)
              float gonad = 0.;
              for (int i = 0; i < 4; i++) {
                float ga = float(i) * 1.5708 + 0.785;
                vec2 gc = vec2(cos(ga), sin(ga)) * 0.36;
                float gd = length(p - gc);
                float horseshoe = smoothstep(0.24, 0.1, gd) * smoothstep(0.04, 0.15, gd);
                gonad += horseshoe;
              }
              gonad *= smoothstep(0.15, 0.65, r);

              float fres = pow(1.0 - abs(dot(normalize(cameraPosition - vPosW), normalize(vNormalW))), 2.2);

              vec3 col = uTint * (tissue * 0.45 + canals * 0.4 + mott * 0.18 + ring * 0.32 + fres * (0.2 + 0.3 * uGlow));
              col += uWarm * (gonad * 0.7 + ring * 0.18 + tissue * 0.12);

              float alpha = (tissue * 0.35 + canals * 0.28 + mott * 0.12 + ring * 0.22 + gonad * 0.35 + fres * 0.18)
                          * (0.55 + uGlow * 0.95);
              gl_FragColor = vec4(col, clamp(alpha, 0.0, 0.95));
            }`,
        });
        this.overlay = new THREE.Mesh(this.bellGeo, overlayMat);
        this.overlay.renderOrder = 12;
        this.group.add(this.overlay);

        // Bright rim line
        this.rimGeo = new THREE.BufferGeometry();
        this.rimPos = new Float32Array((radial + 1) * 3);
        this.rimGeo.setAttribute('position', new THREE.BufferAttribute(this.rimPos, 3));
        this.rim = new THREE.Line(
          this.rimGeo,
          new THREE.LineBasicMaterial({
            color: this.morph.canal,
            transparent: true,
            opacity: this.hero ? 0.85 : 0.55,
            depthWrite: false,
            blending: THREE.AdditiveBlending,
          })
        );
        this.rim.renderOrder = 15;
        this.group.add(this.rim);
      }

      makeCanals() {
        const n = this.hero ? (isMobile ? 48 : 64) : this.detail > 0.65 ? 28 : 14;
        const seg = this.hero ? 22 : 12;
        this.canalMeta = [];
        const arr = [];
        for (let i = 0; i < n; i++) {
          const a = (i / n) * Math.PI * 2 + rr(-0.02, 0.02);
          const phase = rr(0, 10);
          const t0 = rr(0.1, 0.22);
          for (let j = 0; j < seg - 1; j++) {
            const tA = t0 + (1 - t0) * (j / (seg - 1));
            const tB = t0 + (1 - t0) * ((j + 1) / (seg - 1));
            this.canalMeta.push({ a, tA, tB, phase });
            arr.push(0, 0, 0, 0, 0, 0);
          }
        }
        this.canalGeo = new THREE.BufferGeometry();
        this.canalPos = new Float32Array(arr);
        this.canalGeo.setAttribute('position', new THREE.BufferAttribute(this.canalPos, 3));
        this.canals = new THREE.LineSegments(
          this.canalGeo,
          new THREE.LineBasicMaterial({
            color: this.morph.canal,
            transparent: true,
            opacity: this.hero ? 0.4 : 0.22,
            depthWrite: false,
            blending: THREE.AdditiveBlending,
          })
        );
        this.canals.renderOrder = 12;
        this.group.add(this.canals);
      }

      makeGonads() {
        // Four horseshoe-shaped gonads — the signature of Aurelia
        this.gonadGroup = new THREE.Group();
        this.gonadGroup.position.y = 0.03 * this.scale;
        this.group.add(this.gonadGroup);

        const loopMat = new THREE.LineBasicMaterial({
          color: this.morph.gonad,
          transparent: true,
          opacity: this.hero ? 1.0 : 0.75,
          depthWrite: false,
          blending: THREE.AdditiveBlending,
        });
        const glowMat = new THREE.LineBasicMaterial({
          color: this.morph.glow,
          transparent: true,
          opacity: this.hero ? 0.4 : 0.18,
          depthWrite: false,
          blending: THREE.AdditiveBlending,
        });

        for (let q = 0; q < 4; q++) {
          const base = q * Math.PI * 0.5 + Math.PI * 0.25;
          const pts = [];
          const seg = this.hero ? 72 : 36;
          for (let i = 0; i <= seg; i++) {
            const a = (i / seg) * Math.PI * 2;
            // Horseshoe: open toward center
            const open = Math.pow(Math.max(0, Math.sin(a * 0.5 + Math.PI * 0.25)), 1.2);
            const r = (0.18 + Math.sin(a) * 0.08) * this.scale * (0.7 + 0.3 * open);
            const center = new THREE.Vector3(
              Math.cos(base) * 0.4 * this.scale,
              0.02 * this.scale,
              Math.sin(base) * 0.4 * this.scale
            );
            const tangent = new THREE.Vector3(-Math.sin(base), 0, Math.cos(base));
            const radial = new THREE.Vector3(Math.cos(base), 0, Math.sin(base));
            const p = center
              .clone()
              .add(tangent.clone().multiplyScalar(Math.cos(a) * r))
              .add(radial.clone().multiplyScalar(Math.sin(a) * r * 0.5));
            pts.push(p);
          }
          const loop = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), loopMat);
          loop.renderOrder = 18;
          this.gonadGroup.add(loop);
          const glow = new THREE.Line(
            new THREE.BufferGeometry().setFromPoints(pts.map((p) => p.clone().multiplyScalar(1.06))),
            glowMat
          );
          glow.renderOrder = 17;
          this.gonadGroup.add(glow);
        }
      }

      makeHairTentacles() {
        // Dense fringe of short marginal tentacles (Aurelia style)
        this.fringe = [];
        const count = this.hero ? (isMobile ? 70 : 120) : this.detail > 0.65 ? 40 : 18;
        const seg = this.hero ? 10 : 6;
        this.fringePos = new Float32Array(count * (seg - 1) * 6);

        for (let i = 0; i < count; i++) {
          const a = (i / count) * Math.PI * 2 + rr(-0.01, 0.01);
          const anchor = bellPoint(1, a, this.phase, this.scale, this.seed, this.turnBias, 0);
          const pts = [anchor.clone()];
          const len = rr(0.6, 1.25) * this.scale * (this.hero ? 1.15 : 0.85);
          for (let j = 1; j < seg; j++) {
            const t = j / (seg - 1);
            const outward = new THREE.Vector3(Math.sin(a), -0.3, Math.cos(a)).normalize();
            pts.push(
              anchor
                .clone()
                .add(outward.clone().multiplyScalar(len * t))
                .add(new THREE.Vector3(rr(-0.02, 0.02), -len * 0.25 * t * t, rr(-0.02, 0.02)))
            );
          }
          this.fringe.push({ a, chain: new VerletChain(pts), len, curl: rr(0.00006, 0.00014) });
        }

        const g = new THREE.BufferGeometry();
        g.setAttribute('position', new THREE.BufferAttribute(this.fringePos, 3));
        const m = new THREE.LineBasicMaterial({
          color: this.morph.tent,
          transparent: true,
          opacity: this.hero ? 0.65 : 0.38,
          depthWrite: false,
          blending: THREE.AdditiveBlending,
        });
        this.fringeMesh = new THREE.LineSegments(g, m);
        this.fringeMesh.renderOrder = 14;
        this.group.add(this.fringeMesh);
      }

      makeOralArms() {
        // Four long, frilly oral arms — the dramatic trailing structures
        this.arms = [];
        const count = 4;
        const seg = this.hero ? (isMobile ? 20 : 28) : 14;

        for (let i = 0; i < count; i++) {
          const a = (i / count) * Math.PI * 2 + Math.PI * 0.25;
          const ribs = [];
          const ribCount = this.hero ? 4 : 2;
          const armGroup = new THREE.Group();
          this.group.add(armGroup);

          for (let r = 0; r < ribCount; r++) {
            const offset = (r - (ribCount - 1) / 2) * 0.07 * this.scale;
            const start = bellPoint(0.32, a, this.phase, this.scale, this.seed, this.turnBias, 0)
              .multiplyScalar(0.68)
              .add(
                new THREE.Vector3(
                  Math.cos(a + Math.PI / 2) * offset,
                  -0.12 * this.scale,
                  Math.sin(a + Math.PI / 2) * offset
                )
              );
            const pts = [start.clone()];
            // Longer oral arms like Aki's demo
            const len = rr(2.2, 3.6) * this.scale * (this.hero ? 1.25 : 0.9);
            for (let j = 1; j < seg; j++) {
              const t = j / (seg - 1);
              // Frilly curl along the arm
              const curl = Math.sin(t * 8 + i * 1.5 + r * 0.7) * 0.2 * this.scale * t;
              const spiral = Math.sin(t * 3 + i) * 0.08 * this.scale * t;
              pts.push(
                start
                  .clone()
                  .add(new THREE.Vector3(Math.cos(a) * curl + Math.sin(a) * spiral, -len * t, Math.sin(a) * curl - Math.cos(a) * spiral))
                  .add(new THREE.Vector3(rr(-0.015, 0.015), 0, rr(-0.015, 0.015)))
              );
            }
            const chain = new VerletChain(pts);
            const verts = new Float32Array((seg - 1) * 6);
            const g = new THREE.BufferGeometry();
            g.setAttribute('position', new THREE.BufferAttribute(verts, 3));
            const mat = new THREE.LineBasicMaterial({
              color: r % 2 ? this.morph.gonad : this.morph.tent,
              transparent: true,
              opacity: this.hero ? 0.5 : 0.28,
              depthWrite: false,
              blending: THREE.AdditiveBlending,
            });
            const line = new THREE.LineSegments(g, mat);
            line.renderOrder = 13;
            armGroup.add(line);
            ribs.push({ a, chain, line, verts, len, offset, curl: rr(0.00009, 0.00018) });
          }
          this.arms.push({ a, ribs });
        }
      }

      disturb(worldPoint, strength = 1) {
        const local = this.group.worldToLocal(worldPoint.clone());
        const d = Math.max(0.3, local.length());
        if (d > 5 * this.scale) return;
        this.charge = Math.max(this.charge, clamp01(strength * (1 - d / (5 * this.scale))));
        this.velocity.x += local.x < 0 ? 0.012 : -0.012;
        this.velocity.y += 0.012 * this.charge;
        this.turnBias += local.x * 0.08;
        const imp = new THREE.Vector3(-local.x, 0.15, -local.z).normalize().multiplyScalar(0.035 * this.charge);
        this.fringe.forEach((f) => f.chain.impulse(imp, 1));
        this.arms.forEach((arm) => arm.ribs.forEach((r) => r.chain.impulse(imp, 1.3)));
      }

      updateBell(wave) {
        const p = this.bellGeo.attributes.position.array;
        for (let y = 0; y <= this.rings; y++) {
          const t = y / this.rings;
          for (let x = 0; x <= this.radial; x++) {
            const a = (x / this.radial) * Math.PI * 2;
            const v = bellPoint(t, a, this.phase, this.scale, this.seed, this.turnBias, wave);
            const k = (y * (this.radial + 1) + x) * 3;
            p[k] = v.x; p[k + 1] = v.y; p[k + 2] = v.z;
          }
        }
        this.bellGeo.attributes.position.needsUpdate = true;
        this.bellGeo.computeVertexNormals();

        for (let x = 0; x <= this.radial; x++) {
          const a = (x / this.radial) * Math.PI * 2;
          const v = bellPoint(1, a, this.phase, this.scale, this.seed, this.turnBias, wave);
          const k = x * 3;
          this.rimPos[k] = v.x; this.rimPos[k + 1] = v.y; this.rimPos[k + 2] = v.z;
        }
        this.rimGeo.attributes.position.needsUpdate = true;
      }

      updateCanals(time, wave) {
        let k = 0;
        for (const m of this.canalMeta) {
          const bend = (t) => Math.sin(t * 9 + m.phase + time * 0.12) * 0.016 * this.scale * t;
          const aA = m.a + bend(m.tA), aB = m.a + bend(m.tB);
          const A = bellPoint(m.tA, aA, this.phase, this.scale * 0.993, this.seed, this.turnBias, wave);
          A.y -= 0.014 * this.scale;
          const B = bellPoint(m.tB, aB, this.phase, this.scale * 0.993, this.seed, this.turnBias, wave);
          B.y -= 0.014 * this.scale;
          this.canalPos[k++] = A.x; this.canalPos[k++] = A.y; this.canalPos[k++] = A.z;
          this.canalPos[k++] = B.x; this.canalPos[k++] = B.y; this.canalPos[k++] = B.z;
        }
        this.canalGeo.attributes.position.needsUpdate = true;
      }

      updatePhysics(dt, time, flow, wave) {
        let o = 0;
        for (const f of this.fringe) {
          const anchor = bellPoint(1, f.a, this.phase, this.scale, this.seed, this.turnBias, wave);
          f.chain.setAnchor(anchor);
          f.chain.step(dt, time, flow, 0.988, 0.00015, 0.98, f.curl);
          for (let j = 0; j < f.chain.p.length - 1; j++) {
            const A = f.chain.p[j], B = f.chain.p[j + 1];
            this.fringePos[o++] = A.x; this.fringePos[o++] = A.y; this.fringePos[o++] = A.z;
            this.fringePos[o++] = B.x; this.fringePos[o++] = B.y; this.fringePos[o++] = B.z;
          }
        }
        this.fringeMesh.geometry.attributes.position.needsUpdate = true;

        for (const arm of this.arms) {
          for (const rib of arm.ribs) {
            const start = bellPoint(0.32, rib.a, this.phase, this.scale, this.seed, this.turnBias, wave)
              .multiplyScalar(0.68)
              .add(
                new THREE.Vector3(
                  Math.cos(rib.a + Math.PI / 2) * rib.offset,
                  -0.12 * this.scale,
                  Math.sin(rib.a + Math.PI / 2) * rib.offset
                )
              );
            rib.chain.setAnchor(start);
            rib.chain.step(dt, time, flow, 0.991, 0.00024, 0.92, rib.curl);
            let ptr = 0;
            for (let j = 0; j < rib.chain.p.length - 1; j++) {
              const A = rib.chain.p[j], B = rib.chain.p[j + 1];
              rib.verts[ptr++] = A.x; rib.verts[ptr++] = A.y; rib.verts[ptr++] = A.z;
              rib.verts[ptr++] = B.x; rib.verts[ptr++] = B.y; rib.verts[ptr++] = B.z;
            }
            rib.line.geometry.attributes.position.needsUpdate = true;
          }
        }
      }

      update(dt, time, pointerWorld, schoolForce = null) {
        const phaseSpeed = this.speed * (1 + this.charge * 0.28);
        this.phase += dt * phaseSpeed * Math.PI * 2;
        this.charge *= Math.pow(0.09, dt);

        const s = (Math.sin(this.phase) + 1) * 0.5;
        const contract = Math.pow(smoothstep(0.12, 0.88, s), 1.45);
        const wave = (Math.sin(this.phase * 0.5 + this.seed) * 0.5 + 0.5);
        const contractionVelocity = Math.max(0, contract - this.prevContract);
        this.prevContract = contract;
        if (contractionVelocity > 0.01) this.velocity.y += contractionVelocity * 0.022;

        const nx = noise1(time * 0.048 + this.driftSeed);
        const nz = noise1(time * 0.042 + this.driftSeed + 11);
        const flow = new THREE.Vector3(nx * 0.06, 0.008 + nz * 0.004, nz * 0.045);

        if (schoolForce) {
          this.velocity.x += schoolForce.x;
          this.velocity.y += schoolForce.y;
          this.velocity.z += schoolForce.z;
          if (schoolForce.lengthSq() > 1e-7) {
            const schoolHeading = Math.atan2(schoolForce.x, schoolForce.z);
            this.turnBias = THREE.MathUtils.lerp(this.turnBias, schoolHeading, 0.006);
          }
        }
        this.velocity.x += nx * 0.00004;
        this.velocity.z += nz * 0.000028;
        const maxSpeed = this.hero ? 0.0115 : 0.007 + this.scale * 0.0013;
        if (this.velocity.length() > maxSpeed) this.velocity.setLength(maxSpeed);
        this.velocity.multiplyScalar(Math.pow(0.991, dt * 60));
        this.group.position.addScaledVector(this.velocity, dt * 60);
        this.group.position.y += dt * (0.005 + 0.007 * this.detail);

        if (pointerWorld) {
          const d = this.group.position.distanceTo(pointerWorld);
          if (d < 5 * this.scale) {
            const away = this.group.position.clone().sub(pointerWorld);
            away.y *= 0.2;
            away.normalize();
            const f = (1 - d / (5 * this.scale)) * dt * 0.024;
            this.velocity.addScaledVector(away, f);
            this.turnBias += away.x * 0.005;
            this.charge = Math.max(this.charge, (1 - d / (5 * this.scale)) * 0.15);
          }
        }

        const heading = Math.atan2(this.velocity.x, this.velocity.z);
        const tiltX = this.baseRot.x + this.velocity.z * 4.8 + noise1(time * 0.045 + this.seed) * 0.06;
        const tiltZ = this.baseRot.z - this.velocity.x * 4.8 + noise1(time * 0.04 + this.seed + 4) * 0.05;
        this.group.rotation.x = THREE.MathUtils.lerp(this.group.rotation.x, tiltX, 0.018);
        this.group.rotation.z = THREE.MathUtils.lerp(this.group.rotation.z, tiltZ, 0.018);
        this.group.rotation.y = THREE.MathUtils.lerp(
          this.group.rotation.y,
          heading * 0.1 + this.baseRot.y + Math.sin(time * 0.015 + this.seed) * 0.04,
          0.01
        );

        // Soft wrap boundaries
        if (this.group.position.y > 8.5) this.group.position.y = -8.5;
        if (this.group.position.x > 11) this.group.position.x = -11;
        if (this.group.position.x < -11) this.group.position.x = 11;

        this.updateBell(wave);
        this.updateCanals(time, wave);
        this.updatePhysics(dt, time, flow, wave);

        // Pulse-driven emissive + overlay glow
        const pulseGlow = 0.12 + contract * 0.25 + this.charge * 0.55;
        this.bellMat.emissive.set(this.morph.glow);
        this.bellMat.emissiveIntensity = pulseGlow * 0.45;
        this.overlayUniforms.uTime.value = time;
        this.overlayUniforms.uGlow.value = 0.3 + contract * 0.6 + this.charge * 0.9;
        this.gonadGroup.scale.setScalar(1 - 0.08 * contract);
      }
    }

    // ── Spawn school ──────────────────────────────────────────
    const jellies = [];
    const heroMorph = 0; // coral
    const hero = new MoonJelly({
      position: new THREE.Vector3(0.1, 0.1, -0.3),
      scale: isMobile ? 0.95 : 1.1,
      seed: 3.1,
      detail: 1,
      hero: true,
      morphIndex: heroMorph,
    });
    hero.baseRot.x = -0.48;
    hero.baseRot.z = 0.05;
    hero.group.rotation.copy(hero.baseRot);
    jellies.push(hero);

    function spawnField(count, xRange, yRange, zRange, scaleRange, detailRange, pad, schoolId, morphPool) {
      let attempts = 0;
      while (count > 0 && attempts < 2200) {
        attempts++;
        const pos = new THREE.Vector3(rr(xRange[0], xRange[1]), rr(yRange[0], yRange[1]), rr(zRange[0], zRange[1]));
        let ok = true;
        for (const existing of jellies) {
          const minDist = pad + (existing.scale || 0.5) * 1.5;
          if (existing.group.position.distanceTo(pos) < minDist) { ok = false; break; }
        }
        if (!ok) continue;
        const scale = rr(scaleRange[0], scaleRange[1]);
        const detail = rr(detailRange[0], detailRange[1]);
        const morphIndex = morphPool[Math.floor(rnd() * morphPool.length)];
        const j = new MoonJelly({
          position: pos,
          scale,
          seed: rr(5, 50),
          detail,
          hero: false,
          morphIndex,
        });
        j.schoolId = schoolId;
        j.homeBase.copy(pos);
        j.baseRot.x = rr(-0.9, 0.45);
        j.baseRot.z = rr(-0.22, 0.22);
        j.group.rotation.copy(j.baseRot);
        jellies.push(j);
        count--;
      }
    }

    // Warm morphs for mid-field, mix for depth
    const warmMorphs = [0, 1, 2, 3, 4];
    const coolMorphs = [5, 6, 7];
    const mixedMorphs = [0, 1, 2, 3, 5, 6];

    spawnField(isMobile ? 3 : 5, [-6.2, -1.5], [-4, 4.2], [-6, -2.8], [0.55, 0.82], [0.48, 0.72], 1.9, 1, warmMorphs);
    spawnField(isMobile ? 3 : 5, [1.5, 6.2], [-4, 4.2], [-6.2, -2.8], [0.55, 0.82], [0.48, 0.72], 1.9, 2, warmMorphs);
    spawnField(isMobile ? 3 : 6, [-7.5, -0.6], [-5.5, 5.8], [-11, -6], [0.26, 0.48], [0.2, 0.4], 1.35, 1, mixedMorphs);
    spawnField(isMobile ? 3 : 6, [0.6, 7.5], [-5.5, 5.8], [-11, -6], [0.26, 0.48], [0.2, 0.4], 1.35, 2, mixedMorphs);
    spawnField(isMobile ? 2 : 3, [-2.5, 2.5], [-5.2, 5.2], [-10, -6.5], [0.3, 0.48], [0.18, 0.35], 1.4, 3, coolMorphs);

    // ── Flocking ──────────────────────────────────────────────
    function computeFlockingForces(list) {
      const forces = list.map(() => new THREE.Vector3());
      const tmp = new THREE.Vector3();
      const heroJ = list[0];
      for (let i = 0; i < list.length; i++) {
        const a = list[i];
        const posA = a.group.position;
        const velA = a.velocity;
        const separation = new THREE.Vector3();
        const alignment = new THREE.Vector3();
        const cohesion = new THREE.Vector3();
        let neighbors = 0;

        for (let j = 0; j < list.length; j++) {
          if (i === j) continue;
          const b = list[j];
          const posB = b.group.position;
          tmp.copy(posB).sub(posA);
          const dist = tmp.length();
          const sameSchool = a.schoolId === b.schoolId;
          const preferred = (a.scale + b.scale) * (sameSchool ? 2.4 : 2.8) + (a.hero || b.hero ? 0.9 : 0);
          const neighborRadius = sameSchool ? 4.8 : 3.3;

          if (dist < neighborRadius && sameSchool) {
            neighbors++;
            alignment.add(b.velocity);
            cohesion.add(posB);
          }
          if (dist < preferred) {
            const repel = tmp.clone().normalize().multiplyScalar(-(preferred - dist) / Math.max(preferred, 0.001));
            separation.add(repel.multiplyScalar(sameSchool ? 1.05 : 1.6));
          }
        }

        if (neighbors > 0) {
          alignment.multiplyScalar(1 / neighbors).sub(velA).multiplyScalar(0.00018);
          cohesion.multiplyScalar(1 / neighbors).sub(posA).multiplyScalar(0.000035);
          separation.multiplyScalar(0.0012);
          forces[i].add(separation).add(alignment).add(cohesion);
        } else {
          separation.multiplyScalar(0.0012);
          forces[i].add(separation);
        }

        const home = a.homeBase.clone();
        home.x += Math.sin(elapsed * 0.04 + a.seed) * (0.48 + a.scale * 0.48);
        home.y += Math.cos(elapsed * 0.036 + a.seed * 1.2) * (0.38 + a.scale * 0.2) + a.laneBias * 0.1;
        home.z += Math.sin(elapsed * 0.022 + a.seed * 0.6) * 0.48;
        forces[i].add(home.sub(posA).multiplyScalar(0.000055));

        if (i !== 0) {
          tmp.copy(posA).sub(heroJ.group.position);
          const heroDist = tmp.length();
          const heroKeepout = 2.9 + a.scale + heroJ.scale;
          if (heroDist < heroKeepout) {
            forces[i].add(tmp.normalize().multiplyScalar((heroKeepout - heroDist) * 0.00085));
          }
        }

        if (a.schoolId === 1) forces[i].x += (-2.4 - posA.x) * 0.000045;
        if (a.schoolId === 2) forces[i].x += (2.4 - posA.x) * 0.000045;
        if (a.schoolId === 3) forces[i].x += (0 - posA.x) * 0.000035;

        forces[i].y += (0.1 - posA.y) * 0.000012;
        forces[i].z += (-6.8 - posA.z) * 0.000014;
      }
      return forces;
    }

    // ── Pointer ───────────────────────────────────────────────
    const pointerNdc = new THREE.Vector2(9, 9);
    const pointerHome = new THREE.Vector2(0, 0);
    const pointerSmoothed = new THREE.Vector2(0, 0);
    const raycaster = new THREE.Raycaster();
    const waterPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
    let pointerWorld = null;
    let pointerActive = false;

    function updatePointer(e) {
      const r = renderer.domElement.getBoundingClientRect();
      pointerNdc.x = ((e.clientX - r.left) / r.width) * 2 - 1;
      pointerNdc.y = -(((e.clientY - r.top) / r.height) * 2 - 1);
      pointerActive = true;
    }
    renderer.domElement.addEventListener('pointermove', updatePointer, { passive: true });
    renderer.domElement.addEventListener(
      'pointerdown',
      (e) => {
        updatePointer(e);
        raycaster.setFromCamera(pointerNdc, camera);
        const p = new THREE.Vector3();
        raycaster.ray.intersectPlane(waterPlane, p);
        jellies.forEach((j) => j.disturb(p, 1.05));
        hint.classList.add('hide');
      },
      { passive: true }
    );
    renderer.domElement.addEventListener('pointerleave', () => { pointerActive = false; });

    // ── Animate ───────────────────────────────────────────────
    const clock = new THREE.Clock();
    let elapsed = 0;

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 1 / 30);
      elapsed += dt;

      bgMat.uniforms.uTime.value = elapsed;
      farParticles.material.uniforms.uTime.value = elapsed;
      nearParticles.material.uniforms.uTime.value = elapsed;
      causticPlanes.children.forEach((p, i) => {
        p.material.uniforms.uTime.value = elapsed * ((p.userData.speed || 1) * 0.24);
        p.rotation.z += dt * 0.001 * (i % 2 ? 1 : -1);
      });
      shaftGroup.rotation.y = Math.sin(elapsed * 0.008) * 0.014;
      shaftGroup.children.forEach((s, i) => {
        s.material.opacity =
          (0.004 + 0.006 * (0.5 + 0.5 * Math.sin(elapsed * 0.038 + i * 1.2))) * (i % 2 ? 1 : 0.82);
      });

      pointerSmoothed.lerp(pointerActive ? pointerNdc : pointerHome, 0.011);
      raycaster.setFromCamera(pointerSmoothed, camera);
      const wp = new THREE.Vector3();
      pointerWorld = raycaster.ray.intersectPlane(waterPlane, wp) ? wp : null;

      const flockForces = computeFlockingForces(jellies);
      jellies.forEach((j, idx) => j.update(dt, elapsed, pointerWorld, flockForces[idx]));

      const cx = pointerSmoothed.x * 0.22 + Math.sin(elapsed * 0.015) * 0.06;
      const cy = 0.25 + pointerSmoothed.y * 0.13 + Math.sin(elapsed * 0.013) * 0.035;
      camera.position.x = THREE.MathUtils.lerp(camera.position.x, cx, 0.006);
      camera.position.y = THREE.MathUtils.lerp(camera.position.y, cy, 0.006);
      camera.lookAt(
        cameraTarget.x + pointerSmoothed.x * 0.06,
        cameraTarget.y + pointerSmoothed.y * 0.05,
        cameraTarget.z
      );

      composer.render();
    }

    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(devicePixelRatio || 1, innerWidth < 760 ? 1.3 : 1.7));
      renderer.setSize(innerWidth, innerHeight);
      composer.setSize(innerWidth, innerHeight);
      bgMat.uniforms.uAspect.value = innerWidth / innerHeight;
    });

    requestAnimationFrame(() => {
      loading.classList.add('done');
      setTimeout(() => hint.classList.add('hide'), 5800);
      animate();
    });
  </script>
</body>
</html>
